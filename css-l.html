<!DOCTYPE html>
<html>
<body>
<h2>PoC 4: CSS-based Info Leak</h2>
<button onclick="runCSSLeak()">جرب تسريبات CSS</button>
<div id="target" style="width: 100px; height: 100px;"></div>
<div id="cssLog" style="font-family: monospace; white-space: pre;"></div>

<script>
function log(msg) {
    document.getElementById('cssLog').textContent += msg + '\n';
}

function runCSSLeak() {
    log('=== CSS Leak Hunter ===\n');
    
    const target = document.getElementById('target');
    
    // قائمة بكل الـ CSS properties غير الموثقة أو الخطيرة
    const dangerousProps = [
        '-webkit-clip-path',
        '-webkit-mask-image',
        '-webkit-shape-outside',
        '-webkit-text-fill-color',
        'will-change',
        'transform',
        'backdrop-filter',
        '-webkit-box-reflect',
        'offset-path',
        'clip-path',
        'filter',
        '-webkit-filter',
    ];
    
    // تجربة كل خاصية مع قيم غريبة
    dangerousProps.forEach(prop => {
        const testValues = [
            'url(#invalid)',
            'linear-gradient(0deg, red 0x41414141, blue)',
            'var(--undefined)',
            'calc(100% + 0x1234)',
            'initial',
            'inherit',
            'unset',
            'revert',
            'revert-layer',
        ];
        
        testValues.forEach(val => {
            try {
                target.style[prop] = val;
                const computed = window.getComputedStyle(target)[prop];
                if (computed && computed !== val && computed !== '') {
                    log(`${prop}: ${val} → ${computed}`);
                    
                    // فحص hex في الناتج
                    const hexMatches = computed.match(/0x[0-9a-f]+/i);
                    if (hexMatches) {
                        log(`🔥 HEX LEAK in ${prop}: ${hexMatches[0]}`);
                    }
                }
            } catch(e) {}
        });
    });
    
    // محاولة مع CSS variables
    log('\n=== CSS Variables Test ===');
    target.style.setProperty('--test', '0x41414141');
    const val = getComputedStyle(target).getPropertyValue('--test');
    log(`CSS Variable: ${val}`);
    
    log('\n=== انتهى PoC 4 ===');
}
</script>
</body>
</html>
