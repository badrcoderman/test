<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PS5 FW 13.42 — MSE + Worker Fuzzing PoC</title>
<style>
body{font-family:monospace;background:#0a0a0a;color:#0f0;padding:10px;font-size:12px}
button{background:#1a1a1a;color:#0f0;border:1px solid #0f0;padding:6px 12px;margin:3px;cursor:pointer;font-family:monospace;font-size:11px}
button:hover{background:#0f0;color:#000}
.panel{border:1px solid #333;padding:8px;margin:6px 0;background:#111;border-radius:4px}
.log{background:#000;border:1px solid #222;padding:6px;height:200px;overflow-y:auto;white-space:pre-wrap;font-size:10px}
.ok{color:#0f0}.err{color:#f44}.warn{color:#fa0}.info{color:#0cf}
h2{color:#ff0055;margin:3px 0;font-size:13px}
video{width:240px;height:135px;background:#000;border:1px solid #333;display:block;margin:5px 0}
</style>
</head>
<body>

<h2>🎯 PS5 FW 13.42 — MSE + Worker Fuzzing</h2>

<div class="panel">
<h2>1️⃣ MSE Simple Test</h2>
<video id="v" muted></video>
<button onclick="testMSESimple()">Simple MSE appendBuffer</button>
<button onclick="testMSECorrupt()">Corrupt MP4 append</button>
<button onclick="testMSERace()">Race: seek + append</button>
</div>

<div class="panel">
<h2>2️⃣ Worker Fuzzing</h2>
<button onclick="startWorkerFuzz()">Start Worker Fuzz</button>
<button onclick="stopWorkerFuzz()">Stop Worker</button>
</div>

<div class="panel">
<h2>3️⃣ Canvas 2D Fuzzing</h2>
<button onclick="testCanvasFuzz()">Canvas 2D Fuzz</button>
<button onclick="testCanvasImage()">Canvas Image Data</button>
</div>

<div class="panel">
<h2>4️⃣ Atomics Probe (no SAB)</h2>
<button onclick="probeAtomics()">Probe Atomics</button>
</div>

<div class="panel">
<h2>📝 Log</h2>
<div class="log" id="log"></div>
<button onclick="document.getElementById('log').innerHTML=''">Clear</button>
</div>

<script>
const L = document.getElementById('log');
let worker = null;
let fuzzRunning = false;

function log(msg, cls='info') {
  const d = new Date().toLocaleTimeString('en-GB');
  L.innerHTML += '<div class="'+cls+'">['+d+'] '+msg+'</div>';
  L.scrollTop = L.scrollHeight;
  console.log('['+cls+'] '+msg);
}

// ============================================================
// 1. MSE Simple Tests
// ============================================================
async function testMSESimple() {
  log('=== MSE Simple Test ===', 'ok');
  const v = document.getElementById('v');
  
  try {
    const ms = new MediaSource();
    const url = URL.createObjectURL(ms);
    v.src = url;
    
    await new Promise(r => ms.addEventListener('sourceopen', r, {once:true}));
    log('MediaSource opened', 'ok');
    
    const mime = 'video/mp4; codecs="avc1.42E01E"';
    const supported = MediaSource.isTypeSupported(mime);
    log('isTypeSupported('+mime+'): '+supported, supported?'ok':'warn');
    
    if (!supported) {
      // Try without codecs
      const mime2 = 'video/mp4';
      const supported2 = MediaSource.isTypeSupported(mime2);
      log('isTypeSupported('+mime2+'): '+supported2, supported2?'ok':'warn');
      if (!supported2) {
        URL.revokeObjectURL(url);
        return;
      }
    }
    
    const sb = ms.addSourceBuffer(supported ? mime : 'video/mp4');
    log('SourceBuffer created', 'ok');
    
    // Build minimal valid MP4 (ftyp + moov + mdat)
    const ftyp = new Uint8Array([
      0x00,0x00,0x00,0x20, 0x66,0x74,0x79,0x70,
      0x69,0x73,0x6f,0x6d, 0x00,0x00,0x02,0x00,
      0x69,0x73,0x6f,0x6d, 0x6d,0x70,0x34,0x31,
      0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00
    ]);
    
    // Minimal moov
    const moov = new Uint8Array([
      0x00,0x00,0x00,0x6c, 0x6d,0x6f,0x6f,0x76,
      0x00,0x00,0x00,0x5c, 0x6d,0x76,0x68,0x64,
      0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00,
      0x00,0x00,0x00,0x00, 0x00,0x00,0x03,0xe8,
      0x00,0x00,0x00,0x00, 0x00,0x01,0x00,0x00,
      0x01,0x00,0x00,0x00, 0x00,0x00,0x00,0x00,
      0x00,0x00,0x00,0x00, 0x00,0x01,0x00,0x00,
      0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00,
      0x00,0x00,0x00,0x00, 0x00,0x01,0x00,0x00,
      0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00,
      0x00,0x00,0x00,0x00, 0x40,0x00,0x00,0x00,
      0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00,
      0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00,
      0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00,
      0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00
    ]);
    
    const mdat = new Uint8Array([0x00,0x00,0x00,0x08, 0x6d,0x64,0x61,0x74]);
    
    const data = new Uint8Array(ftyp.length + moov.length + mdat.length);
    data.set(ftyp, 0);
    data.set(moov, ftyp.length);
    data.set(mdat, ftyp.length + moov.length);
    
    log('Appending '+data.length+' bytes...', 'info');
    sb.appendBuffer(data);
    
    await new Promise((resolve, reject) => {
      const t = setTimeout(() => { sb.removeEventListener('updateend', onUp); reject('timeout'); }, 5000);
      const onUp = () => { clearTimeout(t); sb.removeEventListener('error', onErr); resolve(); };
      const onErr = (e) => { clearTimeout(t); sb.removeEventListener('updateend', onUp); reject(e); };
      sb.addEventListener('updateend', onUp);
      sb.addEventListener('error', onErr);
    });
    
    log('appendBuffer completed', 'ok');
    
    if (ms.readyState !== 'closed') {
      ms.endOfStream();
      log('endOfStream called', 'ok');
    }
    
    try { v.play(); } catch(e) {}
    
    setTimeout(() => {
      log('Video readyState: '+v.readyState+', networkState: '+v.networkState, 'info');
      URL.revokeObjectURL(url);
    }, 1000);
    
  } catch(e) {
    log('MSE error: '+e.name+': '+e.message, 'err');
  }
}

async function testMSECorrupt() {
  log('=== MSE Corrupt MP4 ===', 'ok');
  const v = document.getElementById('v');
  
  try {
    const ms = new MediaSource();
    const url = URL.createObjectURL(ms);
    v.src = url;
    
    await new Promise(r => ms.addEventListener('sourceopen', r, {once:true}));
    
    const mime = 'video/mp4';
    if (!MediaSource.isTypeSupported(mime)) {
      log('video/mp4 not supported', 'warn');
      URL.revokeObjectURL(url);
      return;
    }
    
    const sb = ms.addSourceBuffer(mime);
    
    // Corrupt data: atom with size=0xFFFFFFFF
    const corrupt = new Uint8Array([
      0x00,0x00,0x00,0x20, 0x66,0x74,0x79,0x70,
      0x69,0x73,0x6f,0x6d, 0x00,0x00,0x02,0x00,
      0x69,0x73,0x6f,0x6d, 0x6d,0x70,0x34,0x31,
      0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00,
      // mdat with huge size
      0xFF,0xFF,0xFF,0xFF, 0x6d,0x64,0x61,0x74,
      0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00
    ]);
    
    log('Appending corrupt data ('+corrupt.length+' bytes)...', 'warn');
    sb.appendBuffer(corrupt);
    
    await new Promise((resolve, reject) => {
      const t = setTimeout(() => { sb.removeEventListener('updateend', onUp); resolve('timeout'); }, 3000);
      const onUp = () => { clearTimeout(t); sb.removeEventListener('error', onErr); resolve('ok'); };
      const onErr = (e) => { clearTimeout(t); sb.removeEventListener('updateend', onUp); resolve('error'); };
      sb.addEventListener('updateend', onUp);
      sb.addEventListener('error', onErr);
    });
    
    log('Corrupt append completed', 'ok');
    URL.revokeObjectURL(url);
    
  } catch(e) {
    log('Corrupt MSE error: '+e.name+': '+e.message, 'err');
  }
}

async function testMSERace() {
  log('=== MSE Race: seek + append ===', 'ok');
  const v = document.getElementById('v');
  
  try {
    const ms = new MediaSource();
    const url = URL.createObjectURL(ms);
    v.src = url;
    
    await new Promise(r => ms.addEventListener('sourceopen', r, {once:true}));
    
    const sb = ms.addSourceBuffer('video/mp4');
    const data = new Uint8Array(100);
    
    // Race
    sb.appendBuffer(data);
    v.currentTime = 100;
    sb.appendBuffer(data);
    v.currentTime = 0;
    
    log('Race triggered', 'ok');
    URL.revokeObjectURL(url);
    
  } catch(e) {
    log('Race error: '+e.name+': '+e.message, 'err');
  }
}

// ============================================================
// 2. Worker Fuzzing
// ============================================================
function startWorkerFuzz() {
  if (worker) { log('Worker already running', 'warn'); return; }
  
  log('Starting Worker fuzz...', 'ok');
  
  const workerCode = `
    self.onmessage = function(e) {
      const cmd = e.data;
      if (cmd === 'fuzz') {
        // Fuzz ArrayBuffer operations
        for (let i = 0; i < 1000; i++) {
          try {
            const size = Math.floor(Math.random() * 0x100000);
            const ab = new ArrayBuffer(size);
            const view = new Uint8Array(ab);
            view[0] = i & 0xFF;
            
            // Try various TypedArray views
            new Int32Array(ab);
            new Float64Array(ab);
            
            // Try DataView
            const dv = new DataView(ab);
            dv.setUint32(0, 0xDEADBEEF, true);
            
          } catch(err) {
            self.postMessage({type:'error', msg:err.message});
          }
        }
        self.postMessage({type:'done', msg:'Fuzz complete'});
      }
    };
  `;
  
  const blob = new Blob([workerCode], {type: 'application/javascript'});
  worker = new Worker(URL.createObjectURL(blob));
  
  worker.onmessage = (e) => {
    if (e.data.type === 'error') log('Worker: '+e.data.msg, 'err');
    else if (e.data.type === 'done') log('Worker: '+e.data.msg, 'ok');
  };
  
  worker.onerror = (e) => {
    log('Worker ERROR: '+e.message, 'err');
  };
  
  fuzzRunning = true;
  worker.postMessage('fuzz');
}

function stopWorkerFuzz() {
  if (worker) {
    worker.terminate();
    worker = null;
    fuzzRunning = false;
    log('Worker stopped', 'ok');
  }
}

// ============================================================
// 3. Canvas 2D Fuzzing
// ============================================================
function testCanvasFuzz() {
  log('=== Canvas 2D Fuzz ===', 'ok');
  try {
    const canvas = document.createElement('canvas');
    canvas.width = 320;
    canvas.height = 240;
    const ctx = canvas.getContext('2d');
    
    // Fuzz drawing operations
    ctx.fillStyle = '#FF0000';
    ctx.fillRect(0, 0, 320, 240);
    
    ctx.strokeStyle = '#00FF00';
    ctx.lineWidth = 999;
    ctx.strokeRect(-100, -100, 1000, 1000);
    
    ctx.font = '999px Arial';
    ctx.fillText('A', 0, 0);
    
    ctx.globalAlpha = -1;
    ctx.fillRect(0, 0, 10, 10);
    
    ctx.globalAlpha = 2;
    ctx.fillRect(0, 0, 10, 10);
    
    ctx.setTransform(0, 0, 0, 0, 0, 0);
    ctx.fillRect(0, 0, 10, 10);
    
    ctx.setTransform(1e308, 0, 0, 1e308, 0, 0);
    ctx.fillRect(0, 0, 10, 10);
    
    log('Canvas fuzz: completed', 'ok');
    
  } catch(e) {
    log('Canvas fuzz error: '+e.name+': '+e.message, 'err');
  }
}

function testCanvasImage() {
  log('=== Canvas Image Data ===', 'ok');
  try {
    const canvas = document.createElement('canvas');
    canvas.width = 1;
    canvas.height = 1;
    const ctx = canvas.getContext('2d');
    
    const imgData = ctx.createImageData(0x10000, 0x10000);
    log('createImageData(0x10000, 0x10000): '+imgData.data.length+' bytes', 'info');
    
  } catch(e) {
    log('Canvas image error: '+e.name+': '+e.message, 'err');
  }
}

// ============================================================
// 4. Atomics Probe
// ============================================================
function probeAtomics() {
  log('=== Atomics Probe ===', 'ok');
  try {
    log('typeof Atomics: '+typeof Atomics, 'info');
    log('Atomics.add: '+typeof Atomics.add, 'info');
    log('Atomics.load: '+typeof Atomics.load, 'info');
    log('Atomics.store: '+typeof Atomics.store, 'info');
    log('Atomics.compareExchange: '+typeof Atomics.compareExchange, 'info');
    
    // Try with regular ArrayBuffer (not SharedArrayBuffer)
    const ab = new ArrayBuffer(8);
    const i32 = new Int32Array(ab);
    i32[0] = 42;
    
    try {
      Atomics.add(i32, 0, 1);
      log('Atomics.add on regular ArrayBuffer: succeeded', 'ok');
    } catch(e) {
      log('Atomics.add on regular ArrayBuffer: '+e.name+': '+e.message, 'warn');
    }
    
  } catch(e) {
    log('Atomics probe error: '+e.name+': '+e.message, 'err');
  }
}

// Global handlers
window.onerror = (m,u,l,c,e) => { log('GLOBAL: '+m+' @'+l+':'+c, 'err'); };
window.onunhandledrejection = e => { log('REJECTION: '+e.reason, 'err'); };

log('PoC v3 loaded. MediaSource + Worker ready.', 'ok');
</script>
</body>
</html>
