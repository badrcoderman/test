<script>
// ============================================================
// MP4 Corruption Strategies (Base64 encoded)
// ============================================================
const MP4_STRATEGIES = ''' + str({k: v for k, v in b64_strategies.items()}).replace("'", '"') + ''';

const logEl = document.getElementById('log');
const v = document.getElementById('v');
let running = false;
let abortController = null;

function log(msg, cls='info') {
  const time = new Date().toLocaleTimeString('en-GB');
  const line = document.createElement('div');
  line.className = cls;
  line.textContent = `[${time}] ${msg}`;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
  console.log(`[${cls.toUpperCase()}] ${msg}`);
}

function clearLog() { logEl.innerHTML = ''; }

// ============================================================
// System Detection
// ============================================================
function detectSystem() {
  const info = [];
  info.push(`User-Agent: ${navigator.userAgent}`);
  info.push(`Platform: ${navigator.platform}`);
  info.push(`MSE Supported: ${!!window.MediaSource}`);
  info.push(`MediaSource.isTypeSupported(video/mp4): ${window.MediaSource ? MediaSource.isTypeSupported('video/mp4') : 'N/A'}`);
  info.push(`MediaSource.isTypeSupported(video/mp4; codecs=avc1.42E01E): ${window.MediaSource ? MediaSource.isTypeSupported('video/mp4; codecs="avc1.42E01E"') : 'N/A'}`);
  info.push(`Video.canPlayType: ${v.canPlayType('video/mp4')}`);
  info.push(`Blob: ${!!window.Blob}`);
  info.push(`URL.createObjectURL: ${!!window.URL?.createObjectURL}`);
  info.push(`SharedArrayBuffer: ${typeof SharedArrayBuffer}`);
  info.push(`Atomics: ${typeof Atomics}`);
  info.push(`WebAssembly: ${typeof WebAssembly}`);
  info.push(`AudioContext: ${typeof AudioContext}`);
  info.push(`navigator.gpu: ${typeof navigator.gpu}`);
  info.push(`TransformStream: ${typeof TransformStream}`);
  document.getElementById('sysinfo').innerHTML = info.map(s => `<div>${s}</div>`).join('');
}

// ============================================================
// Strategy Runner
// ============================================================
async function runStrategy(name, b64data) {
  const row = document.getElementById(`row-${name}`);
  const status = document.getElementById(`status-${name}`);
  status.textContent = 'RUNNING...';
  status.className = 'status status-pending';
  
  try {
    const bytes = Uint8Array.from(atob(b64data), c => c.charCodeAt(0));
    log(`Strategy [${name}]: ${bytes.length} bytes`, 'info');
    
    const ms = new MediaSource();
    const url = URL.createObjectURL(ms);
    
    const video = document.createElement('video');
    video.muted = true;
    video.src = url;
    
    await new Promise((resolve, reject) => {
      const timeout = setTimeout(() => reject(new Error('sourceopen timeout')), 5000);
      ms.addEventListener('sourceopen', () => {
        clearTimeout(timeout);
        resolve();
      }, { once: true });
    });
    
    const mime = 'video/mp4; codecs="avc1.42E01E"';
    if (!MediaSource.isTypeSupported(mime)) {
      log(`Strategy [${name}]: MIME not supported, skipping`, 'warn');
      status.textContent = 'SKIP';
      status.className = 'status';
      URL.revokeObjectURL(url);
      return;
    }
    
    const sb = ms.addSourceBuffer(mime);
    
    // Append corrupted data
    sb.appendBuffer(bytes);
    
    await new Promise((resolve, reject) => {
      const onUpdate = () => {
        sb.removeEventListener('updateend', onUpdate);
        sb.removeEventListener('error', onError);
        resolve();
      };
      const onError = (e) => {
        sb.removeEventListener('updateend', onUpdate);
        sb.removeEventListener('error', onError);
        reject(new Error(`SourceBuffer error: ${e.message || 'unknown'}`));
      };
      sb.addEventListener('updateend', onUpdate);
      sb.addEventListener('error', onError);
      
      // Also timeout
      setTimeout(() => {
        sb.removeEventListener('updateend', onUpdate);
        sb.removeEventListener('error', onError);
        resolve(); // timeout is not necessarily a crash
      }, 3000);
    });
    
    // Try to trigger playback
    try { video.play(); } catch(e) {}
    
    // Check for crash indicators
    await new Promise(r => setTimeout(r, 500));
    
    if (ms.readyState === 'closed') {
      log(`Strategy [${name}]: MediaSource closed unexpectedly (possible crash)`, 'error');
      status.textContent = 'CRASH?';
      status.className = 'status status-crash';
    } else {
      log(`Strategy [${name}]: Completed without crash`, 'ok');
      status.textContent = 'OK';
      status.className = 'status status-ok';
    }
    
    URL.revokeObjectURL(url);
    
  } catch (e) {
    log(`Strategy [${name}]: Exception — ${e.name}: ${e.message}`, 'error');
    status.textContent = 'ERROR';
    status.className = 'status status-crash';
  }
}

async function runAll() {
  if (running) return;
  running = true;
  log('=== Starting Full Fuzzing Run ===', 'ok');
  
  for (const [name, b64] of Object.entries(MP4_STRATEGIES)) {
    if (!running) { log('Stopped by user', 'warn'); break; }
    await runStrategy(name, b64);
    await new Promise(r => setTimeout(r, 500));
  }
  
  running = false;
  log('=== Fuzzing Run Complete ===', 'ok');
}

function stopAll() {
  running = false;
  log('Stop requested', 'warn');
}

// Race Condition Tests
// ============================================================
async function raceSeekAppend() {
  log('=== Race: seek + appendBuffer ===', 'info');
  try {
    const ms = new MediaSource();
    const url = URL.createObjectURL(ms);
    v.src = url;
    
    await new Promise((resolve) => {
      ms.addEventListener('sourceopen', resolve, { once: true });
    });
    
    const sb = ms.addSourceBuffer('video/mp4; codecs="avc1.42E01E"');
    const data = Uint8Array.from(atob(MP4_STRATEGIES.standard), c => c.charCodeAt(0));
    
    // Race: seek while appending
    sb.appendBuffer(data);
    v.currentTime = 9999;
    sb.appendBuffer(data);
    v.currentTime = 0;
    
    await new Promise(r => setTimeout(r, 1000));
    log('Race seek+append: completed', v.error ? 'error' : 'ok');
    URL.revokeObjectURL(url);
  } catch (e) {
    log(`Race seek+append: ${e.message}`, 'error');
  }
}

async function raceRemoveAppend() {

  try {
    const ms = new MediaSource();

    v.src = url;

    const data = Uint8Array.from(atob(MP4_STRATEGIES.standard), c => c.charCodeAt(0));
    
    sb.appendBuffer(data);
    await new Promise(r => sb.addEventListener('updateend', r, { once: true }));
    
    // Race: remove while appending
    sb.remove(0, 1);
    sb.appendBuffer(data);
    
    await new Promise(r => setTimeout(r, 1000));
    log('Race remove+append: completed', v.error ? 'error' : 'ok');
    URL.revokeObjectURL(url);
  } catch (e) {
    log(`Race remove+append: ${e.message}`, 'error');
  }
}

async function rapidSeekLoop() {

// ============================================================
