// PoC HTML for PS5 WebKit
<script>
const mp4Blob = new Blob([malformedMp4ArrayBuffer], {type: 'video/mp4'});
const url = URL.createObjectURL(mp4Blob);

const video = document.createElement('video');
video.src = url;

// Monitor for crashes
video.onerror = (e) => {
    console.log('Error:', video.error.code, video.error.message);
    // Error 4 = MEDIA_ERR_SRC_NOT_SUPPORTED
    // Error 3 = MEDIA_ERR_DECODE
    // Custom error = potential crash indicator
};

video.onloadedmetadata = () => {
    console.log('Metadata loaded — parser survived initial pass');
};

// Force parsing
video.play().catch(e => console.log('Play error:', e));
</script>
