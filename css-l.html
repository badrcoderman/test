<script>
const L = document.getElementById('log');
let worker = null;

function log(msg, cls='info') {
  const d = new Date().toLocaleTimeString('en-GB');
  L.innerHTML += '<div class="'+cls+'">['+d+'] '+msg+'</div>';
  L.scrollTop = L.scrollHeight;
  console.log('['+cls+'] '+msg);
}

// ============================================================
// 1. Atomics on Regular ArrayBuffer
// ============================================================
function testAtomicsBasic() {
  log('=== Atomics Basic Test ===', 'ok');
  try {
    const ab = new ArrayBuffer(64);
    const i32 = new Int32Array(ab);
    const i8 = new Int8Array(ab);
    const u32 = new Uint32Array(ab);
    const f64 = new Float64Array(ab);
    
    i32[0] = 100;
    log('i32[0] initial: '+i32[0], 'info');
    
    // Test all Atomics operations
    const ops = ['add','sub','and','or','xor'];
    for (const op of ops) {
      try {
        const r = Atomics[op](i32, 0, 1);
        log('Atomics.'+op+'(i32,0,1): old='+r+', new='+i32[0], 'ok');
      } catch(e) {
        log('Atomics.'+op+' ERROR: '+e.name, 'err');
      }
    }
    
    // Test on different TypedArrays
    try {
      u32[0] = 0xFFFFFFFF;
      const r = Atomics.add(u32, 0, 1);
      log('Atomics.add(u32,0,1): old='+r+' (0x'+r.toString(16)+'), new='+u32[0]+' (0x'+u32[0].toString(16)+')', 'ok');
    } catch(e) {
      log('Atomics on u32 ERROR: '+e.name, 'err');
    }
    
    // Test on Int8Array
    try {
      i8[0] = 127;
      const r = Atomics.add(i8, 0, 1);
      log('Atomics.add(i8,0,1): old='+r+', new='+i8[0], 'ok');
    } catch(e) {
      log('Atomics on i8 ERROR: '+e.name, 'err');
    }
    
    // Test compareExchange
    try {
      i32[0] = 42;
      const r = Atomics.compareExchange(i32, 0, 42, 999);
      log('Atomics.compareExchange(i32,0,42,999): old='+r+', new='+i32[0], 'ok');
    } catch(e) {
      log('Atomics.compareExchange ERROR: '+e.name, 'err');
    }
    
    // Test load/store
    try {
      i32[0] = 0;
      Atomics.store(i32, 0, 0xDEADBEEF);
      const r = Atomics.load(i32, 0);
      log('Atomics.store/load: 0x'+r.toString(16), 'ok');
    } catch(e) {
      log('Atomics store/load ERROR: '+e.name, 'err');
    }
    
  } catch(e) {
    log('Atomics basic error: '+e.name+': '+e.message, 'err');
  }
}

function testAtomicsRace() {
  log('=== Atomics Race Condition ===', 'ok');
  try {
    const ab = new ArrayBuffer(64);
    const i32 = new Int32Array(ab);
    i32[0] = 0;
    
    // Rapid atomic operations
    const start = performance.now();
    for (let i = 0; i < 100000; i++) {
      Atomics.add(i32, 0, 1);
    }
    const elapsed = performance.now() - start;
    
    log('100000 Atomics.add in '+elapsed.toFixed(2)+'ms', 'info');
    log('Final value: '+i32[0]+' (expected 100000)', i32[0]===100000?'ok':'err');
    
  } catch(e) {
    log('Atomics race error: '+e.name+': '+e.message, 'err');
  }
}

function testAtomicsOverflow() {
  log('=== Atomics Integer Overflow ===', 'ok');
  try {
    const ab = new ArrayBuffer(64);
    const i32 = new Int32Array(ab);
    const u32 = new Uint32Array(ab);
    
    // Signed overflow
    i32[0] = 0x7FFFFFFF;
    const r1 = Atomics.add(i32, 0, 1);
    log('Signed overflow: 0x7FFFFFFF + 1 = '+i32[0]+' (0x'+i32[0].toString(16)+')', 'info');
    
    // Unsigned overflow
    u32[0] = 0xFFFFFFFF;
    const r2 = Atomics.add(u32, 0, 1);
    log('Unsigned overflow: 0xFFFFFFFF + 1 = '+u32[0]+' (0x'+u32[0].toString(16)+')', 'info');
    
    // Negative add
    i32[0] = 0;
    Atomics.add(i32, 0, -1);
    log('0 + (-1) = '+i32[0]+' (0x'+i32[0].toString(16)+')', 'info');
    
  } catch(e) {
    log('Atomics overflow error: '+e.name+': '+e.message, 'err');
  }
}

function testAtomicsTypeConfusion() {
  log('=== Atomics Type Confusion ===', 'ok');
  try {
    // Create overlapping views
    const ab = new ArrayBuffer(16);
    const f64 = new Float64Array(ab);
    const i32 = new Int32Array(ab);
    const u8 = new Uint8Array(ab);
    
    f64[0] = 1.1;
    log('f64[0] = '+f64[0], 'info');
    log('i32[0] = 0x'+i32[0].toString(16)+', i32[1] = 0x'+i32[1].toString(16), 'info');
    
    // Atomics on f64 bytes as i32
    try {
      Atomics.add(i32, 0, 1);
      log('After Atomics.add on i32 view of f64: f64[0] = '+f64[0], 'info');
    } catch(e) {
      log('Atomics on overlapping view ERROR: '+e.name, 'err');
    }
    
    // Try Atomics on non-aligned offset
    try {
      Atomics.add(i32, 1, 1); // offset 4 bytes = aligned for i32
      log('Atomics.add at offset 1: '+i32[1], 'info');
    } catch(e) {
      log('Atomics offset ERROR: '+e.name, 'err');
    }
    
  } catch(e) {
    log('Type confusion error: '+e.name+': '+e.message, 'err');
  }
}

// ============================================================
// 2. MSE with Realistic MP4
// ============================================================
function buildMP4() {
  // Build a more realistic MP4 with proper atoms
  const ftyp = new Uint8Array([
    0x00,0x00,0x00,0x20, 0x66,0x74,0x79,0x70,
    0x69,0x73,0x6f,0x6d, 0x00,0x00,0x02,0x00,
    0x69,0x73,0x6f,0x6d, 0x6d,0x70,0x34,0x31,
    0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00
  ]);
  
  // moov with proper structure
  const mvhd = new Uint8Array([
    0x00,0x00,0x00,0x6c, 0x6d,0x76,0x68,0x64,
    0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00,
    0x00,0x00,0x00,0x00, 0x00,0x00,0x03,0xe8,
    0x00,0x00,0x00,0x00, 0x00,0x01,0x00,0x00,
    0x01,0x00,0x00,0x00, 0x00,0x00,0x00,0x00,
    0x00,0x00,0x00,0x00, 0x00,0x01,0x00,0x00,
    0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00,
    0x00,0x00,0x00,0x00, 0x00,0x01,0x00,0x00,
    0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00,
    0x00,0x00,0x00,0x00, 0x40,0x00,0x00,0x00,
    0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00,
    0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00,
    0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00,
    0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00
  ]);
  
  // trak with minimal structure
  const tkhd = new Uint8Array([
    0x00,0x00,0x00,0x5c, 0x74,0x6b,0x68,0x64,
    0x00,0x00,0x00,0x07, 0x00,0x00,0x00,0x00,
    0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x01,
    0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00,
    0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00,
    0x00,0x01,0x00,0x00, 0x00,0x00,0x00,0x00,
    0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00,
    0x01,0x40,0x00,0x00, 0x00,0xf0,0x00,0x00,
    0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00,
    0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00,
    0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00,
    0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00
  ]);
  
  const mdia = new Uint8Array([
    0x00,0x00,0x00,0x20, 0x6d,0x64,0x69,0x61,
    0x00,0x00,0x00,0x14, 0x6d,0x64,0x68,0x64,
    0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00,
    0x00,0x00,0x00,0x00, 0x00,0x00,0x03,0xe8
  ]);
  
  const trak = new Uint8Array(tkhd.length + mdia.length + 8);
  trak[0] = 0; trak[1] = 0; trak[2] = 0; trak[3] = trak.length;
  trak[4] = 0x74; trak[5] = 0x72; trak[6] = 0x61; trak[7] = 0x6b;
  trak.set(tkhd, 8);
  trak.set(mdia, 8 + tkhd.length);
  
  const moov = new Uint8Array(mvhd.length + trak.length + 8);
  moov[0] = 0; moov[1] = 0; moov[2] = 0; moov[3] = moov.length;
  moov[4] = 0x6d; moov[5] = 0x6f; moov[6] = 0x6f; moov[7] = 0x76;
  moov.set(mvhd, 8);
  moov.set(trak, 8 + mvhd.length);
  
  // mdat with some data
  const mdatData = new Uint8Array(0x100);
  mdatData[0] = 0; mdatData[1] = 0; mdatData[2] = 0; mdatData[3] = mdatData.length;
  mdatData[4] = 0x6d; mdatData[5] = 0x64; mdatData[6] = 0x61; mdatData[7] = 0x74;
  
  const mp4 = new Uint8Array(ftyp.length + moov.length + mdatData.length);
  mp4.set(ftyp, 0);
  mp4.set(moov, ftyp.length);
  mp4.set(mdatData, ftyp.length + moov.length);
  
  return mp4;
}

async function testMSEValid() {
  log('=== MSE Valid MP4 ===', 'ok');
  const v = document.createElement('video');
  v.muted = true;
  document.body.appendChild(v);
  
  try {
    const ms = new MediaSource();
    const url = URL.createObjectURL(ms);
    v.src = url;
    
    await new Promise(r => ms.addEventListener('sourceopen', r, {once:true}));
    log('MediaSource opened', 'ok');
    
    const mime = 'video/mp4; codecs="avc1.42E01E"';
    log('isTypeSupported: '+MediaSource.isTypeSupported(mime), 'info');
    
    const sb = ms.addSourceBuffer(mime);
    log('SourceBuffer created', 'ok');
    
    const data = buildMP4();
    log('Appending '+data.length+' bytes...', 'info');
    
    sb.appendBuffer(data);
    await new Promise((resolve, reject) => {
      const t = setTimeout(() => { sb.removeEventListener('updateend', onUp); resolve('timeout'); }, 5000);
      const onUp = () => { clearTimeout(t); sb.removeEventListener('error', onErr); resolve('ok'); };
      const onErr = () => { clearTimeout(t); sb.removeEventListener('updateend', onUp); resolve('error'); };
      sb.addEventListener('updateend', onUp);
      sb.addEventListener('error', onErr);
    });
    
    log('appendBuffer done', 'ok');
    
    // Don't call endOfStream — let it play
    try {
      v.play();
      log('play() called', 'info');
    } catch(e) {
      log('play() error: '+e.name, 'warn');
    }
    
    setTimeout(() => {
      log('readyState='+v.readyState+' networkState='+v.networkState, 'info');
      document.body.removeChild(v);
      URL.revokeObjectURL(url);
    }, 2000);
    
  } catch(e) {
    log('MSE error: '+e.name+': '+e.message, 'err');
    document.body.removeChild(v);
  }
}

async function testMSEMultiAppend() {
  log('=== MSE Multi Append + Race ===', 'ok');
  const v = document.createElement('video');
  v.muted = true;
  
  try {
    const ms = new MediaSource();
    const url = URL.createObjectURL(ms);
    v.src = url;
    
    await new Promise(r => ms.addEventListener('sourceopen', r, {once:true}));
    const sb = ms.addSourceBuffer('video/mp4; codecs="avc1.42E01E"');
    
    const data = buildMP4();
    
    // Multiple rapid appends
    for (let i = 0; i < 5; i++) {
      sb.appendBuffer(data);
      log('Append '+i, 'info');
      await new Promise(r => setTimeout(r, 100));
    }
    
    // Race with remove
    sb.remove(0, 1);
    sb.appendBuffer(data);
    
    log('Multi append race done', 'ok');
    URL.revokeObjectURL(url);
    
  } catch(e) {
    log('Multi append error: '+e.name+': '+e.message, 'err');
  }
}

async function testMSEChangeType() {
  log('=== MSE changeType() Fuzz ===', 'ok');
  try {
    const ms = new MediaSource();
    const url = URL.createObjectURL(ms);
    const v = document.createElement('video');
    v.src = url;
    
    await new Promise(r => ms.addEventListener('sourceopen', r, {once:true}));
    const sb = ms.addSourceBuffer('video/mp4; codecs="avc1.42E01E"');
    
    const data = buildMP4();
    sb.appendBuffer(data);
    await new Promise(r => sb.addEventListener('updateend', r, {once:true}));
    
    // Try changeType to invalid codec
    try {
      sb.changeType('video/mp4; codecs="invalid"');
      log('changeType to invalid: accepted', 'warn');
    } catch(e) {
      log('changeType to invalid: '+e.name, 'info');
    }
    
    // Try changeType to audio
    try {
      sb.changeType('audio/mp4');
      log('changeType to audio: accepted', 'warn');
    } catch(e) {
      log('changeType to audio: '+e.name, 'info');
    }
    
    URL.revokeObjectURL(url);
    
  } catch(e) {
    log('changeType error: '+e.name+': '+e.message, 'err');
  }
}

// ============================================================
// 3. Canvas Heap Spray
// ============================================================
function testCanvasSpray() {
  log('=== Canvas Heap Spray ===', 'ok');
  try {
    const canvases = [];
    const count = 100;
    
    for (let i = 0; i < count; i++) {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = 'rgb('+(i%256)+',0,0)';
      ctx.fillRect(0, 0, 256, 256);
      canvases.push(c);
    }
    
    log('Created '+count+' canvases (256x256)', 'ok');
    log('Approx memory: '+(count * 256 * 256 * 4 / 1024 / 1024).toFixed(2)+' MB', 'info');
    
  } catch(e) {
    log('Canvas spray error: '+e.name+': '+e.message, 'err');
  }
}

function testCanvasLimit() {
  log('=== Canvas Size Limit ===', 'ok');
  try {
    const sizes = [0x1000, 0x4000, 0x8000, 0x10000, 0x20000];
    
    for (const size of sizes) {
      try {
        const c = document.createElement('canvas');
        c.width = size;
        c.height = size;
        const ctx = c.getContext('2d');
        ctx.fillRect(0, 0, 1, 1);
        const mem = (size * size * 4 / 1024 / 1024).toFixed(2);
        log(size+'x'+size+' ('+mem+'MB): OK', 'ok');
      } catch(e) {
        log(size+'x'+size+': '+e.name, 'err');
      }
    }
    
    // Find max imageData
    for (const size of [0x1000, 0x4000, 0x8000, 0x10000]) {
      try {
        const c = document.createElement('canvas');
        c.width = 1;
        c.height = 1;
        const ctx = c.getContext('2d');
        const id = ctx.createImageData(size, size);
        const mem = (size * size * 4 / 1024 / 1024).toFixed(2);
        log('createImageData('+size+','+size+') '+mem+'MB: OK', 'ok');
      } catch(e) {
        log('createImageData('+size+','+size+'): '+e.name+': '+e.message, 'err');
      }
    }
    
  } catch(e) {
    log('Canvas limit error: '+e.name+': '+e.message, 'err');
  }
}

// ============================================================
// 4. Worker + Atomics
// ============================================================
function startWorkerAtomics() {
  if (worker) { log('Worker already running', 'warn'); return; }
  
  log('Starting Worker + Atomics...', 'ok');
  
  const workerCode = `
    self.onmessage = function(e) {
      if (e.data.cmd === 'start') {
        const ab = e.data.buffer;
        const i32 = new Int32Array(ab);
        
        // Rapid atomic operations from worker
        for (let i = 0; i < 1000000; i++) {
          Atomics.add(i32, 0, 1);
        }
        
        self.postMessage({type:'done', value: Atomics.load(i32, 0)});
      }
    };
  `;
  
  const blob = new Blob([workerCode], {type: 'application/javascript'});
  worker = new Worker(URL.createObjectURL(blob));
  
  const ab = new ArrayBuffer(64);
  const i32 = new Int32Array(ab);
  i32[0] = 0;
  
  // Main thread also does atomics
  const start = performance.now();
  
  worker.onmessage = (e) => {
    const elapsed = performance.now() - start;
    log('Worker done: value='+e.data.value+' in '+elapsed.toFixed(2)+'ms', 'ok');
    log('Main thread value: '+i32[0], 'info');
  };
  
  worker.onerror = (e) => {
    log('Worker ERROR: '+e.message, 'err');
  };
  
  // Main thread does atomics simultaneously
  for (let i = 0; i < 100000; i++) {
    Atomics.add(i32, 0, 1);
  }
  
  worker.postMessage({cmd:'start', buffer:ab});
}

function stopWorker() {
  if (worker) {
    worker.terminate();
    worker = null;
    log('Worker stopped', 'ok');
  }
}

// Global handlers
window.onerror = (m,u,l,c,e) => { log('GLOBAL: '+m+' @'+l+':'+c, 'err'); };
window.onunhandledrejection = e => { log('REJECTION: '+e.reason, 'err'); };

log('PoC v4 loaded. Atomics + MSE + Worker ready.', 'ok');
</script>
