<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>WebKit ImageData Vulnerability Check (Bug 320519)</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .vulnerable { color: red; font-weight: bold; }
        .patched { color: green; font-weight: bold; }
        .unknown { color: orange; font-weight: bold; }
    </style>
</head>
<body>
    <h2>اختبار ثغرة ImageData Mismatch (WebKit Bug 320519)</h2>
    <div id="result">جاري فحص المتصفح...</div>

    <script>
   (function() {
    'use strict';

    // 1. إنشاء عناصر واجهة المستخدم لعرض السجلات مباشرة على الشاشة (HUD Overlay)
    const loggerContainer = document.createElement('div');
    loggerContainer.id = 'ps5-key-logger-overlay';
    loggerContainer.style.position = 'fixed';
    loggerContainer.style.top = '10px';
    loggerContainer.style.left = '10px';
    loggerContainer.style.width = '450px';
    loggerContainer.style.maxHeight = '300px';
    loggerContainer.style.overflowY = 'auto';
    loggerContainer.style.backgroundColor = 'rgba(0, 0, 0, 0.85)';
    loggerContainer.style.color = '#00ffcc';
    loggerContainer.style.fontFamily = 'monospace';
    loggerContainer.style.fontSize = '14px';
    loggerContainer.style.padding = '12px';
    loggerContainer.style.zIndex = '999999';
    loggerContainer.style.border = '2px solid #00ffcc';
    loggerContainer.style.borderRadius = '8px';
    loggerContainer.style.boxShadow = '0 0 15px rgba(0,255,204,0.4)';

    loggerContainer.innerHTML = '<div style="border-bottom: 1px solid #00ffcc; padding-bottom: 5px; margin-bottom: 8px; font-weight: bold;">[PS5 Screen Logger Active]</div><div id="log-content"></div>';
    
    // الانتظار حتى تحميل الصفحة بالكامل لإدراج العنصر
    if (document.body) {
        document.body.appendChild(loggerContainer);
    } else {
        window.addEventListener('DOMContentLoaded', () => document.body.appendChild(loggerContainer));
    }

    const logContent = loggerContainer.querySelector('#log-content');

    function writeLog(text) {
        const timestamp = new Date().toLocaleTimeString();
        const logEntry = document.createElement('div');
        logEntry.textContent = `[${timestamp}] ${text}`;
        logContent.appendChild(logEntry);
        loggerContainer.scrollTop = loggerContainer.scrollHeight;
    }

    writeLog("Logger initialized successfully. Listening for input events...");

    // 2. التقاط أحداث لوحة المفاتيح وأزرار التحكم
    window.addEventListener('keydown', function(event) {
        let keyInfo = `Key: "${event.key}" | Code: ${event.code} | Which: ${event.which || event.keyCode}`;
        
        // تفصيل الأزرار الخاصة أو المعدلة
        if (event.ctrlKey) keyInfo += " [CTRL]";
        if (event.shiftKey) keyInfo += " [SHIFT]";
        if (event.altKey) keyInfo += " [ALT]";

        writeLog(keyInfo);
        console.log("[PS5 Logger] " + keyInfo);
    }, true);

    // 3. التقاط أحداث التركيز وفقدانه للتأكد من بقاء رصد الإدخال نشطاً
    window.addEventListener('focus', () => writeLog("Window focused - Input active."), true);
    window.addEventListener('blur', () => writeLog("Window lost focus."), true);

    writeLog("Ready. Type using your connected input device.");
})();


    </script>
</body>
</html>
