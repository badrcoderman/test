<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>WebKit ImageData Vulnerability Check (Bug 320519)</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .vulnerable { color: red; font-weight: bold; }
        .patched { color: green; font-weight: bold; }
        .unknown { color: orange; font-weight: bold; }
    </style>
</head>
<body>
    <h2>اختبار ثغرة ImageData Mismatch (WebKit Bug 320519)</h2>
    <div id="result">جاري فحص المتصفح...</div>

    <script>
        function checkVulnerability() {
            const resultDiv = document.getElementById('result');

            // 1. التحقق من دعم الخصائص الحديثة أولاً
            if (typeof ImageData === 'undefined') {
                resultDiv.className = 'unknown';
                resultDiv.innerText = "المتصفح لا يدعم ImageData بشكل كامل.";
                return;
            }

            try {
                // محاولة إنشاء ImageData بمصفوفة Uint8ClampedArray لكن مع خيار rgba-float16
                // هذا التضارب هو مصدر الثغرة الأصلية
                const dummyArray = new Uint8ClampedArray(4);
                const testData = new ImageData(dummyArray, 1, 1, {
                    colorSpace: "srgb",
                    pixelFormat: "rgba-float16"
                });

                // إذا وصلنا لهذه النقطة دون إلقاء Exception، فالمتصفح لم يقضِ على التضارب (مصاب)
                resultDiv.className = 'vulnerable';
                resultDiv.innerHTML = "⚠️ المتصفح <b>مصاب (Vulnerable)</b>: تم قبول ImageData بتنسيق غير متطابق دون إلقاء خطأ.";
            } catch (e) {
                // المتصفح المحصن يجب أن يلقي InvalidStateError بحسب المواصفات الترقيعية
                if (e.name === 'InvalidStateError' || e.message.includes('Mismatched pixel formats')) {
                    resultDiv.className = 'patched';
                    resultDiv.innerHTML = "✅ المتصفح <b>آمن / محصّن (Patched)</b>: تم إلقاء استثناء InvalidStateError بنجاح.";
                } else {
                    resultDiv.className = 'unknown';
                    resultDiv.innerHTML = `نتيجة غير متوقعة: (${e.name} - ${e.message})`;
                }
            }
        }

        // تشغيل الفحص عند تحميل الصفحة
        window.onload = checkVulnerability;
    </script>
</body>
</html>
