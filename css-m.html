<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ImageData pixelFormat Mismatch PoC</title>
  <style>
    body { background: #0d0d0d; color: #e0e0e0; font-family: monospace; padding: 24px; }
    h1 { color: #ff4444; font-size: 1.1rem; margin-bottom: 16px; }
    .result { margin: 8px 0; padding: 8px 12px; border-left: 3px solid #333; font-size: 0.9rem; }
    .pass { border-color: #44ff88; color: #44ff88; }
    .fail { border-color: #ff4444; color: #ff4444; }
    .info { border-color: #4488ff; color: #4488ff; }
    pre { background: #1a1a1a; padding: 12px; border-radius: 4px; overflow-x: auto; font-size: 0.8rem; color: #ccc; }
  </style>
</head>
<body>
  <h1>PoC — ImageData pixelFormat Mismatch (CVE/Bug 320519)</h1>
  <div id="output"></div>

  <script>
    const out = document.getElementById('output');

    function log(msg, type = 'info') {
      const div = document.createElement('div');
      div.className = `result ${type}`;
      div.textContent = msg;
      out.appendChild(div);
    }

    function logCode(code) {
      const pre = document.createElement('pre');
      pre.textContent = code;
      out.appendChild(pre);
    }

    function runTest(label, fn, expectError, expectedName) {
      try {
        fn();
        if (expectError) {
          log(`[FAIL] ${label} — expected ${expectedName}, but no exception was thrown`, 'fail');
        } else {
          log(`[PASS] ${label} — no exception thrown as expected`, 'pass');
        }
      } catch (e) {
        if (expectError) {
          if (e.name === expectedName) {
            log(`[PASS] ${label} — threw ${e.name}: ${e.message}`, 'pass');
          } else {
            log(`[FAIL] ${label} — threw ${e.name} instead of ${expectedName}: ${e.message}`, 'fail');
          }
        } else {
          log(`[FAIL] ${label} — unexpected exception ${e.name}: ${e.message}`, 'fail');
        }
      }
    }

    log('Browser: ' + navigator.userAgent, 'info');
    log('--- BEGIN TESTS ---', 'info');

    // --- Test 1: Uint8ClampedArray with rgba-float16 should throw InvalidStateError ---
    logCode('new ImageData(new Uint8ClampedArray(4), 1, 1, { colorSpace: "srgb", pixelFormat: "rgba-float16" })');
    runTest(
      'Uint8ClampedArray + rgba-float16',
      () => new ImageData(new Uint8ClampedArray(4), 1, 1, { colorSpace: 'srgb', pixelFormat: 'rgba-float16' }),
      true,
      'InvalidStateError'
    );

    // --- Test 2: Float16Array with rgba-unorm8 should throw InvalidStateError ---
    // Float16Array may not exist in all browsers; guard it
    if (typeof Float16Array !== 'undefined') {
      logCode('new ImageData(new Float16Array(4), 1, 1, { colorSpace: "srgb", pixelFormat: "rgba-unorm8" })');
      runTest(
        'Float16Array + rgba-unorm8',
        () => new ImageData(new Float16Array(4), 1, 1, { colorSpace: 'srgb', pixelFormat: 'rgba-unorm8' }),
        true,
        'InvalidStateError'
      );
    } else {
      log('[SKIP] Float16Array not available in this engine — Test 2 skipped', 'info');
    }

    // --- Test 3: Matching types — should NOT throw ---
    logCode('new ImageData(new Uint8ClampedArray(4), 1, 1, { colorSpace: "srgb", pixelFormat: "rgba-unorm8" })');
    runTest(
      'Uint8ClampedArray + rgba-unorm8 (valid)',
      () => new ImageData(new Uint8ClampedArray(4), 1, 1, { colorSpace: 'srgb', pixelFormat: 'rgba-unorm8' }),
      false,
      null
    );

    // --- Test 4: Float16Array + rgba-float16 — should NOT throw ---
    if (typeof Float16Array !== 'undefined') {
      logCode('new ImageData(new Float16Array(4), 1, 1, { colorSpace: "srgb", pixelFormat: "rgba-float16" })');
      runTest(
        'Float16Array + rgba-float16 (valid)',
        () => new ImageData(new Float16Array(4), 1, 1, { colorSpace: 'srgb', pixelFormat: 'rgba-float16' }),
        false,
        null
      );
    } else {
      log('[SKIP] Float16Array not available — Test 4 skipped', 'info');
    }

    // --- Test 5: colorSpace variants ---
    const colorSpaces = ['srgb', 'display-p3', 'display-p3-linear', 'srgb-linear'];
    colorSpaces.forEach(cs => {
      logCode(`new ImageData(new Uint8ClampedArray(4), 1, 1, { colorSpace: "${cs}", pixelFormat: "rgba-float16" })`);
      runTest(
        `Uint8ClampedArray + rgba-float16 [colorSpace: ${cs}]`,
        () => new ImageData(new Uint8ClampedArray(4), 1, 1, { colorSpace: cs, pixelFormat: 'rgba-float16' }),
        true,
        'InvalidStateError'
      );
    });

    log('--- END TESTS ---', 'info');
  </script>
</body>
</html>
